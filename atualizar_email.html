<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atualizar E-mail de Acesso - Gestão de Redes</title>
  <style>
    :root {
      --bg: #0D0F12;
      --card-bg: #161B22;
      --card-border: #30363D;
      --input-bg: #0D1117;
      --text: #F0F6FC;
      --text-muted: #8B949E;
      --primary: #6E56CF;
      --primary-hover: #5B45B0;
      --success: #23D160;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px 12px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { max-width: 500px; width: 100%; background: var(--card-bg); padding: 32px; border-radius: 16px; border: 1px solid var(--card-border); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
    
    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 1.5rem; font-weight: 700; margin-top: 6px; }
    .badge-topo { display: inline-block; background: var(--primary); color: #FFF; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; text-transform: uppercase; }

    .form-group { margin-bottom: 16px; text-align: left; }
    label { display: block; font-weight: 500; font-size: 0.82rem; margin-bottom: 6px; color: var(--text-muted); text-transform: uppercase; }
    input, select { width: 100%; padding: 12px 14px; background-color: var(--input-bg); border: 1px solid var(--card-border); border-radius: 8px; font-size: 0.95rem; color: var(--text); outline: none; }
    input:focus, select:focus { border-color: var(--primary); }
    select option { background-color: var(--card-bg); color: var(--text); }

    .btn { background-color: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 1rem; width: 100%; margin-top: 10px; transition: 0.2s; }
    .btn:hover { background-color: var(--primary-hover); }
    .success-box { display: none; text-align: center; padding: 20px; color: var(--success); font-weight: 600; }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="container">
  <div class="header">
    <span class="badge-topo">IGREJA DA FAMÍLIA - TEJIPIÓ</span>
    <h1>✉️ Cadastrar Seu E-mail</h1>
    <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 6px;">Informe seus dados para configurar seu acesso ao sistema.</p>
  </div>

  <form id="formAtualizar" onsubmit="salvarEmail(event)">
    <div class="form-group">
      <label>1. Sua Função</label>
      <select id="selectFuncao" onchange="carregarNomes()" required>
        <option value="">Selecione...</option>
        <option value="Líder">Líder de Rede</option>
        <option value="Supervisor">Supervisor(a)</option>
      </select>
    </div>

    <div class="form-group">
      <label>2. Seu Nome</label>
      <select id="selectNome" required disabled>
        <option value="">Primeiro escolha a função...</option>
      </select>
    </div>

    <div class="form-group">
      <label>3. Seu E-mail de Acesso</label>
      <input type="email" id="inputEmail" placeholder="seu.email@exemplo.com" required>
    </div>

    <button type="submit" class="btn" id="btnSalvar">Salvar Meu E-mail</button>
  </form>

  <div id="successBox" class="success-box">
    <h3>✅ E-mail cadastrado com sucesso!</h3>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 8px;">Seu cadastro foi atualizado com sucesso. Em breve você poderá utilizá-lo para acessar o sistema.</p>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB7FJXs9wiRFYIs2ugZoWrw7jTXPR5weGk",
    authDomain: "app-redes-iftejipio.firebaseapp.com",
    projectId: "app-redes-iftejipio",
    storageBucket: "app-redes-iftejipio.firebasestorage.app",
    messagingSenderId: "954529090793",
    appId: "1:954529090793:web:6702d102b6e5b178b6b478",
    measurementId: "G-2MJ96WMYQ5"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let listaOpcoes = [];

  async function carregarNomes() {
    const funcao = document.getElementById('selectFuncao').value;
    const selectNome = document.getElementById('selectNome');
    
    selectNome.innerHTML = '<option value="">Carregando...</option>';
    selectNome.disabled = true;

    if (!funcao) {
      selectNome.innerHTML = '<option value="">Primeiro escolha a função...</option>';
      return;
    }

    try {
      listaOpcoes = [];
      const snapshot = await db.collection('membros')
        .where('categoria', 'in', funcao === 'Líder' ? ['Líder', 'Lider'] : ['Supervisor'])
        .get();

      snapshot.forEach(doc => {
        const d = doc.data();
        if (d.status !== 'INATIVO' && d.nome) {
          let detalheText = '';
          if (funcao === 'Líder') {
            const nomeSupervisao = d.supervisao || 'Geral';
            detalheText = `Rede: ${d.rede || 'Geral'} | Supervisor(a): ${nomeSupervisao}`;
          } else {
            detalheText = `Supervisor(a) do Ministério ${d.ministerio || 'TOPO'}`;
          }
          listaOpcoes.push({ id: doc.id, nome: d.nome, detalhe: detalheText });
        }
      });

      selectNome.innerHTML = '<option value="">Selecione seu nome...</option>';
      listaOpcoes.sort((a, b) => a.nome.localeCompare(b.nome)).forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.id;
        opt.textContent = `${item.nome} (${item.detalhe})`;
        selectNome.appendChild(opt);
      });
      selectNome.disabled = false;
    } catch (err) {
      console.error(err);
      alert("Erro ao carregar nomes.");
    }
  }

  async function salvarEmail(e) {
    e.preventDefault();
    const docId = document.getElementById('selectNome').value;
    const email = document.getElementById('inputEmail').value.trim().toLowerCase();

    if (!docId || !email) return alert("Preencha todos os campos.");

    const btn = document.getElementById('btnSalvar');
    btn.disabled = true;
    btn.innerText = "Salvando...";

    try {
      await db.collection('membros').doc(docId).update({ email: email });

      document.getElementById('formAtualizar').style.display = 'none';
      document.getElementById('successBox').style.display = 'block';
    } catch (err) {
      console.error(err);
      alert("Erro ao salvar o e-mail. Tente novamente.");
      btn.disabled = false;
      btn.innerText = "Salvar Meu E-mail";
    }
  }
</script>

</body>
</html>
