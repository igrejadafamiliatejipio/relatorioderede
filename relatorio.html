<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatório de Rede - Ministério TOPO</title>
  <style>
    :root {
      --bg: #0D0F12;
      --card-bg: #161B22;
      --card-border: #30363D;
      --input-bg: #0D1117;
      --text: #F0F6FC;
      --text-muted: #8B949E;
      --primary: #6E56CF;
      --primary-hover: #5B45B0;
      --success: #23D160;
      --warning: #E3B341;
      --danger: #E5534B;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px 12px; display: flex; justify-content: center; min-height: 100vh; }
    .container { max-width: 680px; width: 100%; background: var(--card-bg); padding: 28px; border-radius: 16px; border: 1px solid var(--card-border); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }

    .top-nav { display: flex; justify-content: space-between; margin-bottom: 20px; }
    .btn-voltar { background: #21262D; color: var(--text); border: 1px solid var(--card-border); padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; text-decoration: none; }
    .btn-voltar:hover { background: #30363D; }

    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 1.6rem; font-weight: 700; margin-top: 6px; }
    .badge-topo { display: inline-block; background: var(--primary); color: #FFF; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }

    .info-rede-box { background: var(--input-bg); border: 1px solid var(--card-border); padding: 14px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 0.9rem; color: var(--text-muted); }
    .info-rede-box strong { color: var(--text); }

    .form-group { margin-bottom: 16px; text-align: left; }
    .row { display: flex; gap: 12px; }
    .row .form-group { flex: 1; }

    label { display: block; font-weight: 500; font-size: 0.82rem; margin-bottom: 6px; color: var(--text-muted); text-transform: uppercase; }
    input, select, textarea { width: 100%; padding: 12px 14px; background-color: var(--input-bg); border: 1px solid var(--card-border); border-radius: 8px; font-size: 0.95rem; color: var(--text); outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }
    textarea { resize: vertical; min-height: 80px; }
    input[type="file"] { padding: 9px; cursor: pointer; }

    .chamada-container { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 16px; margin-bottom: 16px; max-height: 320px; overflow-y: auto; }
    .chamada-item { display: flex; flex-direction: column; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--card-border); }
    .chamada-item:last-child { border-bottom: none; }
    .chamada-info { display: flex; justify-content: space-between; align-items: center; }
    .chamada-info label { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text); font-size: 0.95rem; text-transform: none; font-weight: 600; margin-bottom: 0; }
    .chamada-info input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }
    .justificativa-box { display: none; margin-left: 26px; }
    .justificativa-box input { font-size: 0.85rem; padding: 8px 10px; background: var(--card-bg); }

    .btn { background-color: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 1rem; width: 100%; margin-top: 10px; transition: 0.2s; }
    .btn:hover { background-color: var(--primary-hover); }

    @media (max-width: 500px) { .row { flex-direction: column; gap: 0; } }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="container">
  <div class="top-nav">
    <a href="lider.html" class="btn-voltar">← Voltar ao Menu</a>
  </div>

  <div class="header">
    <span class="badge-topo">MINISTÉRIO TOPO</span>
    <h1>📋 Relatório de Rede</h1>
  </div>

  <div class="info-rede-box" id="infoRedeLogada">
    Carregando informações da rede...
  </div>

  <form id="formRelatorio">
    <div class="row">
      <div class="form-group">
        <label>Data do Encontro</label>
        <input type="date" id="inputDataEncontro" required>
      </div>
      <div class="form-group">
        <label>Horário</label>
        <input type="time" id="inputHorario" required>
      </div>
    </div>

    <div class="form-group">
      <label>Local do Encontro</label>
      <input type="text" id="inputLocal" placeholder="Ex: Casa do Líder / Anexo da Igreja" required>
    </div>

    <div class="form-group">
      <label>Chamada de Membros e Líder (Marque os presentes)</label>
      <div id="chamadaContainer" class="chamada-container">
        <span style="color: var(--text-muted); font-size: 0.85rem;">Carregando membros...</span>
      </div>
    </div>

    <div class="form-group">
      <label>Visitantes (Opcional)</label>
      <input type="text" id="inputVisitantes" placeholder="Ex: Pedro Henrique, Lucas Souza">
    </div>

    <div class="form-group">
      <label>Tema da Palavra Ministrada</label>
      <input type="text" id="inputTema" placeholder="Ex: A Importância da Oração em Família" required>
    </div>

    <div class="form-group">
      <label>Resumo da Palavra / Reflexão</label>
      <textarea id="inputResumoPalavra" placeholder="Breve resumo da mensagem ministrada..." required></textarea>
    </div>

    <div class="form-group">
      <label>Resumo das Atividades / Dinâmicas</label>
      <textarea id="inputAtividades" placeholder="Comunhão, louvor, dinâmicas ou avisos..." required></textarea>
    </div>

    <div class="form-group">
      <label>Foto da Rede (Opcional)</label>
      <input type="file" id="inputFotoRede" accept="image/*">
    </div>

    <button type="submit" class="btn" id="btnSalvar">Enviar Relatório</button>
  </form>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB7FJXs9wiRFYIs2ugZoWrw7jTXPR5weGk",
    authDomain: "app-redes-iftejipio.firebaseapp.com",
    projectId: "app-redes-iftejipio",
    storageBucket: "app-redes-iftejipio.firebasestorage.app",
    messagingSenderId: "954529090793",
    appId: "1:954529090793:web:6702d102b6e5b178b6b478",
    measurementId: "G-2MJ96WMYQ5"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.firestore();

  let dadosSessao = {};
  let membrosRedeAtual = [];

  document.addEventListener("DOMContentLoaded", async () => {
    const supervisao = sessionStorage.getItem('topo_supervisao');
    const rede = sessionStorage.getItem('topo_rede');
    const lider = sessionStorage.getItem('topo_lider');

    if (!rede) {
      alert("Nenhuma rede selecionada. Faça o login novamente.");
      window.location.href = "lider.html";
      return;
    }

    dadosSessao = { supervisao, supervisor: sessionStorage.getItem('topo_supervisor'), rede, lider };
    document.getElementById('infoRedeLogada').innerHTML = `Enviando relatório da: <strong>${rede}</strong> (Líder: ${lider})`;

    await carregarMembrosRede();
  });

  async function carregarMembrosRede() {
    const container = document.getElementById('chamadaContainer');

    try {
      const snapshot = await db.collection('membros')
        .where('rede', '==', dadosSessao.rede)
        .get();

      membrosRedeAtual = [];
      snapshot.forEach(doc => {
        const data = doc.data();
        if (data.status !== 'INATIVO') {
          membrosRedeAtual.push(data);
        }
      });

      membrosRedeAtual.sort((a, b) => (a.categoria === 'Líder' ? -1 : (b.categoria === 'Líder' ? 1 : a.nome.localeCompare(b.nome))));

      renderizarChamada();
    } catch (err) {
      console.error(err);
      container.innerHTML = '<span style="color: var(--danger);">Erro ao carregar membros.</span>';
    }
  }

  function renderizarChamada() {
    const container = document.getElementById('chamadaContainer');
    container.innerHTML = '';

    if (membrosRedeAtual.length === 0) {
      container.innerHTML = '<span style="color: var(--text-muted); font-size: 0.85rem;">Nenhum membro ativo cadastrado nesta rede.</span>';
      return;
    }

    membrosRedeAtual.forEach((membro, index) => {
      const nome = membro.nome;
      const isLider = membro.categoria === 'Líder';
      const labelTexto = isLider ? `⭐ ${nome} (Líder da Rede)` : nome;

      const div = document.createElement('div');
      div.className = 'chamada-item';
      div.innerHTML = `
        <div class="chamada-info">
          <label>
            <input type="checkbox" id="membro_${index}" value="${nome}" checked onchange="toggleJustificativa(${index})">
            <span style="${isLider ? 'color: var(--success); font-weight: 700;' : ''}">${labelTexto}</span>
          </label>
        </div>
        <div class="justificativa-box" id="box_just_${index}">
          <input type="text" id="just_${index}" placeholder="Justificativa da falta (ou deixe em branco se não justificou)">
        </div>
      `;
      container.appendChild(div);
    });
  }

  function toggleJustificativa(index) {
    const checkbox = document.getElementById(`membro_${index}`);
    const boxJust = document.getElementById(`box_just_${index}`);
    if (!checkbox.checked) {
      boxJust.style.display = 'block';
    } else {
      boxJust.style.display = 'none';
      document.getElementById(`just_${index}`).value = '';
    }
  }

  // Função otimizada que comprime a imagem antes de converter para Base64 (evita estouro de limite no Firebase)
  function comprimirEConverterImagem(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = function (event) {
        const img = new Image();
        img.onload = function () {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;

          // Redimensiona mantendo a proporção para um limite máximo de 800px
          const MAX_WIDTH = 800;
          const MAX_HEIGHT = 800;
          if (width > height) {
            if (width > MAX_WIDTH) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            }
          } else {
            if (height > MAX_HEIGHT) {
              width *= MAX_HEIGHT / height;
              height = MAX_HEIGHT;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          // Converte para JPEG com 70% de qualidade (gera um arquivo bem leve)
          const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
          resolve(dataUrl);
        };
        img.onerror = (err) => reject(err);
        img.src = event.target.result;
      };
      reader.onerror = (error) => reject(error);
      reader.readAsDataURL(file);
    });
  }

  document.getElementById('formRelatorio').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('btnSalvar');
    btn.disabled = true;
    btn.innerText = "Enviando para o Firebase...";

    let presentesArr = [];
    let faltantesArr = [];

    membrosRedeAtual.forEach((membro, index) => {
      const nome = membro.nome;
      const checkbox = document.getElementById(`membro_${index}`);
      if (checkbox.checked) {
        presentesArr.push(nome);
      } else {
        const txtJust = document.getElementById(`just_${index}`).value.trim();
        const textoFalta = txtJust ? `${nome} (Justificativa: ${txtJust})` : `${nome} (Não justificou)`;
        faltantesArr.push(textoFalta);
      }
    });

    let fotoBase64 = "";
    const fileInput = document.getElementById('inputFotoRede');
    if (fileInput.files && fileInput.files[0]) {
      try {
        fotoBase64 = await comprimirEConverterImagem(fileInput.files[0]);
      } catch (err) {
        console.error("Erro ao comprimir foto:", err);
      }
    }

    const novoRelatorio = {
      dataEnvio: new Date().toISOString(),
      supervisao: dadosSessao.supervisao,
      supervisor: dadosSessao.supervisor,
      rede: dadosSessao.rede,
      lider: dadosSessao.lider,
      dataEncontro: document.getElementById('inputDataEncontro').value,
      horario: document.getElementById('inputHorario').value,
      local: document.getElementById('inputLocal').value.trim(),
      presentes: presentesArr.join(', '),
      visitantes: document.getElementById('inputVisitantes').value.trim(),
      faltantes: faltantesArr.join(', '),
      tema: document.getElementById('inputTema').value.trim(),
      resumoPalavra: document.getElementById('inputResumoPalavra').value.trim(),
      atividades: document.getElementById('inputAtividades').value.trim(),
      fotoRede: fotoBase64
    };

    try {
      await db.collection('relatorios').add(novoRelatorio);
      alert("✅ Relatório enviado com sucesso!");
      document.getElementById('formRelatorio').reset();
      await carregarMembrosRede();
    } catch (err) {
      alert("Erro ao enviar relatório. Tente novamente.");
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.innerText = "Enviar Relatório";
    }
  });
</script>

</body>
</html>
