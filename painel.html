<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel da Rede - Gestão de Redes</title>
  <style>
    :root {
      --bg: #0D0F12;
      --card-bg: #161B22;
      --card-border: #30363D;
      --input-bg: #0D1117;
      --text: #F0F6FC;
      --text-muted: #8B949E;
      --primary: #6E56CF;
      --primary-hover: #5B45B0;
      --success: #23D160;
      --warning: #E3B341;
      --danger: #E5534B;
      --info: #388BFD;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px 12px; display: flex; justify-content: center; min-height: 100vh; }
    .container { max-width: 800px; width: 100%; background: var(--card-bg); padding: 28px; border-radius: 16px; border: 1px solid var(--card-border); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }

    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .btn-voltar { background: #21262D; color: var(--text); border: 1px solid var(--card-border); padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .btn-voltar:hover { background: #30363D; }

    .header { text-align: center; margin-bottom: 24px; }
    .badge-topo { display: inline-block; background: var(--primary); color: #FFF; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; text-transform: uppercase; }

    .health-card { padding: 18px; border-radius: 12px; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; border: 1px solid transparent; }
    .health-card.green { background: rgba(35, 209, 96, 0.1); border-color: rgba(35, 209, 96, 0.3); color: var(--success); }
    .health-card.yellow { background: rgba(227, 179, 65, 0.1); border-color: rgba(227, 179, 65, 0.3); color: var(--warning); }
    .health-card.blue { background: rgba(56, 139, 253, 0.1); border-color: rgba(56, 139, 253, 0.3); color: var(--info); }

    .health-info h3 { font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
    .health-info p { font-size: 0.88rem; opacity: 0.9; }
    .health-count { font-size: 2rem; font-weight: 800; }

    .section-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }

    .niver-hoje-card {
      background: linear-gradient(135deg, rgba(35, 209, 96, 0.2) 0%, var(--input-bg) 100%);
      border: 2px solid var(--success);
      padding: 16px 20px;
      border-radius: 12px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(35, 209, 96, 0.2);
    }
    .niver-hoje-info strong { font-size: 1.15rem; color: #FFF; display: block; margin-bottom: 2px; }
    .niver-hoje-info small { color: var(--success); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }

    .membro-card { background: var(--input-bg); border: 1px solid var(--card-border); padding: 14px 16px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .membro-main strong { font-size: 1rem; color: var(--text); display: block; }
    .membro-main small { color: var(--text-muted); font-size: 0.82rem; }

    .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .tag { font-size: 0.72rem; padding: 3px 8px; border-radius: 12px; font-weight: 600; }
    .tag-base { background: rgba(110, 86, 207, 0.2); color: #A58BFF; border: 1px solid rgba(110, 86, 207, 0.4); }
    .tag-liderado { background: rgba(139, 148, 158, 0.2); color: var(--text-muted); border: 1px solid rgba(139, 148, 158, 0.3); }
    .tag-warning { background: rgba(227, 179, 65, 0.2); color: var(--warning); border: 1px solid rgba(227, 179, 65, 0.4); }
    .tag-danger { background: rgba(229, 83, 75, 0.2); color: var(--danger); border: 1px solid rgba(229, 83, 75, 0.4); }
    .tag-niver { background: rgba(35, 209, 96, 0.2); color: var(--success); border: 1px solid rgba(35, 209, 96, 0.4); }

    .actions-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .btn-whats-mini { background: #23D160; color: #000; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 0.8rem; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
    .btn-whats-mini:hover { background: #1EBE55; }
    .btn-edit { background: rgba(56, 139, 253, 0.15); color: var(--info); border: 1px solid rgba(56, 139, 253, 0.3); padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.8rem; }
    .btn-edit:hover { background: var(--info); color: #FFF; }
    .btn-delete { background: rgba(229, 83, 75, 0.15); color: var(--danger); border: 1px solid rgba(229, 83, 75, 0.3); padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.8rem; }
    .btn-delete:hover { background: var(--danger); color: #FFF; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 999; display: none; }
    .modal-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 24px; max-width: 580px; width: 100%; max-height: 85vh; overflow-y: auto; }
    .modal-header { font-size: 1.2rem; font-weight: 700; margin-bottom: 16px; color: var(--text); display: flex; justify-content: space-between; align-items: center; }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

    .btn-salvar { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; }
    .btn-salvar:hover { background: var(--primary-hover); }
    .btn-cancelar { background: #21262D; color: var(--text); border: 1px solid var(--card-border); padding: 10px 16px; border-radius: 8px; cursor: pointer; }
    .btn-cancelar:hover { background: #30363D; }

    .form-group { margin-bottom: 14px; text-align: left; }
    label { display: block; font-weight: 500; font-size: 0.82rem; margin-bottom: 6px; color: var(--text-muted); text-transform: uppercase; }
    input, select, textarea { width: 100%; padding: 10px 14px; background-color: var(--input-bg); border: 1px solid var(--card-border); border-radius: 8px; font-size: 0.95rem; color: var(--text); outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }
    select option { background-color: var(--card-bg); color: var(--text); }

    /* Estilos modernizados para os relatórios */
    .relatorio-item { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 18px; margin-bottom: 16px; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; gap: 12px; }
    .relatorio-item:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(110, 86, 207, 0.15); }
    
    .relatorio-header-grid { display: flex; gap: 16px; align-items: flex-start; }
    .relatorio-foto { width: 90px; height: 90px; border-radius: 8px; object-fit: cover; border: 1px solid var(--card-border); flex-shrink: 0; background: #000; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: var(--text-muted); }
    .relatorio-meta { flex: 1; }
    .relatorio-data-hora { font-size: 0.8rem; color: var(--primary); font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
    .relatorio-tema { font-size: 1.1rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .relatorio-local { font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }

    .relatorio-chamada-resumo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: rgba(0,0,0,0.2); padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.03); }
    .presenca-col h5 { font-size: 0.75rem; text-transform: uppercase; margin-bottom: 4px; font-weight: 700; }
    .presenca-col.presentes h5 { color: var(--success); }
    .presenca-col.faltantes h5 { color: var(--danger); }
    .presenca-col p { color: var(--text-muted); line-height: 1.3; font-size: 0.82rem; }

    .relatorio-detalhe-bloco { margin-bottom: 14px; background: var(--input-bg); padding: 12px; border-radius: 8px; border: 1px solid var(--card-border); }
    .relatorio-detalhe-bloco label { font-size: 0.75rem; color: var(--primary); font-weight: bold; margin-bottom: 4px; text-transform: uppercase; display: block; }
    .relatorio-detalhe-bloco p { font-size: 0.9rem; color: var(--text); line-height: 1.4; word-break: break-word; }

    .chamada-container { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 16px; margin-bottom: 16px; max-height: 280px; overflow-y: auto; }
    .chamada-item { display: flex; flex-direction: column; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--card-border); }
    .chamada-item:last-child { border-bottom: none; }
    .chamada-info { display: flex; justify-content: space-between; align-items: center; }
    .chamada-info label { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text); font-size: 0.95rem; text-transform: none; font-weight: 600; margin-bottom: 0; }
    .chamada-info input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }
    .justificativa-box { display: none; margin-left: 26px; }

    .btn-whats { background: #23D160; color: #000; padding: 6px 12px; border-radius: 6px; font-size: 0.78rem; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
    .btn-whats:hover { background: #1EBE55; }
    .loading-box { text-align: center; padding: 40px; color: var(--text-muted); }

    @media (max-width: 500px) { 
      .membro-card, .niver-hoje-card { flex-direction: column; align-items: flex-start; gap: 10px; } 
      .actions-group { width: 100%; justify-content: flex-end; margin-top: 8px; } 
      .relatorio-header-grid { flex-direction: column; }
      .relatorio-foto { width: 100%; height: 140px; }
      .relatorio-chamada-resumo { grid-template-columns: 1fr; }
    }
  </style>

  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="container">
  <div class="top-nav">
    <button class="btn-voltar" onclick="voltarPagina()">← Voltar</button>
  </div>

  <div class="header">
    <span class="badge-topo" id="badgeMinisterio">MINISTÉRIO TOPO</span>
    <h1 id="tituloNomeRede" style="font-size: 2rem; font-weight: 800; color: var(--text); margin-top: 4px;">Carregando Rede...</h1>
    <p id="subtituloLiderRede" style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;"></p>
  </div>

  <div id="conteudoPainel" style="display: none;">
    <div id="cardSaude" class="health-card green">
      <div class="health-info">
        <h3 id="tituloSaude">Rede Equilibrada</h3>
        <p id="descSaude">Tamanho ideal atingido (12 membros ativas)</p>
      </div>
      <div class="health-count" id="qtdMembrosMembro">12</div>
    </div>

    <!-- ANIVERSARIANTES -->
    <div id="secaoAniversariantesRede" style="margin-bottom: 32px;"></div>

    <div style="margin-bottom: 32px;">
      <div class="section-title">
        <span>👥 Liderados da Rede (<span id="totalMembrosLista">0</span>)</span>
      </div>
      <div id="listaMembros"></div>
    </div>

    <div>
      <div class="section-title">📜 Últimos Relatórios Enviados <small style="font-size:0.75rem; color:var(--text-muted); font-weight:normal;">(Clique em um relatório para ver ou editar)</small></div>
      <div id="listaRelatorios"></div>
    </div>
  </div>

  <div id="loading" class="loading-box" style="display: block;">Carregando dados da rede do Firebase...</div>
</div>

<!-- Modal de Edição de Membro -->
<div id="modalEdicao" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-header">✏️ Editar Membro</div>
    <input type="hidden" id="editDocId">

    <div class="form-group"><label>Nome Completo</label><input type="text" id="editNome"></div>
    <div class="form-group"><label>Data de Nascimento</label><input type="date" id="editNascimento"></div>
    <div class="form-group">
      <label>Sexo</label>
      <select id="editSexo"><option value="">Selecione...</option><option value="Masculino">Masculino</option><option value="Feminino">Feminino</option></select>
    </div>
    <div class="form-group"><label>WhatsApp</label><input type="text" id="editWhatsapp" placeholder="Deixe em branco se não possuir"></div>
    <div class="form-group"><label>E-mail de Acesso</label><input type="email" id="editEmail" placeholder="exemplo@email.com"></div>
    <div class="form-group">
      <label>Batizado?</label>
      <select id="editBatizado"><option value="Sim">Sim</option><option value="Não">Não</option></select>
    </div>
    <div class="form-group">
      <label>Categoria</label>
      <select id="editCategoria">
        <option value="Liderado">Liderado</option>
        <option value="Base da Rede">Base da Rede</option>
        <option value="Líder" id="optLiderOption">Líder</option>
      </select>
    </div>

    <div class="modal-footer">
      <button class="btn-cancelar" onclick="fecharModalEdicao()">Cancelar</button>
      <button class="btn-salvar" onclick="salvarEdicaoMembro()" style="width:auto;">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal de Relatório -->
<div id="modalRelatorioDetalhes" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-header">
      <span>📋 Detalhes do Relatório</span>
      <button onclick="fecharModalRelatorio()" style="background:none; border:none; color:var(--text-muted); font-size:1.2rem; cursor:pointer;">✕</button>
    </div>
    <input type="hidden" id="detalheRelId">
    
    <div id="conteudoDetalhesRelatorio"></div>

    <div class="modal-footer" style="justify-content: space-between;">
      <button class="btn-salvar" onclick="ativarEdicaoRelatorio()" id="btnAtivarEdicao" style="width:auto;">✏️ Editar Relatório</button>
      <div style="display: flex; gap: 10px;">
        <button class="btn-salvar" onclick="salvarEdicaoRelatorio()" id="btnSalvarRelatorio" style="display: none; width:auto;">Salvar</button>
        <button class="btn-cancelar" onclick="fecharModalRelatorio()">Fechar</button>
      </div>
    </div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB7FJXs9wiRFYIs2ugZoWrw7jTXPR5weGk",
    authDomain: "app-redes-iftejipio.firebaseapp.com",
    projectId: "app-redes-iftejipio",
    storageBucket: "app-redes-iftejipio.firebasestorage.app",
    messagingSenderId: "954529090793",
    appId: "1:954529090793:web:6702d102b6e5b178b6b478",
    measurementId: "G-2MJ96WMYQ5"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.firestore();

  let dadosSessao = {};
  let membrosLocais = [];
  let relatoriosLocais = [];
  let ministerioAtivo = 'TOPO';

  document.addEventListener("DOMContentLoaded", async function() {
    ministerioAtivo = sessionStorage.getItem('topo_ministerio') || 'TOPO';
    document.getElementById('badgeMinisterio').innerText = `MINISTÉRIO ${ministerioAtivo}`;

    const supervisao = sessionStorage.getItem('topo_supervisao');
    const rede = sessionStorage.getItem('topo_rede');
    const liderSessao = sessionStorage.getItem('topo_lider');

    if (!rede) {
      alert("Nenhuma rede selecionada. Faça o login novamente.");
      window.location.href = "lider.html";
      return;
    }

    // Se quem está logado for Líder de Rede comum (e não Supervisor), remove a opção de categorizar como Líder
    if (liderSessao && !liderSessao.includes('Supervisor') && !sessionStorage.getItem('topo_sup_nome')) {
      const optLider = document.getElementById('optLiderOption');
      if (optLider) optLider.remove();
    }

    dadosSessao = { supervisao, rede };
    document.getElementById('tituloNomeRede').innerText = rede;
    document.getElementById('subtituloLiderRede').innerText = `Líder: Carregando...`;

    await carregarDadosDashboard();
  });

  function voltarPagina() {
    const isSupervisor = sessionStorage.getItem('topo_sup_nome');
    if (isSupervisor) {
      window.location.href = "supervisor_selecionar_rede.html";
    } else {
      window.location.href = "lider.html";
    }
  }

  async function carregarDadosDashboard() {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('conteudoPainel').style.display = 'none';

    try {
      const snapshotMembros = await db.collection('membros')
        .where('rede', '==', dadosSessao.rede)
        .get();

      const snapshotRelatorios = await db.collection('relatorios')
        .where('rede', '==', dadosSessao.rede)
        .get();

      membrosLocais = [];
      let nomeLiderEncontrado = "Não definido";

      snapshotMembros.forEach(doc => {
        const data = doc.data();
        if (data.status !== 'INATIVO') {
          membrosLocais.push({ id: doc.id, ...data });
          if (data.categoria === 'Líder') {
            nomeLiderEncontrado = data.nome;
          }
        }
      });

      membrosLocais.sort((a, b) => (a.categoria === 'Líder' ? -1 : (b.categoria === 'Líder' ? 1 : a.nome.localeCompare(b.nome))));
      document.getElementById('subtituloLiderRede').innerText = `Líder: ${nomeLiderEncontrado}`;

      relatoriosLocais = [];
      snapshotRelatorios.forEach(doc => {
        relatoriosLocais.push({ id: doc.id, ...doc.data() });
      });

      renderizarPainel(membrosLocais, relatoriosLocais);
    } catch (err) {
      console.error("Erro ao carregar dados do Firebase:", err);
      document.getElementById('loading').innerHTML = `
        <div style="color: var(--danger); text-align: center; padding: 20px;">
          ⚠️ Erro ao carregar os dados da rede do Firebase.<br>
          <small style="color: var(--text-muted);">${err.message}</small>
        </div>
      `;
    }
  }

  // Funções auxiliares solicitadas para os relatórios
  function formatarNomeSobrenome(nomeCompleto) {
    if (!nomeCompleto) return '';
    const partes = nomeCompleto.trim().split(' ');
    if (partes.length === 1) return partes[0];
    return `${partes[0]} ${partes[partes.length - 1]}`;
  }

  function limparFaltantesResumo(textoFaltantes) {
    if (!textoFaltantes) return 'Nenhum';
    const itens = textoFaltantes.split(',');
    const nomesLimpos = itens.map(item => {
      const nomePuro = item.split('(')[0].trim();
      return formatarNomeSobrenome(nomePuro);
    });
    return nomesLimpos.join(', ');
  }

  function renderizarPainel(membrosRede, relatoriosRede) {
    const total = membrosRede.length;
    const cardSaude = document.getElementById('cardSaude');
    const titSaude = document.getElementById('tituloSaude');
    const descSaude = document.getElementById('descSaude');
    document.getElementById('qtdMembrosMembro').innerText = total;

    if (total === 12) {
      cardSaude.className = "health-card green";
      titSaude.innerText = "Rede Equilibrada";
      descSaude.innerText = "Tamanho ideal atingido (12 membros ativas).";
    } else if (total < 12) {
      cardSaude.className = "health-card yellow";
      titSaude.innerText = "⚠️ Alerta de Crescimento";
      descSaude.innerText = `Necessário +${12 - total} membros para atingir a meta de 12.`;
    } else {
      cardSaude.className = "health-card blue";
      titSaude.innerText = "🚀 Alerta de Multiplicação";
      descSaude.innerText = `A rede ultrapassou 12 membros (${total}) e está pronta para multiplicar!`;
    }

    const containerMembros = document.getElementById('listaMembros');
    document.getElementById('totalMembrosLista').innerText = total;
    containerMembros.innerHTML = '';

    const dataHoje = new Date();
    const mesAtual = dataHoje.getMonth() + 1;
    const diaAtual = dataHoje.getDate();

    if (total === 0) {
      containerMembros.innerHTML = `<div style="color: var(--text-muted); font-size: 0.9rem;">Nenhum membro cadastrado nesta rede ainda.</div>`;
    } else {
      membrosRede.forEach(m => {
        const nome = m.nome;
        const nascimento = m.nascimento || '';
        const sexo = m.sexo && m.sexo.trim() !== '' ? m.sexo : 'Não inf.';
        const whats = m.whatsapp ? m.whatsapp.trim() : '';
        const email = m.email ? m.email.trim() : '';
        const batizado = m.batizado || 'Não';
        const categoria = m.categoria || 'Liderado';
        const isLider = categoria === 'Líder';

        let faltasSeguidas = 0;
        for (let r of [...relatoriosRede].reverse()) {
          const faltantesTxt = r.faltantes ? r.faltantes.toString() : '';
          if (faltantesTxt.toLowerCase().includes(nome.toLowerCase())) faltasSeguidas++;
          else break;
        }

        let isNiverMes = false;
        if (nascimento) {
          const partesNasc = nascimento.toString().split('-');
          if (partesNasc.length === 3 && parseInt(partesNasc[1]) === mesAtual) {
            isNiverMes = true;
          }
        }

        const div = document.createElement('div');
        div.className = 'membro-card';

        let tagsHTML = `<span class="tag ${isLider ? 'tag-green' : (categoria === 'Base da Rede' ? 'tag-base' : 'tag-liderado')}">${isLider ? '⭐ Líder' : categoria}</span>`;
        if (isNiverMes) tagsHTML += `<span class="tag tag-niver">🎂 Aniversariante do Mês</span>`;
        if (faltasSeguidas === 2) tagsHTML += `<span class="tag tag-warning">⚠️ Alerta (2 faltas)</span>`;
        if (faltasSeguidas >= 3) tagsHTML += `<span class="tag tag-danger">⛔ ${faltasSeguidas} faltas</span>`;

        const linkWhatsMembro = whats !== '' 
          ? `<a href="https://api.whatsapp.com/send?phone=55${whats.replace(/\D/g,'')}&text=${encodeURIComponent('Olá ' + nome + ', tudo bem? Passando para saber como você está e dizer que oro por sua vida!')}" target="_blank" class="btn-whats-mini">💬 WhatsApp</a>` 
          : `<span style="font-size: 0.8rem; color: var(--text-muted);">Sem WhatsApp</span>`;

        div.innerHTML = `
          <div class="membro-main">
            <strong style="${isLider ? 'color: var(--success); font-size: 1.05rem;' : ''}">${isLider ? '⭐ ' : ''}${nome}</strong>
            <small>Sexo: ${sexo} | 📱 ${whats !== '' ? whats : 'Sem WhatsApp'} ${email ? '| ✉️ ' + email : ''} | Batizado: ${batizado}</small>
            <div class="tags">${tagsHTML}</div>
          </div>
          <div class="actions-group">
            ${linkWhatsMembro}
            <button class="btn-edit" onclick="abrirModalEdicao('${m.id}')">✏️ Editar</button>
            <button class="btn-delete" onclick="inativarMembro('${m.id}', '${nome}')">Remover</button>
          </div>
        `;
        containerMembros.appendChild(div);
      });
    }

    // ANIVERSARIANTES
    const secaoNivers = document.getElementById('secaoAniversariantesRede');
    let aniversariantesHojeHtml = '';
    let aniversariantesMesHtml = '';
    let qtdNiverMes = 0;

    membrosRede.forEach(m => {
      const nasc = m.nascimento;
      if (nasc) {
        const partes = nasc.toString().split('-');
        if (partes.length === 3 && parseInt(partes[1]) === mesAtual) {
          qtdNiverMes++;
          const diaNasc = parseInt(partes[2]);
          const whatsNiver = m.whatsapp ? m.whatsapp.trim() : '';

          if (diaNasc === diaAtual) {
            const linkWhats = whatsNiver !== '' 
              ? `<a href="https://api.whatsapp.com/send?phone=55${whatsNiver.replace(/\D/g,'')}&text=${encodeURIComponent('Parabéns ' + m.nome + '! Que o Senhor te abençoe muito em seu aniversário, com muita paz e alegria. Estamos muito felizes por ter você em nossa rede!')}" target="_blank" class="btn-whats">🎂 Dar os Parabéns</a>` 
              : '<small style="color:var(--text-muted)">Sem WhatsApp</small>';
            
            aniversariantesHojeHtml += `
              <div class="niver-hoje-card">
                <div class="niver-hoje-info">
                  <small>🎉 ANIVERSARIANTE DE HOJE 🎉</small>
                  <strong>${m.nome}</strong>
                </div>
                <div>${linkWhats}</div>
              </div>
            `;
          } else {
            aniversariantesMesHtml += `
              <div class="membro-card">
                <div class="membro-main">
                  <strong>🎂 ${m.nome}</strong>
                  <small>Data: ${partes[2]}/${partes[1]}</small>
                </div>
                <div style="color: var(--text-muted); font-size: 0.8rem;">Dia ${partes[2]}</div>
              </div>
            `;
          }
        }
      }
    });

    if (qtdNiverMes > 0) {
      secaoNivers.innerHTML = `<div class="section-title">🎂 Aniversariantes do Mês</div>${aniversariantesHojeHtml}${aniversariantesMesHtml}`;
      secaoNivers.style.display = 'block';
    } else {
      secaoNivers.innerHTML = '';
      secaoNivers.style.display = 'none';
    }

    // RELATÓRIOS MODERNIZADOS
    const containerRel = document.getElementById('listaRelatorios');
    containerRel.innerHTML = '';
    if (relatoriosRede.length === 0) {
      containerRel.innerHTML = `<div style="color: var(--text-muted); font-size: 0.9rem;">Nenhum relatório enviado para esta rede até o momento.</div>`;
    } else {
      relatoriosRede.slice(-5).reverse().forEach(r => {
        let presentesFormatados = '-';
        if (r.presentes) {
          presentesFormatados = r.presentes.split(',').map(p => formatarNomeSobrenome(p.trim())).join(', ');
        }

        let faltantesFormatados = limparFaltantesResumo(r.faltantes);

        const fotoHtml = r.fotoRede 
          ? `<img src="${r.fotoRede}" class="relatorio-foto" alt="Foto da Rede">` 
          : `<div class="relatorio-foto">📷</div>`;

        const div = document.createElement('div');
        div.className = 'relatorio-item';
        div.setAttribute('onclick', `abrirDetalhesRelatorio('${r.id}')`);
        div.innerHTML = `
          <div class="relatorio-header-grid">
            ${fotoHtml}
            <div class="relatorio-meta">
              <div class="relatorio-data-hora">📅 ${r.dataEncontro || 'Data não informada'} às ${r.horario || ''}</div>
              <div class="relatorio-tema">📌 ${r.tema || 'Sem Tema'}</div>
              <div class="relatorio-local">📍 Local: ${r.local || 'Não informado'}</div>
            </div>
          </div>

          <div class="relatorio-chamada-resumo">
            <div class="presenca-col presentes">
              <h5>✅ Presentes</h5>
              <p>${presentesFormatados}</p>
            </div>
            <div class="presenca-col faltantes">
              <h5>❌ Faltantes</h5>
              <p>${faltantesFormatados}</p>
            </div>
          </div>
        `;
        containerRel.appendChild(div);
      });
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('conteudoPainel').style.display = 'block';
  }

  function abrirDetalhesRelatorio(docId) {
    const rel = relatoriosLocais.find(r => r.id === docId);
    if (!rel) return;

    document.getElementById('detalheRelId').value = docId;
    document.getElementById('btnAtivarEdicao').style.display = 'inline-block';
    document.getElementById('btnSalvarRelatorio').style.display = 'none';

    renderizarDetalhesModoLeitura(rel);
    document.getElementById('modalRelatorioDetalhes').style.display = 'flex';
  }

  function renderizarDetalhesModoLeitura(rel) {
    const conteudo = document.getElementById('conteudoDetalhesRelatorio');
    const fotoDetalhe = rel.fotoRede ? `<img src="${rel.fotoRede}" style="width:100%; max-height:220px; object-fit:cover; border-radius:8px; margin-bottom:12px;" alt="Foto da Rede">` : '';

    conteudo.innerHTML = `
      ${fotoDetalhe}
      <div class="relatorio-detalhe-bloco"><label>Data e Horário</label><p>${rel.dataEncontro || '-'} às ${rel.horario || '-'}</p></div>
      <div class="relatorio-detalhe-bloco"><label>Local do Encontro</label><p>${rel.local || '-'}</p></div>
      <div class="relatorio-detalhe-bloco"><label>Tema Ministrado</label><p>${rel.tema || '-'}</p></div>
      <div class="relatorio-detalhe-bloco"><label>Presentes (Membros e/ou Líder)</label><p>${rel.presentes || 'Nenhum registrado'}</p></div>
      <div class="relatorio-detalhe-bloco"><label>Visitantes</label><p>${rel.visitantes || 'Nenhum'}</p></div>
      <div class="relatorio-detalhe-bloco"><label>Faltantes e Justificativas</label><p style="color: var(--danger);">${rel.faltantes || 'Nenhum'}</p></div>
      <div class="relatorio-detalhe-bloco"><label>Resumo da Palavra</label><p>${rel.resumoPalavra || '-'}</p></div>
      <div class="relatorio-detalhe-bloco"><label>Atividades / Dinâmicas</label><p>${rel.atividades || '-'}</p></div>
    `;
  }

  async function ativarEdicaoRelatorio() {
    const docId = document.getElementById('detalheRelId').value;
    const rel = relatoriosLocais.find(r => r.id === docId);
    if (!rel) return;

    document.getElementById('btnAtivarEdicao').style.display = 'none';
    document.getElementById('btnSalvarRelatorio').style.display = 'inline-block';

    const presentesStr = rel.presentes ? rel.presentes.toString().toLowerCase() : '';
    const faltantesStr = rel.faltantes ? rel.faltantes.toString().toLowerCase() : '';

    let chamadaHtml = '';
    membrosLocais.forEach((m, index) => {
      const nome = m.nome;
      const nomeLower = nome.toLowerCase();
      let estaPresente = true;

      if (presentesStr.includes(nomeLower)) estaPresente = true;
      else if (faltantesStr.includes(nomeLower)) estaPresente = false;
      else if (presentesStr !== "" && !presentesStr.includes(nomeLower)) estaPresente = false;

      let justificativaTexto = '';
      if (!estaPresente) {
        const regex = new RegExp(nome.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&') + '\\s*\\(Justificativa:\\s*([^\\)]+)\\)', 'i');
        const match = rel.faltantes ? rel.faltantes.toString().match(regex) : null;
        if (match && match[1]) justificativaTexto = match[1].trim();
      }

      const marcado = estaPresente ? 'checked' : '';
      const displayBox = estaPresente ? 'none' : 'block';
      const isLider = m.categoria === 'Líder';

      chamadaHtml += `
        <div class="chamada-item">
          <div class="chamada-info">
            <label>
              <input type="checkbox" id="edit_membro_${index}" value="${nome}" ${marcado} onchange="toggleJustificativaEdit(${index})">
              <span style="${isLider ? 'color: var(--success); font-weight: 700;' : ''}">${isLider ? '⭐ ' + nome + ' (Líder da Rede)' : nome}</span>
            </label>
          </div>
          <div class="justificativa-box" id="edit_box_just_${index}" style="display: ${displayBox};">
            <input type="text" id="edit_just_${index}" placeholder="Justificativa da falta..." value="${justificativaTexto}">
          </div>
        </div>
      `;
    });

    const conteudo = document.getElementById('conteudoDetalhesRelatorio');
    const fotoDetalhe = rel.fotoRede ? `<img src="${rel.fotoRede}" style="width:100%; max-height:220px; object-fit:cover; border-radius:8px; margin-bottom:12px;" alt="Foto da Rede">` : '';

    conteudo.innerHTML = `
      ${fotoDetalhe}
      <div style="display:flex; gap:10px; margin-bottom:12px;">
        <div class="relatorio-detalhe-bloco" style="flex:1; margin-bottom:0;"><label>Data</label><input type="date" id="editRelData" value="${rel.dataEncontro || ''}"></div>
        <div class="relatorio-detalhe-bloco" style="flex:1; margin-bottom:0;"><label>Horário</label><input type="time" id="editRelHorario" value="${rel.horario || ''}"></div>
      </div>
      <div class="relatorio-detalhe-bloco"><label>Local do Encontro</label><input type="text" id="editRelLocal" value="${rel.local || ''}"></div>
      
      <div class="relatorio-detalhe-bloco">
        <label>Chamada (Membros e Líder)</label>
        <div class="chamada-container" style="max-height: 200px; overflow-y: auto;">
          ${chamadaHtml}
        </div>
      </div>

      <div class="relatorio-detalhe-bloco"><label>Visitantes</label><input type="text" id="editRelVisitantes" value="${rel.visitantes || ''}"></div>
      <div class="relatorio-detalhe-bloco"><label>Tema Ministrado</label><input type="text" id="editRelTema" value="${rel.tema || ''}"></div>
      <div class="relatorio-detalhe-bloco"><label>Resumo da Palavra</label><textarea id="editRelResumo">${rel.resumoPalavra || ''}</textarea></div>
      <div class="relatorio-detalhe-bloco"><label>Atividades / Dinâmicas</label><textarea id="editRelAtividades">${rel.atividades || ''}</textarea></div>
    `;
  }

  function toggleJustificativaEdit(index) {
    const chk = document.getElementById(`edit_membro_${index}`);
    const box = document.getElementById(`edit_box_just_${index}`);
    if (!chk.checked) box.style.display = 'block';
    else { box.style.display = 'none'; document.getElementById(`edit_just_${index}`).value = ''; }
  }

  async function salvarEdicaoRelatorio() {
    const docId = document.getElementById('detalheRelId').value;
    let presentesArr = [];
    let faltantesArr = [];

    membrosLocais.forEach((m, index) => {
      const chk = document.getElementById(`edit_membro_${index}`);
      if (chk) {
        if (chk.checked) presentesArr.push(m.nome);
        else {
          const txtJust = document.getElementById(`edit_just_${index}`).value.trim();
          const textoFalta = txtJust ? `${m.nome} (Justificativa: ${txtJust})` : `${m.nome} (Não justificou)`;
          faltantesArr.push(textoFalta);
        }
      }
    });

    const atualizacao = {
      dataEncontro: document.getElementById('editRelData').value,
      horario: document.getElementById('editRelHorario').value,
      local: document.getElementById('editRelLocal').value.trim(),
      tema: document.getElementById('editRelTema').value.trim(),
      presentes: presentesArr.join(', '),
      visitantes: document.getElementById('editRelVisitantes').value.trim(),
      faltantes: faltantesArr.join(', '),
      resumoPalavra: document.getElementById('editRelResumo').value.trim(),
      atividades: document.getElementById('editRelAtividades').value.trim()
    };

    fecharModalRelatorio();
    document.getElementById('loading').style.display = 'block';

    try {
      await db.collection('relatorios').doc(docId).update(atualizacao);
      alert("✅ Relatório atualizado com sucesso!");
      await carregarDadosDashboard();
    } catch (err) {
      alert("Erro ao atualizar relatório.");
      console.error(err);
      document.getElementById('loading').style.display = 'none';
    }
  }

  function fecharModalRelatorio() {
    document.getElementById('modalRelatorioDetalhes').style.display = 'none';
  }

  function abrirModalEdicao(docId) {
    const membro = membrosLocais.find(m => m.id === docId);
    if (!membro) return;

    document.getElementById('editDocId').value = docId;
    document.getElementById('editNome').value = membro.nome;
    document.getElementById('editNascimento').value = membro.nascimento || '';
    document.getElementById('editSexo').value = membro.sexo || '';
    document.getElementById('editWhatsapp').value = membro.whatsapp || '';
    document.getElementById('editEmail').value = membro.email || '';
    document.getElementById('editBatizado').value = membro.batizado || 'Não';
    document.getElementById('editCategoria').value = membro.categoria || 'Liderado';

    document.getElementById('modalEdicao').style.display = 'flex';
  }

  function fecharModalEdicao() {
    document.getElementById('modalEdicao').style.display = 'none';
  }

  async function salvarEdicaoMembro() {
    const docId = document.getElementById('editDocId').value;
    const nome = document.getElementById('editNome').value.trim();
    const nascimento = document.getElementById('editNascimento').value;
    const sexo = document.getElementById('editSexo').value;
    const whatsapp = document.getElementById('editWhatsapp').value.trim();
    const email = document.getElementById('editEmail').value.trim().toLowerCase();
    const batizado = document.getElementById('editBatizado').value;
    const categoria = document.getElementById('editCategoria').value;

    if (!nome) return alert("Informe o nome.");

    fecharModalEdicao();
    document.getElementById('loading').style.display = 'block';

    try {
      await db.collection('membros').doc(docId).update({ nome, nascimento, sexo, whatsapp, email, batizado, categoria });
      alert("✅ Membro atualizado!");
      await carregarDadosDashboard();
    } catch (err) {
      alert("Erro ao atualizar membro.");
      console.error(err);
      document.getElementById('loading').style.display = 'none';
    }
  }

  async function inativarMembro(docId, nome) {
    if (!confirm(`Tem certeza que deseja remover ${nome}?`)) return;

    document.getElementById('loading').style.display = 'block';
    try {
      await db.collection('membros').doc(docId).update({ status: "INATIVO" });
      alert(`✅ ${nome} removido(a).`);
      await carregarDadosDashboard();
    } catch (err) {
      alert("Erro ao remover membro.");
      console.error(err);
      document.getElementById('loading').style.display = 'none';
    }
  }
</script>

</body>
</html>
