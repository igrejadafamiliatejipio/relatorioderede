<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel da Rede - TOPO</title>
  <style>
    :root {
      --bg: #0D0F12;
      --card-bg: #161B22;
      --card-border: #30363D;
      --input-bg: #0D1117;
      --text: #F0F6FC;
      --text-muted: #8B949E;
      --primary: #6E56CF;
      --primary-hover: #5B45B0;
      --success: #23D160;
      --warning: #E3B341;
      --danger: #E5534B;
      --info: #388BFD;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px 12px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      width: 100%;
      background: var(--card-bg);
      padding: 28px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .btn-voltar {
      background: #21262D;
      color: var(--text);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-voltar:hover { background: #30363D; }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 { font-size: 1.75rem; font-weight: 700; }

    .badge-topo {
      display: inline-block;
      background: var(--primary);
      color: #FFF;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .section-selector {
      background: var(--input-bg);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      margin-bottom: 24px;
    }

    .row { display: flex; gap: 12px; }
    .row .form-group { flex: 1; }

    label {
      display: block; font-weight: 500; font-size: 0.85rem;
      margin-bottom: 6px; color: var(--text-muted); text-transform: uppercase;
    }

    select, input {
      width: 100%; padding: 12px 14px; background-color: var(--card-bg);
      border: 1px solid var(--card-border); border-radius: 8px; font-size: 0.95rem; color: var(--text); outline: none;
    }
    select option { background-color: var(--card-bg); color: var(--text); }

    /* Cards de Métricas */
    .health-card {
      padding: 18px; border-radius: 12px; margin-bottom: 24px;
      display: flex; align-items: center; justify-content: space-between; border: 1px solid transparent;
    }
    .health-card.green { background: rgba(35, 209, 96, 0.1); border-color: rgba(35, 209, 96, 0.3); color: var(--success); }
    .health-card.yellow { background: rgba(227, 179, 65, 0.1); border-color: rgba(227, 179, 65, 0.3); color: var(--warning); }
    .health-card.blue { background: rgba(56, 139, 253, 0.1); border-color: rgba(56, 139, 253, 0.3); color: var(--info); }

    .health-info h3 { font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
    .health-info p { font-size: 0.88rem; opacity: 0.9; }
    .health-count { font-size: 2rem; font-weight: 800; }

    .section-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }

    .membro-card {
      background: var(--input-bg); border: 1px solid var(--card-border);
      padding: 14px 16px; border-radius: 10px; margin-bottom: 10px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }

    .membro-main strong { font-size: 1rem; color: var(--text); display: block; }
    .membro-main small { color: var(--text-muted); font-size: 0.82rem; }

    .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .tag { font-size: 0.72rem; padding: 3px 8px; border-radius: 12px; font-weight: 600; }
    .tag-base { background: rgba(110, 86, 207, 0.2); color: #A58BFF; border: 1px solid rgba(110, 86, 207, 0.4); }
    .tag-liderado { background: rgba(139, 148, 158, 0.2); color: var(--text-muted); border: 1px solid rgba(139, 148, 158, 0.3); }
    .tag-warning { background: rgba(227, 179, 65, 0.2); color: var(--warning); border: 1px solid rgba(227, 179, 65, 0.4); }
    .tag-danger { background: rgba(229, 83, 75, 0.2); color: var(--danger); border: 1px solid rgba(229, 83, 75, 0.4); }
    .tag-niver { background: rgba(35, 209, 96, 0.2); color: var(--success); border: 1px solid rgba(35, 209, 96, 0.4); }

    .actions-group { display: flex; gap: 6px; }

    .btn-edit {
      background: rgba(56, 139, 253, 0.15); color: var(--info); border: 1px solid rgba(56, 139, 253, 0.3);
      padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.8rem;
    }
    .btn-edit:hover { background: var(--info); color: #FFF; }

    .btn-delete {
      background: rgba(229, 83, 75, 0.15); color: var(--danger); border: 1px solid rgba(229, 83, 75, 0.3);
      padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.8rem;
    }
    .btn-delete:hover { background: var(--danger); color: #FFF; }

    /* Modal de Edição */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7); display: flex; align-items: center; justify-content: center;
      padding: 16px; z-index: 999; display: none;
    }

    .modal-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 14px; padding: 24px; max-width: 480px; width: 100%;
    }

    .modal-header { font-size: 1.2rem; font-weight: 700; margin-bottom: 16px; color: var(--text); }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

    .btn-salvar { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .btn-salvar:hover { background: var(--primary-hover); }
    .btn-cancelar { background: #21262D; color: var(--text); border: 1px solid var(--card-border); padding: 10px 16px; border-radius: 8px; cursor: pointer; }

    .relatorio-item { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    .relatorio-header { display: flex; justify-content: space-between; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
    .relatorio-body { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; }

    .loading-box { text-align: center; padding: 40px; color: var(--text-muted); }

    @media (max-width: 500px) {
      .row { flex-direction: column; gap: 8px; }
      .container { padding: 20px 16px; }
      .membro-card { flex-direction: column; align-items: flex-start; }
      .actions-group { width: 100%; justify-content: flex-end; margin-top: 8px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="top-nav">
    <a href="lider.html" class="btn-voltar">← Voltar ao Menu</a>
  </div>

  <div class="header">
    <span class="badge-topo">MINISTÉRIO TOPO</span>
    <h1>📊 Painel da Rede</h1>
    <p>Acompanhe a saúde, frequência e liderados em tempo real</p>
  </div>

  <!-- Seleção da Rede -->
  <div class="section-selector">
    <div class="row">
      <div class="form-group">
        <label for="selectSupervisao">Supervisão</label>
        <select id="selectSupervisao"><option value="">Selecione a Supervisão</option></select>
      </div>
      <div class="form-group">
        <label for="selectRede">Rede</label>
        <select id="selectRede" disabled><option value="">Selecione a Supervisão primeiro</option></select>
      </div>
    </div>
  </div>

  <!-- Conteúdo do Dashboard -->
  <div id="conteudoPainel" style="display: none;">
    <div id="cardSaude" class="health-card green">
      <div class="health-info">
        <h3 id="tituloSaude">Rede Equilibrada</h3>
        <p id="descSaude">Tamanho ideal atingido (12 membros ativas)</p>
      </div>
      <div class="health-count" id="qtdMembrosMembro">12</div>
    </div>

    <div style="margin-bottom: 32px;">
      <div class="section-title">
        <span>👥 Liderados da Rede (<span id="totalMembrosLista">0</span>)</span>
      </div>
      <div id="listaMembros"></div>
    </div>

    <div>
      <div class="section-title">📜 Últimos Relatórios Enviados</div>
      <div id="listaRelatorios"></div>
    </div>
  </div>

  <div id="loading" class="loading-box" style="display: none;">Carregando dados da planilha...</div>
</div>

<!-- Janela Flutuante (Modal) de Edição de Membro -->
<div id="modalEdicao" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-header">✏️ Editar Membro</div>
    <input type="hidden" id="editNomeOriginal">
    <input type="hidden" id="editRede">

    <div class="form-group" style="margin-bottom: 12px;">
      <label>Nome Completo</label>
      <input type="text" id="editNome">
    </div>
    <div class="form-group" style="margin-bottom: 12px;">
      <label>Data de Nascimento</label>
      <input type="date" id="editNascimento">
    </div>
    <div class="form-group" style="margin-bottom: 12px;">
      <label>WhatsApp</label>
      <input type="text" id="editWhatsapp">
    </div>
    <div class="form-group" style="margin-bottom: 12px;">
      <label>Batizado?</label>
      <select id="editBatizado">
        <option value="Sim">Sim</option>
        <option value="Não">Não</option>
      </select>
    </div>
    <div class="form-group" style="margin-bottom: 12px;">
      <label>Categoria</label>
      <select id="editCategoria">
        <option value="Liderado">Liderado</option>
        <option value="Base da Rede">Base da Rede</option>
      </select>
    </div>

    <div class="modal-footer">
      <button class="btn-cancelar" onclick="fecharModalEdicao()">Cancelar</button>
      <button class="btn-salvar" onclick="salvarEdicaoMembro()">Salvar Alterações</button>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxWFDRZFXS0RQmErdlERXKy4D4e8DQUhbZsyVPwuetLqKAYzB5ATtcKU-GOnZwghmBfCw/exec";

  const dadosTopo = [
    { supervisao: "Supervisão Monte Hor", supervisor: "Luís Felipe", redes: [{ nome: "Rede Moisés", lider: "Gabriel" }, { nome: "Rede Alfa", lider: "Plinio" }, { nome: "Rede Timóteo", lider: "Sotero" }, { nome: "Rede Next", lider: "Vyni Léo" }, { nome: "Rede Inconformados", lider: "Maurilio" }, { nome: "Rede Atalaia", lider: "Mancine" }] },
    { supervisao: "Supervisão Monte Tabor", supervisor: "Danylo Brissantt", redes: [{ nome: "Hazak", lider: "Vitinho" }, { nome: "Monte Pisga", lider: "Ezequiel" }, { nome: "Escolhidos", lider: "João" }, { nome: "Paroikos", lider: "Iago" }, { nome: "Atos", lider: "Arley" }, { nome: "Karygma", lider: "Richard" }] },
    { supervisao: "Supervisão Monte Nebo", supervisor: "Emanuel Henrique", redes: [{ nome: "Rede Invictos", lider: "Éden" }, { nome: "Rede Ekballo", lider: "Cristian" }, { nome: "Rede Ousadia", lider: "Wallyson" }, { nome: "Rede Maranata", lider: "Richarlyson" }, { nome: "Rede Ruah", lider: "Vinícius" }] },
    { supervisao: "Supervisão Monte Horebe", supervisor: "Andryo Henrique", redes: [{ nome: "Rede Aljava", lider: "Taycilio" }, { nome: "Rede Sal da Terra", lider: "Marcelo Flexa" }, { nome: "Rede Ekklesia", lider: "Rodrigo" }, { nome: "Rede Forjados", lider: "Alef" }] },
    { supervisao: "Supervisão Monte Carmelo", supervisor: "Diana Guerra", redes: [{ nome: "Rede Flame", lider: "Cecília" }, { nome: "Rede Aurora", lider: "Ester" }, { nome: "Rede Colossenses", lider: "Ingrid" }, { nome: "Rede Perazim", lider: "Íris" }, { nome: "Rede Rise", lider: "Gabriela" }] },
    { supervisao: "Supervisão Monte Moriá", supervisor: "Larissa Neves", redes: [{ nome: "Rede Peregrina", lider: "Saiwry" }, { nome: "Rede Lume", lider: "Myrella" }, { nome: "Rede Promessa", lider: "Júlia" }, { nome: "Rede Áquila", lider: "Thaynara" }, { nome: "Rede Carmesim", lider: "Lívia" }, { nome: "Rede Emunah", lider: "Mayara" }, { nome: "Rede Margaridas", lider: "Lara" }] },
    { supervisao: "Supervisão Monte Sinai", supervisor: "Sara Gomes", redes: [{ nome: "Rede Jardim", lider: "Joana" }, { nome: "Rede Dunamis", lider: "Mikaele" }, { nome: "Rede Grace", lider: "Fernanda" }, { nome: "Rede Graciosa", lider: "Gleicy" }, { nome: "Rede Zoe", lider: "Karol" }, { nome: "Rede Lamparinas", lider: "Laura Ester" }] },
    { supervisao: "Supervisão Monte Sião", supervisor: "Clara Dione", redes: [{ nome: "Rede Águias", lider: "Anny" }, { nome: "Rede Hope", lider: "Laysa" }, { nome: "Rede Bloom", lider: "Clara" }, { nome: "Rede Herdeiras", lider: "Mika" }] },
    { supervisao: "Supervisão Monte das Oliveiras", supervisor: "Letícia Sampaio", redes: [{ nome: "Monte das Oliveiras", lider: "Letícia Sampaio" }, { nome: "Rede Lily", lider: "Dayanne Lethicia" }, { nome: "Rede Liz", lider: "Letícia Rodrigues" }, { nome: "Rede Âmbar", lider: "Gabriella A." }] },
    { supervisao: "Supervisão Monte Seir", supervisor: "Karol Nogueira", redes: [{ nome: "Rede Joy", lider: "Leticia" }, { nome: "Rede Legacy", lider: "Laura" }, { nome: "Rede Ramá", lider: "Raianny" }] }
  ];

  let dadosBrutos = { membros: [], relatorios: [] };

  document.addEventListener("DOMContentLoaded", function() {
    carregarSupervisoes();
    document.getElementById('selectSupervisao').addEventListener('change', atualizarRedes);
    document.getElementById('selectRede').addEventListener('change', carregarDadosDashboard);
  });

  function carregarSupervisoes() {
    const selectSup = document.getElementById('selectSupervisao');
    dadosTopo.forEach((item, index) => {
      const opt = document.createElement('option');
      opt.value = index;
      opt.textContent = `${item.supervisao} (${item.supervisor})`;
      selectSup.appendChild(opt);
    });
  }

  function atualizarRedes() {
    const indexSup = document.getElementById('selectSupervisao').value;
    const selectRede = document.getElementById('selectRede');
    selectRede.innerHTML = '';
    document.getElementById('conteudoPainel').style.display = 'none';

    if (indexSup === "") {
      selectRede.disabled = true;
      selectRede.innerHTML = '<option value="">Selecione a Supervisão primeiro</option>';
      return;
    }

    const sup = dadosTopo[indexSup];
    selectRede.disabled = false;
    selectRede.innerHTML = '<option value="">Selecione a Rede</option>';
    sup.redes.forEach((r, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = `${r.nome} (Líder: ${r.lider})`;
      selectRede.appendChild(opt);
    });
  }

  async function carregarDadosDashboard() {
    const indexSup = document.getElementById('selectSupervisao').value;
    const indexRede = document.getElementById('selectRede').value;
    if (indexSup === "" || indexRede === "") return;

    document.getElementById('loading').style.display = 'block';
    document.getElementById('conteudoPainel').style.display = 'none';

    try {
      const resp = await fetch(`${API_URL}?action=getDados`);
      dadosBrutos = await resp.json();
      renderizarPainel();
    } catch (err) {
      alert("Erro ao carregar dados da planilha.");
      console.log(err);
    } finally {
      document.getElementById('loading').style.display = 'none';
    }
  }

  function renderizarPainel() {
    const indexSup = document.getElementById('selectSupervisao').value;
    const indexRede = document.getElementById('selectRede').value;
    const nomeRede = dadosTopo[indexSup].redes[indexRede].nome;

    const membrosRede = dadosBrutos.membros.slice(1).filter(m => m[3] === nomeRede && m[10] !== "INATIVO");
    const relatoriosRede = dadosBrutos.relatorios.slice(1).filter(r => r[3] === nomeRede).reverse();

    const total = membrosRede.length;
    const cardSaude = document.getElementById('cardSaude');
    const titSaude = document.getElementById('tituloSaude');
    const descSaude = document.getElementById('descSaude');
    document.getElementById('qtdMembrosMembro').innerText = total;

    if (total === 12) {
      cardSaude.className = "health-card green";
      titSaude.innerText = "Rede Equilibrada";
      descSaude.innerText = "Tamanho ideal atingido (12 membros ativas).";
    } else if (total < 12) {
      cardSaude.className = "health-card yellow";
      titSaude.innerText = "⚠️ Alerta de Crescimento";
      descSaude.innerText = `Necessário +${12 - total} membros para atingir a meta de 12.`;
    } else {
      cardSaude.className = "health-card blue";
      titSaude.innerText = "🚀 Alerta de Multiplicação";
      descSaude.innerText = `A rede ultrapassou 12 membros (${total}) e está pronta para multiplicar!`;
    }

    const containerMembros = document.getElementById('listaMembros');
    document.getElementById('totalMembrosLista').innerText = total;
    containerMembros.innerHTML = '';

    if (total === 0) {
      containerMembros.innerHTML = `<div style="color: var(--text-muted); font-size: 0.9rem;">Nenhum membro cadastrado nesta rede ainda.</div>`;
    } else {
      const mesAtual = new Date().getMonth() + 1;

      membrosRede.forEach(m => {
        const nome = m[5];
        const nascimento = m[6] || '';
        const whats = m[7] || 'Sem WhatsApp';
        const batizado = m[8] || 'Não';
        const categoria = m[9] || 'Liderado';

        let faltasSeguidas = 0;
        for (let r of relatoriosRede) {
          const faltantesTxt = r[10] ? r[10].toString() : '';
          if (faltantesTxt.includes(nome)) {
            faltasSeguidas++;
          } else {
            break;
          }
        }

        let isNiver = false;
        if (nascimento) {
          const partesNasc = nascimento.toString().split('-');
          if (partesNasc.length === 3 && parseInt(partesNasc[1]) === mesAtual) {
            isNiver = true;
          }
        }

        const div = document.createElement('div');
        div.className = 'membro-card';

        let tagsHTML = `<span class="tag ${categoria === 'Base da Rede' ? 'tag-base' : 'tag-liderado'}">${categoria}</span>`;
        if (isNiver) tagsHTML += `<span class="tag tag-niver">🎂 Aniversariante do Mês</span>`;
        if (faltasSeguidas === 2) tagsHTML += `<span class="tag tag-warning">⚠️ Alerta de Apascentamento (2 faltas seguidas)</span>`;
        if (faltasSeguidas >= 3) tagsHTML += `<span class="tag tag-danger">⛔ Não Pode Servir (${faltasSeguidas} faltas seguidas)</span>`;

        // Prepara dados formatados para a janela de edição
        const nascFormatted = nascimento ? nascimento.toString().substring(0,10) : '';

        div.innerHTML = `
          <div class="membro-main">
            <strong>${nome}</strong>
            <small>📱 ${whats} | Batizado: ${batizado}</small>
            <div class="tags">${tagsHTML}</div>
          </div>
          <div class="actions-group">
            <button class="btn-edit" onclick="abrirModalEdicao('${nome}', '${nascFormatted}', '${whats}', '${batizado}', '${categoria}', '${nomeRede}')">✏️ Editar</button>
            <button class="btn-delete" onclick="inativarMembro('${nome}', '${nomeRede}')">Remover</button>
          </div>
        `;
        containerMembros.appendChild(div);
      });
    }

    const containerRel = document.getElementById('listaRelatorios');
    containerRel.innerHTML = '';
    if (relatoriosRede.length === 0) {
      containerRel.innerHTML = `<div style="color: var(--text-muted); font-size: 0.9rem;">Nenhum relatório enviado para esta rede até o momento.</div>`;
    } else {
      relatoriosRede.slice(0, 5).forEach(r => {
        const div = document.createElement('div');
        div.className = 'relatorio-item';
        div.innerHTML = `
          <div class="relatorio-header">
            <span>📅 ${r[5]} (${r[6]})</span>
            <span style="color: var(--primary);">📍 ${r[7]}</span>
          </div>
          <div class="relatorio-body">
            <strong>Tema:</strong> ${r[11]}<br>
            <strong>Presentes:</strong> ${r[8]}<br>
            <span style="color: var(--danger);"><strong>Faltantes:</strong> ${r[10]}</span>
          </div>
        `;
        containerRel.appendChild(div);
      });
    }

    document.getElementById('conteudoPainel').style.display = 'block';
  }

  // Funções da Janela de Edição
  function abrirModalEdicao(nome, nascimento, whats, batizado, categoria, rede) {
    document.getElementById('editNomeOriginal').value = nome;
    document.getElementById('editRede').value = rede;
    document.getElementById('editNome').value = nome;
    document.getElementById('editNascimento').value = nascimento;
    document.getElementById('editWhatsapp').value = whats === 'Sem WhatsApp' ? '' : whats;
    document.getElementById('editBatizado').value = batizado;
    document.getElementById('editCategoria').value = categoria;

    document.getElementById('modalEdicao').style.display = 'flex';
  }

  function fecharModalEdicao() {
    document.getElementById('modalEdicao').style.display = 'none';
  }

  async function salvarEdicaoMembro() {
    const nomeOrig = document.getElementById('editNomeOriginal').value;
    const rede = document.getElementById('editRede').value;
    const novoNome = document.getElementById('editNome').value.trim();
    const novoNasc = document.getElementById('editNascimento').value;
    const novoWhats = document.getElementById('editWhatsapp').value.trim();
    const novoBatizado = document.getElementById('editBatizado').value;
    const novaCategoria = document.getElementById('editCategoria').value;

    if (!novoNome) {
      alert("Por favor, informe o nome.");
      return;
    }

    fecharModalEdicao();
    document.getElementById('loading').style.display = 'block';

    try {
      await fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          tipo: "EDITAR_MEMBRO",
          nomeOriginal: nomeOrig,
          rede: rede,
          nome: novoNome,
          nascimento: novoNasc,
          whatsapp: novoWhats,
          batizado: novoBatizado,
          categoria: novaCategoria
        })
      });

      alert("Membro atualizado com sucesso!");
      carregarDadosDashboard();
    } catch (err) {
      alert("Erro ao editar o membro.");
      console.log(err);
      document.getElementById('loading').style.display = 'none';
    }
  }

  async function inativarMembro(nome, rede) {
    if (!confirm(`Tem certeza que deseja remover ${nome} da ${rede}?`)) return;

    document.getElementById('loading').style.display = 'block';
    try {
      await fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          tipo: "INATIVAR_MEMBRO",
          nome: nome,
          rede: rede
        })
      });

      alert(`${nome} foi removido(a) com sucesso.`);
      carregarDadosDashboard();
    } catch (err) {
      alert("Erro ao remover membro.");
      console.log(err);
      document.getElementById('loading').style.display = 'none';
    }
  }
</script>
