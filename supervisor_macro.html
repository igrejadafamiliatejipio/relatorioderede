<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Supervisor (Macro) - Ministério TOPO</title>
  <style>
    :root {
      --bg: #0D0F12; --card-bg: #161B22; --card-border: #30363D;
      --input-bg: #0D1117; --text: #F0F6FC; --text-muted: #8B949E;
      --primary: #6E56CF; --primary-hover: #5B45B0;
      --success: #23D160; --warning: #E3B341; --danger: #E5534B; --info: #388BFD;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px 8px; display: flex; justify-content: center; min-height: 100vh; }
    .container { max-width: 960px; width: 100%; background: var(--card-bg); padding: 20px; border-radius: 16px; border: 1px solid var(--card-border); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
    
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
    .btn-voltar { background: #21262D; color: var(--text); border: 1px solid var(--card-border); padding: 6px 12px; border-radius: 6px; font-size: 0.82rem; text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .btn-voltar:hover { background: #30363D; }
    
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 1.5rem; font-weight: 700; margin-top: 4px; }
    .badge-topo { display: inline-block; background: var(--primary); color: #FFF; padding: 4px 12px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 6px; text-transform: uppercase; }

    /* Métricas Responsivas */
    .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
    .metric-card { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 12px 8px; text-align: center; }
    .metric-card h4 { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
    .metric-card .value { font-size: 1.2rem; font-weight: 800; color: var(--text); }
    
    .section-title { font-size: 1.05rem; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    
    /* Sanfona */
    .sanfona-box { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
    .sanfona-header { padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; font-size: 0.95rem; font-weight: 600; color: var(--text); gap: 8px; }
    .sanfona-header:hover { background: rgba(255,255,255,0.02); }
    .sanfona-conteudo { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out, padding 0.3s ease-out; padding: 0 14px; background: var(--card-bg); border-top: 0px solid var(--card-border); }
    .sanfona-box.ativo .sanfona-conteudo { max-height: 1200px; padding: 14px; border-top: 1px solid var(--card-border); overflow-y: auto; }
    .seta-sanfona { transition: transform 0.3s; font-size: 0.75rem; color: var(--text-muted); flex-shrink: 0; }
    .sanfona-box.ativo .seta-sanfona { transform: rotate(180deg); }

    /* Tabelas */
    .table-container { width: 100%; overflow-x: auto; margin-bottom: 10px; border: 1px solid var(--card-border); border-radius: 10px; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; white-space: nowrap; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--card-border); }
    th { background: var(--input-bg); color: var(--text-muted); font-size: 0.72rem; text-transform: uppercase; }
    tr:last-child td { border-bottom: none; }
    
    .tag { font-size: 0.7rem; padding: 2px 6px; border-radius: 12px; font-weight: 600; display: inline-block; }
    .tag-green { background: rgba(35, 209, 96, 0.2); color: var(--success); border: 1px solid rgba(35, 209, 96, 0.4); }
    .tag-yellow { background: rgba(227, 179, 65, 0.2); color: var(--warning); border: 1px solid rgba(227, 179, 65, 0.4); }
    .tag-blue { background: rgba(56, 139, 253, 0.2); color: var(--info); border: 1px solid rgba(56, 139, 253, 0.3); }
    .tag-danger { background: rgba(229, 83, 75, 0.2); color: var(--danger); border: 1px solid rgba(229, 83, 75, 0.4); }
    .tag-informal { background: rgba(227, 179, 65, 0.15); color: #F1E05A; border: 1px solid rgba(227, 179, 65, 0.4); }
    
    .btn-whats { background: #23D160; color: #000; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    .btn-detalhes-rede { background: rgba(110, 86, 207, 0.2); color: #A58BFF; border: 1px solid rgba(110, 86, 207, 0.4); padding: 5px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; text-decoration: none; white-space: nowrap; }
    .btn-detalhes-rede:hover { background: var(--primary); color: #FFF; }

    .btn-promover { background: rgba(35, 209, 96, 0.15); color: var(--success); border: 1px solid rgba(35, 209, 96, 0.3); padding: 5px 8px; border-radius: 6px; font-size: 0.72rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .btn-promover:hover { background: var(--success); color: #000; }
    .btn-excluir-rede { background: rgba(229, 83, 75, 0.15); color: var(--danger); border: 1px solid rgba(229, 83, 75, 0.3); padding: 5px 8px; border-radius: 6px; font-size: 0.72rem; font-weight: 600; cursor: pointer; }
    .btn-excluir-rede:hover { background: var(--danger); color: #FFF; }

    /* Cards da Árvore */
    .supervisao-card { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
    .supervisao-card.informal { border-color: rgba(227, 179, 65, 0.5); background: linear-gradient(135deg, rgba(227, 179, 65, 0.05) 0%, var(--input-bg) 100%); }

    .supervisao-header { padding: 12px 14px; cursor: pointer; user-select: none; }
    .supervisao-header:hover { background: rgba(255,255,255,0.02); }
    
    .redes-list { padding: 0 12px; max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out, padding 0.3s ease-out; background: var(--card-bg); border-top: 0px solid var(--card-border); }
    .supervisao-card.ativo .redes-list { max-height: 1000px; padding: 12px; border-top: 1px solid var(--card-border); overflow-y: auto; }
    
    .rede-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--card-border); font-size: 0.85rem; background: rgba(255,255,255,0.01); border-radius: 8px; margin-bottom: 6px; gap: 6px; }
    .rede-item:last-child { margin-bottom: 0; }
    
    /* Destaque Líder */
    .rede-item-lider { background: linear-gradient(135deg, rgba(35, 209, 96, 0.15) 0%, rgba(22, 27, 34, 0.9) 100%); border: 1px solid rgba(35, 209, 96, 0.4); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; box-shadow: 0 4px 15px rgba(35, 209, 96, 0.1); }
