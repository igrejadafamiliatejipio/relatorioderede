<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Macro - Supervisor</title>
  <style>
    :root {
      --bg: #0D0F12;
      --card-bg: #161B22;
      --card-border: #30363D;
      --input-bg: #0D1117;
      --text: #F0F6FC;
      --text-muted: #8B949E;
      --primary: #6E56CF;
      --primary-hover: #5B45B0;
      --success: #23D160;
      --warning: #E3B341;
      --danger: #E5534B;
      --info: #388BFD;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px 8px; display: flex; justify-content: center; min-height: 100vh; }
    .container { max-width: 850px; width: 100%; background: var(--card-bg); padding: 20px; border-radius: 16px; border: 1px solid var(--card-border); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }

    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .btn-voltar { background: #21262D; color: var(--text); border: 1px solid var(--card-border); padding: 6px 12px; border-radius: 6px; font-size: 0.82rem; text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .btn-voltar:hover { background: #30363D; }

    .header { text-align: center; margin-bottom: 20px; }
    .badge-topo { display: inline-block; background: var(--primary); color: #FFF; padding: 4px 12px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 6px; text-transform: uppercase; }
    .header h1 { font-size: 1.5rem; font-weight: 800; margin-top: 4px; }

    .section-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }

    /* Árvore de Redes / Sanfonas */
    .sanfona-box { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
    .sanfona-header { padding: 14px 16px; font-size: 0.95rem; font-weight: 700; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: rgba(255,255,255,0.02); transition: 0.2s; gap: 12px; flex-wrap: wrap; }
    .sanfona-header:hover { background: rgba(255,255,255,0.05); }
    
    .rede-info-wrapper { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
    .rede-nome { font-size: 1rem; color: var(--text); font-weight: 700; }
    .rede-lider-sub { font-size: 0.78rem; color: var(--text-muted); font-weight: 500; }

    .sanfona-acoes { display: flex; align-items: center; gap: 10px; }
    .btn-detalhes { background: rgba(110, 86, 207, 0.2); color: #A58BFF; border: 1px solid rgba(110, 86, 207, 0.4); padding: 6px 12px; border-radius: 6px; font-size: 0.78rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: 0.2s; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    .btn-detalhes:hover { background: var(--primary); color: #FFF; border-color: var(--primary); }

    .loading-box { text-align: center; padding: 40px; color: var(--text-muted); }

    @media (max-width: 600px) {
      .container { padding: 14px; }
      .sanfona-header { flex-direction: column; align-items: flex-start; }
      .sanfona-acoes { width: 100%; justify-content: space-between; margin-top: 6px; border-top: 1px solid var(--card-border); padding-top: 8px; }
    }
  </style>

  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="container">
  <div class="top-nav">
    <button class="btn-voltar" onclick="window.location.href='index.html'">← Voltar ao Início</button>
  </div>

  <div class="header">
    <span class="badge-topo" id="badgeMinisterio">PAINEL MACRO - SUPERVISÃO</span>
    <h1 id="tituloSupervisor">Carregando Supervisor...</h1>
  </div>

  <div id="conteudoMacro" style="display: none;">
    <div class="section-title">🌿 Redes Sob sua Supervisão</div>
    <div id="listaRedesMacro"></div>
  </div>

  <div id="loading" class="loading-box">Carregando dados da supervisão...</div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB7FJXs9wiRFYIs2ugZoWrw7jTXPR5weGk",
    authDomain: "app-redes-iftejipio.firebaseapp.com",
    projectId: "app-redes-iftejipio",
    storageBucket: "app-redes-iftejipio.firebasestorage.app",
    messagingSenderId: "954529090793",
    appId: "1:954529090793:web:6702d102b6e5b178b6b478",
    measurementId: "G-2MJ96WMYQ5"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let supervisorNome = '';
  let ministerioAtivo = 'TOPO';

  document.addEventListener("DOMContentLoaded", async () => {
    ministerioAtivo = sessionStorage.getItem('topo_ministerio') || 'TOPO';
    supervisorNome = sessionStorage.getItem('topo_sup_nome') || sessionStorage.getItem('topo_coord_logado') || 'Supervisor';

    document.getElementById('badgeMinisterio').innerText = `PAINEL MACRO - ${ministerioAtivo}`;
    document.getElementById('tituloSupervisor').innerText = `Supervisor(a): ${supervisorNome}`;

    await carregarRedesMacro();
  });

  async function carregarRedesMacro() {
    try {
      // 1. Buscar todas as redes do ministério e supervisão atual
      const snapMembros = await db.collection('membros')
        .where('ministerio', '==', ministerioAtivo)
        .get();

      let redesMapa = {};

      snapMembros.forEach(doc => {
        const d = doc.data();
        if (d.status !== 'INATIVO' && d.rede && d.rede.trim() !== '') {
          const nomeRede = d.rede.trim();
          if (!redesMapa[nomeRede]) {
            redesMapa[nomeRede] = {
              liderNome: 'Sem líder definido',
              totalMembros: 0
            };
          }
          redesMapa[nomeRede].totalMembros++;
          
          // Identificar o líder da rede
          const cat = (d.categoria || '').trim();
          if (cat === 'Líder' || cat === 'Lider') {
            redesMapa[nomeRede].liderNome = d.nome || 'Líder sem nome';
          }
        }
      });

      const container = document.getElementById('listaRedesMacro');
      container.innerHTML = '';

      const nomesRedes = Object.keys(redesMapa).sort();

      if (nomesRedes.length === 0) {
        container.innerHTML = '<div style="color:var(--text-muted); font-size:0.85rem; text-align:center; padding: 20px;">Nenhuma rede encontrada para este ministério.</div>';
      } else {
        nomesRedes.forEach(nomeRede => {
          const info = redesMapa[nomeRede];

          const card = document.createElement('div');
          card.className = 'sanfona-box';
          card.innerHTML = `
            <div class="sanfona-header">
              <div class="rede-info-wrapper">
                <span class="rede-nome">🌐 ${nomeRede}</span>
                <span class="rede-lider-sub">👑 Líder: ${info.liderNome} (${info.totalMembros} membros)</span>
              </div>
              <div class="sanfona-acoes">
                <button class="btn-detalhes" onclick="abrirDetalhesRede('${nomeRede}')">🔍 Ver Detalhes</button>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      }

      document.getElementById('loading').style.display = 'none';
      document.getElementById('conteudoMacro').style.display = 'block';

    } catch (err) {
      console.error(err);
      document.getElementById('loading').innerHTML = `<div style="color:var(--danger)">Erro ao carregar as redes.</div>`;
    }
  }

  function abrirDetalhesRede(nomeRede) {
    window.location.href = `supervisor_detalhes_rede.html?rede=${encodeURIComponent(nomeRede)}`;
  }
</script>

</body>
</html>
