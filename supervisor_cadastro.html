<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Membros - Supervisor - Ministério TOPO</title>
  <style>
    :root {
      --bg: #0D0F12; --card-bg: #161B22; --card-border: #30363D;
      --input-bg: #0D1117; --text: #F0F6FC; --text-muted: #8B949E;
      --primary: #6E56CF; --primary-hover: #5B45B0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px 12px; display: flex; justify-content: center; min-height: 100vh; }
    .container { max-width: 600px; width: 100%; background: var(--card-bg); padding: 28px; border-radius: 16px; border: 1px solid var(--card-border); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
    .btn-voltar { background: #21262D; color: var(--text); border: 1px solid var(--card-border); padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 20px; }
    .btn-voltar:hover { background: #30363D; }
    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 1.5rem; font-weight: 700; margin-top: 6px; }
    .badge-topo { display: inline-block; background: var(--primary); color: #FFF; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }
    .form-group { margin-bottom: 16px; text-align: left; }
    label { display: block; font-weight: 500; font-size: 0.82rem; margin-bottom: 6px; color: var(--text-muted); text-transform: uppercase; }
    input, select { width: 100%; padding: 12px 14px; background-color: var(--input-bg); border: 1px solid var(--card-border); border-radius: 8px; font-size: 0.95rem; color: var(--text); outline: none; }
    input:focus, select:focus { border-color: var(--primary); }
    select option { background-color: var(--card-bg); color: var(--text); }
    .btn { background-color: var(--primary); color: white; border: none; padding: 12px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.95rem; width: 100%; transition: 0.2s; margin-top: 8px; }
    .btn:hover { background-color: var(--primary-hover); }
    .loading-box { text-align: center; padding: 40px; color: var(--text-muted); display: none; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="container">
  <a href="supervisor_menu.html" class="btn-voltar">← Voltar ao Menu</a>
  <div class="header">
    <span class="badge-topo">CADASTRO DE MEMBROS</span>
    <h1>Novo Membro na Supervisão</h1>
  </div>
  <div id="formContainer">
    <div class="form-group"><label>Nome Completo do Membro</label><input type="text" id="cadNome" placeholder="Digite o nome completo"></div>
    <div class="form-group"><label>WhatsApp</label><input type="text" id="cadWhatsapp" placeholder="(81) 99999-9999"></div>
    <div class="form-group"><label>Data de Nascimento</label><input type="date" id="cadNascimento"></div>
    <div class="form-group"><label>Sexo</label><select id="cadSexo"><option value="Masculino">Masculino</option><option value="Feminino">Feminino</option></select></div>
    <div class="form-group"><label>Batizado?</label><select id="cadBatizado"><option value="Sim">Sim</option><option value="Não">Não</option></select></div>
    <div class="form-group"><label>Categoria</label><select id="cadCategoria"><option value="Liderado">Liderado</option><option value="Base da Rede">Base da Rede</option><option value="Líder">Líder</option></select></div>
    <div class="form-group"><label>Rede de Destino</label><select id="cadRedeSelect"></select></div>
    <button class="btn" onclick="salvarNovoMembro()">Cadastrar Membro</button>
  </div>
  <div id="loading" class="loading-box">Salvando membro no Firebase...</div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB7FJXs9wiRFYIs2ugZoWrw7jTXPR5weGk",
    authDomain: "app-redes-iftejipio.firebaseapp.com",
    projectId: "app-redes-iftejipio",
    storageBucket: "app-redes-iftejipio.firebasestorage.app",
    messagingSenderId: "954529090793",
    appId: "1:954529090793:web:6702d102b6e5b178b6b478",
    measurementId: "G-2MJ96WMYQ5"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let supervisaoNome = '';
  let redesSup = [];

  document.addEventListener('DOMContentLoaded', () => {
    supervisaoNome = sessionStorage.getItem('topo_sup_nome');
    const redesStr = sessionStorage.getItem('topo_sup_redes');
    if (!supervisaoNome || !redesStr) {
      window.location.href = "supervisor.html";
      return;
    }
    redesSup = JSON.parse(redesStr);
    const selectRede = document.getElementById('cadRedeSelect');
    selectRede.innerHTML = '';
    redesSup.forEach(r => {
      const opt = document.createElement('option');
      opt.value = r.nome;
      opt.textContent = r.nome;
      selectRede.appendChild(opt);
    });
  });

  async function salvarNovoMembro() {
    const nome = document.getElementById('cadNome').value.trim();
    const whatsapp = document.getElementById('cadWhatsapp').value.trim();
    const nascimento = document.getElementById('cadNascimento').value;
    const sexo = document.getElementById('cadSexo').value;
    const batizado = document.getElementById('cadBatizado').value;
    const categoria = document.getElementById('cadCategoria').value;
    const rede = document.getElementById('cadRedeSelect').value;

    if (!nome || !nascimento || !rede) return alert("Preencha Nome, Nascimento e Rede.");

    document.getElementById('formContainer').style.display = 'none';
    document.getElementById('loading').style.display = 'block';

    try {
      await db.collection('membros').add({
        nome, whatsapp, nascimento, sexo, batizado, categoria, rede,
        supervisao: supervisaoNome,
        status: "ATIVO"
      });
      alert("✅ Membro cadastrado com sucesso!");
      window.location.href = "supervisor_menu.html";
    } catch (err) {
      alert("Erro ao cadastrar membro.");
      console.error(err);
      document.getElementById('loading').style.display = 'none';
      document.getElementById('formContainer').style.display = 'block';
    }
  }
</script>
</body>
</html>
