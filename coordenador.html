<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login do Coordenador - Ministério TOPO</title>
  <style>
    :root {
      --bg: #0D0F12; --card-bg: #161B22; --card-border: #30363D;
      --input-bg: #0D1117; --text: #F0F6FC; --text-muted: #8B949E;
      --primary: #6E56CF; --primary-hover: #5B45B0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px 12px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { max-width: 400px; width: 100%; background: var(--card-bg); padding: 32px; border-radius: 16px; border: 1px solid var(--card-border); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); text-align: center; }
    .header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; }
    .header p { color: var(--text-muted); font-size: 0.88rem; margin-bottom: 24px; }
    .badge-topo { display: inline-block; background: var(--primary); color: #FFF; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 12px; }
    .form-group { margin-bottom: 16px; text-align: left; }
    label { display: block; font-weight: 500; font-size: 0.82rem; margin-bottom: 6px; color: var(--text-muted); text-transform: uppercase; }
    input { width: 100%; padding: 12px 14px; background-color: var(--input-bg); border: 1px solid var(--card-border); border-radius: 8px; font-size: 0.95rem; color: var(--text); outline: none; }
    input:focus { border-color: var(--primary); }
    .btn { background-color: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 1rem; width: 100%; margin-top: 10px; transition: 0.2s; }
    .btn:hover { background-color: var(--primary-hover); }
    .btn-voltar { background: #21262D; color: var(--text); border: 1px solid var(--card-border); padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; text-decoration: none; display: inline-block; margin-top: 16px; }
    .btn-voltar:hover { background: #30363D; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <span class="badge-topo">MINISTÉRIO TOPO</span>
    <h1>Área do Coordenador</h1>
    <p>Digite seu nome e a senha de acesso</p>
  </div>

  <form onsubmit="fazerLogin(event)">
    <div class="form-group">
      <label>Nome do Coordenador</label>
      <input type="text" id="inputNome" placeholder="Seu nome completo" required>
    </div>

    <div class="form-group">
      <label>Senha de Acesso</label>
      <input type="password" id="inputSenha" placeholder="Digite a senha" required>
    </div>

    <button type="submit" class="btn">Entrar</button>
  </form>

  <a href="index.html" class="btn-voltar">← Voltar ao Início</a>
</div>

<script>
  function fazerLogin(e) {
    e.preventDefault();
    const nome = document.getElementById('inputNome').value.trim();
    const senha = document.getElementById('inputSenha').value.trim();

    if (senha !== "740") {
      alert("❌ Senha incorreta! A senha de acesso do coordenador é 740.");
      return;
    }

    if (!nome) {
      alert("Por favor, informe seu nome.");
      return;
    }

    sessionStorage.setItem('topo_coord_nome', nome);
    window.location.href = "coordenador_menu.html";
  }
</script>
</body>
</html>
