<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Limpeza de Dados - Ministério TOPO</title>
  <style>
    body { background: #0D0F12; color: #F0F6FC; font-family: sans-serif; padding: 40px; text-align: center; }
    button { background: #E5534B; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1rem; cursor: pointer; font-weight: bold; }
    button:hover { background: #c93b33; }
    #status { margin-top: 20px; font-size: 1.1rem; color: #23D160; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <h1>🧹 Limpeza de Supervisões "Geral"</h1>
  <p>Clique no botão abaixo para remover o valor "Geral" das supervisões e redes no banco de dados.</p>
  <br>
  <button onclick="limparDados()">Executar Limpeza</button>
  <div id="status"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB7FJXs9wiRFYIs2ugZoWrw7jTXPR5weGk",
    authDomain: "app-redes-iftejipio.firebaseapp.com",
    projectId: "app-redes-iftejipio",
    storageBucket: "app-redes-iftejipio.firebasestorage.app",
    messagingSenderId: "954529090793",
    appId: "1:954529090793:web:6702d102b6e5b178b6b478",
    measurementId: "G-2MJ96WMYQ5"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  async function limparDados() {
    const statusDiv = document.getElementById('status');
    statusDiv.innerText = "Limpando banco de dados...";

    try {
      let count = 0;
      const snap = await db.collection('membros').get();
      
      const batch = db.batch();
      snap.forEach(doc => {
        const d = doc.data();
        let atualizar = false;
        let dadosUpdate = {};

        // Se a supervisão for 'Geral' ou 'GERAL', limpa ou ajusta
        if (d.supervisao && d.supervisao.trim().toLowerCase() === 'geral') {
          dadosUpdate.supervisao = ""; // ou você pode deixar vazio
          atualizar = true;
        }
        
        // Se a rede for 'Geral' ou 'GERAL'
        if (d.rede && d.rede.trim().toLowerCase() === 'geral') {
          dadosUpdate.rede = "";
          atualizar = true;
        }

        if (atualizar) {
          batch.update(doc.ref, dadosUpdate);
          count++;
        }
      });

      if (count > 0) {
        await batch.commit();
        statusDiv.innerText = `✅ Sucesso! ${count} registros corrigidos (o 'Geral' foi removido).`;
      } else {
        statusDiv.innerText = "✅ Nenhum registro com 'Geral' foi encontrado para limpar.";
      }

    } catch (err) {
      console.error(err);
      statusDiv.style.color = "#E5534B";
      statusDiv.innerText = "❌ Erro ao limpar dados: " + err.message;
    }
  }
</script>
</body>
</html>
