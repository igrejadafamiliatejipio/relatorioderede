<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Corrigir Nomes dos Supervisores</title>
  <style>
    body { background: #0D0F12; color: #F0F6FC; font-family: sans-serif; text-align: center; padding-top: 50px; }
    button { background: #6E56CF; color: white; border: none; padding: 15px 25px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    button:hover { background: #5B45B0; }
    #log { margin-top: 20px; text-align: left; display: inline-block; max-width: 600px; background: #161B22; padding: 15px; border-radius: 8px; border: 1px solid #30363D; font-family: monospace; font-size: 0.85rem; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <h1>🔄 Atualizar Nomes dos Supervisores</h1>
  <p>Este script substitui os nomes antigos (ex: "Supervisão Monte Sião") pelo nome real da pessoa no banco de dados.</p>
  <br>
  <button onclick="executarCorrecao()">Executar Atualização</button>
  <br><br>
  <div id="log">Aguardando execução...</div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB7FJXs9wiRFYIs2ugZoWrw7jTXPR5weGk",
      authDomain: "app-redes-iftejipio.firebaseapp.com",
      projectId: "app-redes-iftejipio",
      storageBucket: "app-redes-iftejipio.firebasestorage.app",
      messagingSenderId: "954529090793",
      appId: "1:954529090793:web:6702d102b6e5b178b6b478",
      measurementId: "G-2MJ96WMYQ5"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function log(msg) {
      const d = document.getElementById('log');
      d.innerHTML += msg + "<br>";
      console.log(msg);
    }

    // Mapeamento do nome antigo para o nome real do supervisor
    const mapaNomes = {
      "Supervisão Monte Hor": "Luís Felipe",
      "Supervisão Monte Tabor": "Danylo Brissantt",
      "Supervisão Monte Nebo": "Emanuel Henrique",
      "Supervisão Monte Horebe": "Andryo Henrique",
      "Supervisão Monte Carmelo": "Diana Guerra",
      "Supervisão Monte Moriá": "Larissa Neves",
      "Supervisão Monte Sinai": "Sara Gomes",
      "Supervisão Monte Sião": "Clara Dione",
      "Supervisão Monte das Oliveiras": "Letícia Sampaio",
      "Supervisão Monte Seir": "Karol Nogueira"
    };

    async function executarCorrecao() {
      if (!confirm("Deseja atualizar os nomes dos supervisores no banco?")) return;
      
      document.getElementById('log').innerHTML = "Iniciando atualização...<br>";

      try {
        const snapshot = await db.collection('membros')
          .where('categoria', '==', 'Supervisor')
          .get();

        let atualizados = 0;

        for (const doc of snapshot.docs) {
          const dados = doc.data();
          const nomeAtual = dados.nome;

          // Se o nome atual estiver no mapa de nomes antigos, atualiza para o nome real
          if (mapaNomes[nomeAtual]) {
            const novoNome = mapaNomes[nomeAtual];
            await doc.ref.update({ nome: novoNome });
            log(`Supervisor atualizado: "${nomeAtual}" ➔ "${novoNome}"`);
            atualizados++;
          } else {
            log(`Supervisor já está correto ou não mapeado: "${nomeAtual}"`);
          }
        }

        log(`<br><strong>✅ Processo concluído! Total de supervisores atualizados: ${atualizados}</strong>`);

      } catch (err) {
        console.error(err);
        log(`<br><strong>❌ Erro:</strong> ${err.message}`);
      }
    }
  </script>
</body>
</html>
