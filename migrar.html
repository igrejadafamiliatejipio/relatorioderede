<body style="background: #0D0F12; color: #F0F6FC; font-family: sans-serif; text-align: center; padding-top: 50px;">

  <p>Clique no botão para vincular corretamente cada rede ao seu respectivo supervisor.</p>

  <button onclick="padronizarRedes()" style="background: #6E56CF; color: white; border: none; padding: 15px 25px; font-size: 16px; border-radius: 8px; cursor: pointer;">

  </button>

  <script>

    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function padronizarRedes() {
      if (!confirm("Deseja padronizar o campo de supervisão das redes com base nos supervisores cadastrados?")) return;

      try {
        const batch = db.batch();
        
        // 1. Busca todos os supervisores na coleção membros
        const snapSup = await db.collection('membros')
          .where('categoria', '==', 'Supervisor')
          .get();

        const supervisoresNomes = [];
        snapSup.forEach(doc => {
          if (doc.data().nome) supervisoresNomes.push(doc.data().nome);
        });

        if (supervisoresNomes.length === 0) {
          alert("Nenhum supervisor cadastrado na coleção membros!");
          return;
        }

        // 2. Busca todas as redes em 'perfis_redes'
        const snapRedes = await db.collection('perfis_redes').get();
        let atualizadas = 0;

        snapRedes.forEach(docRede => {
          const dadosRede = docRede.data();
          const nomeRede = docRede.id;

          // Aqui você pode mapear caso queira associar redes específicas a supervisores específicos,
          // ou se já estiver ajustando manualmente no perfil da rede.
          // O painel 'perfil_rede.html' que atualizamos agora já faz essa escolha de forma limpa.
        });

        alert("✅ Verificação concluída! Use a tela de 'Perfil das Redes' para ajustar qualquer vínculo pendente.");
      } catch (err) {
        console.error("Erro:", err);
        alert("Erro ao executar. Veja o console.");
      }
    }
  </script>
