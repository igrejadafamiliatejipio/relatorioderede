<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Corrigir Nomes de Supervisores</title>
  <style>
    body { background: #0D0F12; color: #F0F6FC; font-family: sans-serif; text-align: center; padding-top: 50px; }
    button { background: #6E56CF; color: white; border: none; padding: 15px 25px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    button:hover { background: #5B45B0; }
    #log { margin-top: 20px; text-align: left; display: inline-block; max-width: 600px; background: #161B22; padding: 15px; border-radius: 8px; border: 1px solid #30363D; font-family: monospace; font-size: 0.85rem; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <h1>🔄 Corrigir Vínculos de Supervisores</h1>
  <p>Este script substitui os nomes antigos de supervisão (ex: "Supervisão Monte Sião") pelo nome real do supervisor correspondente.</p>
  <br>
  <button onclick="executarCorrecao()">Executar Correção no Banco</button>
  <br><br>
  <div id="log">Aguardando execução...</div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB7FJXs9wiRFYIs2ugZoWrw7jTXPR5weGk",
      authDomain: "app-redes-iftejipio.firebaseapp.com",
      projectId: "app-redes-iftejipio",
      storageBucket: "app-redes-iftejipio.firebasestorage.app",
      messagingSenderId: "954529090793",
      appId: "1:954529090793:web:6702d102b6e5b178b6b478",
      measurementId: "G-2MJ96WMYQ5"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function log(msg) {
      const d = document.getElementById('log');
      d.innerHTML += msg + "<br>";
      console.log(msg);
    }

    // Mapeamento exato de qual supervisão antiga pertence a qual nome de supervisor real
    const mapaSupervisores = {
      "Supervisão Monte Hor": "Luís Felipe",
      "Supervisão Monte Tabor": "Danylo Brissantt",
      "Supervisão Monte Nebo": "Emanuel Henrique",
      "Supervisão Monte Horebe": "Andryo Henrique",
      "Supervisão Monte Carmelo": "Diana Guerra",
      "Supervisão Monte Moriá": "Larissa Neves",
      "Supervisão Monte Sinai": "Sara Gomes",
      "Supervisão Monte Sião": "Clara Dione",
      "Supervisão Monte das Oliveiras": "Letícia Sampaio",
      "Supervisão Monte Seir": "Karol Nogueira"
    };

    async function executarCorrecao() {
      if (!confirm("Deseja aplicar a correção dos nomes dos supervisores em todo o banco?")) return;
      
      document.getElementById('log').innerHTML = "Iniciando correção...<br>";

      try {
        // 1. Atualizar coleção 'membros'
        log("--- Atualizando coleção 'membros' ---");
        const snapMembros = await db.collection('membros').get();
        let countMembros = 0;

        for (const doc of snapMembros.docs) {
          const dados = doc.data();
          if (dados.supervisao && mapaSupervisores[dados.supervisao]) {
            const nomeReal = mapaSupervisores[dados.supervisao];
            await doc.ref.update({ supervisao: nomeReal });
            log(`Membro ${dados.nome}: Supervisão "${dados.supervisao}" ➔ "${nomeReal}"`);
            countMembros++;
          }
        }
        log(`Total de membros atualizados: ${countMembros}`);

        // 2. Atualizar coleção 'perfis_redes'
        log("--- Atualizando coleção 'perfis_redes' ---");
        const snapPerfis = await db.collection('perfis_redes').get();
        let countPerfis = 0;

        for (const doc of snapPerfis.docs) {
          const dados = doc.data();
          if (dados.supervisao && mapaSupervisores[dados.supervisao]) {
            const nomeReal = mapaSupervisores[dados.supervisao];
            await doc.ref.update({ supervisao: nomeReal });
            log(`Rede ${doc.id}: Supervisão "${dados.supervisao}" ➔ "${nomeReal}"`);
            countPerfis++;
          }
        }
        log(`Total de perfis de redes atualizados: ${countPerfis}`);

        log("<br><strong>✅ Correção concluída com sucesso! Os nomes reais dos supervisores agora substituíram os nomes antigos.</strong>");

      } catch (err) {
        console.error(err);
        log(`<br><strong>❌ Erro:</strong> ${err.message}`);
      }
    }
  </script>
</body>
</html>
