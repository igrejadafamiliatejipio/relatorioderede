<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selecionar Rede - Coordenador</title>
  <style>
    :root {
      --bg: #0D0F12; --card-bg: #161B22; --card-border: #30363D;
      --input-bg: #0D1117; --text: #F0F6FC; --text-muted: #8B949E;
      --primary: #6E56CF; --primary-hover: #5B45B0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px 12px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { max-width: 440px; width: 100%; background: var(--card-bg); padding: 32px; border-radius: 16px; border: 1px solid var(--card-border); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); text-align: center; }
    .top-nav { display: flex; justify-content: flex-start; margin-bottom: 16px; }
    .btn-voltar { background: #21262D; color: var(--text); border: 1px solid var(--card-border); padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; text-decoration: none; cursor: pointer; }
    .btn-voltar:hover { background: #30363D; }
    .header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; }
    .header p { color: var(--text-muted); font-size: 0.88rem; margin-bottom: 24px; }
    .badge-topo { display: inline-block; background: var(--primary); color: #FFF; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 12px; }
    .form-group { margin-bottom: 16px; text-align: left; }
    label { display: block; font-weight: 500; font-size: 0.82rem; margin-bottom: 6px; color: var(--text-muted); text-transform: uppercase; }
    select { width: 100%; padding: 12px 14px; background-color: var(--input-bg); border: 1px solid var(--card-border); border-radius: 8px; font-size: 0.95rem; color: var(--text); outline: none; }
    select option { background-color: var(--card-bg); color: var(--text); }
    .btn { background-color: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 1rem; width: 100%; margin-top: 10px; transition: 0.2s; }
    .btn:hover { background-color: var(--primary-hover); }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="container">
  <div class="top-nav">
    <a href="coordenador_menu.html" class="btn-voltar">← Voltar ao Menu</a>
  </div>

  <div class="header">
    <span class="badge-topo">COORDENAÇÃO</span>
    <h1>Painel de Rede</h1>
    <p>Selecione a supervisão e a rede desejada</p>
  </div>

  <div class="form-group">
    <label>1. Supervisor</label>
    <select id="selectSupervisor" onchange="carregarRedesDoSupervisor()">
      <option value="">Selecione um supervisor...</option>
    </select>
  </div>

  <div class="form-group">
    <label>2. Rede</label>
    <select id="selectRede" disabled>
      <option value="">Primeiro selecione o supervisor...</option>
    </select>
  </div>

  <button class="btn" onclick="acessarPainelRede()">Acessar Painel da Rede</button>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB7FJXs9wiRFYIs2ugZoWrw7jTXPR5weGk",
    authDomain: "app-redes-iftejipio.firebaseapp.com",
    projectId: "app-redes-iftejipio",
    storageBucket: "app-redes-iftejipio.firebasestorage.app",
    messagingSenderId: "954529090793",
    appId: "1:954529090793:web:6702d102b6e5b178b6b478",
    measurementId: "G-2MJ96WMYQ5"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let mapaSupervisoes = {};

  document.addEventListener("DOMContentLoaded", async () => {
    const logado = sessionStorage.getItem('topo_coord_logado');
    if (!logado) {
      window.location.href = "coordenador.html";
      return;
    }

    try {
      const snap = await db.collection('perfis_redes').get();
      mapaSupervisoes = {};

      snap.forEach(doc => {
        const d = doc.data();
        const sup = d.supervisao || "Geral";
        const rede = d.rede;
        if (rede) {
          if (!mapaSupervisoes[sup]) mapaSupervisoes[sup] = [];
          mapaSupervisoes[sup].push(rede);
        }
      });

      const selSup = document.getElementById('selectSupervisor');
      selSup.innerHTML = '<option value="">Selecione um supervisor...</option>';

      for (let sup in mapaSupervisoes) {
        const opt = document.createElement('option');
        opt.value = sup;
        opt.textContent = `Supervisor: ${sup}`;
        selSup.appendChild(opt);
      }
    } catch (err) {
      console.error(err);
      alert("Erro ao carregar supervisões.");
    }
  });

  function carregarRedesDoSupervisor() {
    const supSelecionado = document.getElementById('selectSupervisor').value;
    const selRede = document.getElementById('selectRede');

    selRede.innerHTML = '';
    if (!supSelecionado) {
      selRede.innerHTML = '<option value="">Primeiro selecione o supervisor...</option>';
      selRede.disabled = true;
      return;
    }

    const redes = mapaSupervisoes[supSelecionado] || [];
    if (redes.length === 0) {
      selRede.innerHTML = '<option value="">Nenhuma rede encontrada para este supervisor</option>';
      selRede.disabled = true;
      return;
    }

    selRede.innerHTML = '<option value="">Selecione uma rede...</option>';
    redes.forEach(rede => {
      const opt = document.createElement('option');
      opt.value = rede;
      opt.textContent = rede;
      selRede.appendChild(opt);
    });
    selRede.disabled = false;
  }

  function acessarPainelRede() {
    const redeSelecionada = document.getElementById('selectRede').value;
    if (!redeSelecionada) return alert("Selecione uma rede.");

    // Configura a sessão com a rede escolhida e abre o painel padrão do líder/rede
    sessionStorage.setItem('topo_rede', redeSelecionada);
    window.location.href = "painel_rede.html"; // ou o arquivo de painel de rede que você utiliza
  }
</script>
</body>
</html>
