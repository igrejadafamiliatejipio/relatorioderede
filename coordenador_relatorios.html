<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Relatórios - Ministério TOPO</title>
  <style>
    :root {
      --bg: #0D0F12;
      --card-bg: #161B22;
      --card-border: #30363D;
      --input-bg: #0D1117;
      --text: #F0F6FC;
      --text-muted: #8B949E;
      --primary: #6E56CF;
      --primary-hover: #5B45B0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px 10px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { max-width: 780px; width: 100%; background: var(--card-bg); padding: 24px; border-radius: 16px; border: 1px solid var(--card-border); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
    .btn-voltar { background: #21262D; color: var(--text); border: 1px solid var(--card-border); padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .btn-voltar:hover { background: #30363D; }
    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 1.5rem; font-weight: 700; margin-top: 4px; }
    .header p { font-size: 0.82rem; color: var(--text-muted); margin-top: 4px; }
    .badge-topo { display: inline-block; background: var(--primary); color: #FFF; padding: 4px 12px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 6px; text-transform: uppercase; }
    
    .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .menu-card { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 18px 12px; text-align: center; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .menu-card:hover { border-color: var(--primary); transform: translateY(-2px); background: rgba(110, 86, 207, 0.05); }
    .menu-card.disabled { opacity: 0.6; cursor: not-allowed; }
    .menu-card.disabled:hover { border-color: var(--card-border); transform: none; background: var(--input-bg); }
    .menu-card .icon { font-size: 1.8rem; margin-bottom: 8px; }
    .menu-card h3 { font-size: 0.9rem; font-weight: 700; color: var(--text); }
    .menu-card p { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }

    @media (max-width: 480px) { 
      .container { padding: 16px 12px; }
      .header h1 { font-size: 1.3rem; }
      .menu-grid { grid-template-columns: 1fr; }
      .menu-card { padding: 14px 10px; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="top-nav">
    <a href="coordenador_menu.html" class="btn-voltar">← Voltar ao Menu</a>
    <span id="labelCoordenador" style="font-size: 0.8rem; color: var(--text-muted);"></span>
  </div>
  <div class="header">
    <span class="badge-topo" id="badgeMinisterioTitulo">CENTRAL DE RELATÓRIOS</span>
    <h1>Relatórios e Documentos</h1>
    <p>Selecione o relatório que deseja gerar ou visualizar</p>
  </div>
  
  <div class="menu-grid">
    <div class="menu-card" onclick="irPara('relatorio_arvore.html')">
      <div class="icon">🌳</div>
      <h3>Árvore Genealógica</h3>
      <p>Organograma hierárquico em PDF</p>
    </div>

    <div class="menu-card disabled">
      <div class="icon">📊</div>
      <h3>Relatório de Batismos</h3>
      <p>Em breve</p>
    </div>

    <div class="menu-card disabled">
      <div class="icon">📈</div>
      <h3>Frequência e Alertas</h3>
      <p>Em breve</p>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const logado = sessionStorage.getItem('topo_coord_logado');
    if (!logado) {
      window.location.href = "index.html";
      return;
    }
    const ministerioAtivo = sessionStorage.getItem('topo_ministerio') || 'TOPO';
    const nomeCoord = sessionStorage.getItem('topo_coord_nome') || 'Coordenador(a)';
    
    document.getElementById('badgeMinisterioTitulo').innerText = `CENTRAL DE RELATÓRIOS - ${ministerioAtivo}`;
    document.getElementById('labelCoordenador').innerText = `${nomeCoord} (${ministerioAtivo})`;
  });

  function irPara(pagina) { window.location.href = pagina; }
</script>
</body>
</html>
