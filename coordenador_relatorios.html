<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Relatórios - Ministério TOPO</title>
  <style>
    :root {
      --bg: #0D0F12;
      --card-bg: #161B22;
      --card-border: #30363D;
      --input-bg: #0D1117;
      --text: #F0F6FC;
      --text-muted: #8B949E;
      --primary: #6E56CF;
      --primary-hover: #5B45B0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px 10px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { max-width: 780px; width: 100%; background: var(--card-bg); padding: 24px; border-radius: 16px; border: 1px solid var(--card-border); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
    .btn-voltar { background: #21262D; color: var(--text); border: 1px solid var(--card-border); padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .btn-voltar:hover { background: #30363D; }
    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 1.5rem; font-weight: 700; margin-top: 4px; }
    .header p { font-size: 0.82rem; color: var(--text-muted); margin-top: 4px; }
    .badge-topo { display: inline-block; background: var(--primary); color: #FFF; padding: 4px 12px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 6px; text-transform: uppercase; }
    
    .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .menu-card { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 18px 12px; text-align: center; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .menu-card:hover { border-color: var(--primary); transform: translateY(-2px); background: rgba(110, 86, 207, 0.05); }
    .menu-card.disabled { opacity: 0.6; cursor: not-allowed; }
    .menu-card.disabled:hover { border-color: var(--card-border); transform: none; background: var(--input-bg); }
    .menu-card .icon { font-size: 1.8rem; margin-bottom: 8px; }
    .menu-card h3 { font-size: 0.9rem; font-weight: 700; color: var(--text); }
    .menu-card p { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }

    /* Indicador de carregamento do PDF */
    .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); display: flex; align-items: center; justify-content: center; z-index: 999; display: none; color: white; font-weight: 600; font-size: 1.1rem; gap: 10px; flex-direction: column; }
    .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) { 
      .container { padding: 16px 12px; }
      .header h1 { font-size: 1.3rem; }
      .menu-grid { grid-template-columns: 1fr; }
      .menu-card { padding: 14px 10px; }
    }
  </style>

  <!-- SDKs do Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <!-- Biblioteca html2pdf -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
<div class="container">
  <div class="top-nav">
    <a href="coordenador_menu.html" class="btn-voltar">← Voltar ao Menu</a>
    <span id="labelCoordenador" style="font-size: 0.8rem; color: var(--text-muted);"></span>
  </div>
  <div class="header">
    <span class="badge-topo" id="badgeMinisterioTitulo">CENTRAL DE RELATÓRIOS</span>
    <h1>Relatórios e Documentos</h1>
    <p>Clique em um relatório para baixar o documento em PDF</p>
  </div>
  
  <div class="menu-grid">
    <!-- Clicou aqui, gera e baixa o PDF direto -->
    <div class="menu-card" onclick="gerarPdfArvore()">
      <div class="icon">🌳</div>
      <h3>Árvore Genealógica</h3>
      <p>Baixar organograma em PDF</p>
    </div>

    <div class="menu-card disabled">
      <div class="icon">📊</div>
      <h3>Relatório de Batismos</h3>
      <p>Em breve</p>
    </div>

    <div class="menu-card disabled">
      <div class="icon">📈</div>
      <h3>Frequência e Alertas</h3>
      <p>Em breve</p>
    </div>
  </div>
</div>

<!-- Tela de Carregamento ao gerar o PDF -->
<div id="loadingPdf" class="loading-overlay">
  <div class="spinner"></div>
  <span>Gerando Árvore Genealógica em PDF...</span>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB7FJXs9wiRFYIs2ugZoWrw7jTXPR5weGk",
    authDomain: "app-redes-iftejipio.firebaseapp.com",
    projectId: "app-redes-iftejipio",
    storageBucket: "app-redes-iftejipio.firebasestorage.app",
    messagingSenderId: "954529090793",
    appId: "1:954529090793:web:6702d102b6e5b178b6b478",
    measurementId: "G-2MJ96WMYQ5"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let ministerioAtivo = 'TOPO';
  let nomeCoord = '';

  document.addEventListener('DOMContentLoaded', () => {
    const logado = sessionStorage.getItem('topo_coord_logado');
    if (!logado) {
      window.location.href = "index.html";
      return;
    }
    ministerioAtivo = sessionStorage.getItem('topo_ministerio') || 'TOPO';
    nomeCoord = sessionStorage.getItem('topo_coord_nome') || 'Coordenador(a)';
    
    document.getElementById('badgeMinisterioTitulo').innerText = `CENTRAL DE RELATÓRIOS - ${ministerioAtivo}`;
    document.getElementById('labelCoordenador').innerText = `${nomeCoord} (${ministerioAtivo})`;
  });

  async function gerarPdfArvore() {
    document.getElementById('loadingPdf').style.display = 'flex';

    try {
      // 1. Buscar membros estritamente do ministério logado
      const snapMembros = await db.collection('membros')
        .where('ministerio', '==', ministerioAtivo)
        .get();

      let membrosMinisterio = [];
      snapMembros.forEach(doc => {
        const d = doc.data();
        if (d.status !== 'INATIVO') membrosMinisterio.push({ id: doc.id, ...d });
      });

      // 2. Buscar perfis de redes estritamente do ministério logado
      const snapPerfis = await db.collection('perfis_redes')
        .where('ministerio', '==', ministerioAtivo)
        .get();

      let perfisRedesMinisterio = [];
      snapPerfis.forEach(doc => {
        const d = doc.data();
        perfisRedesMinisterio.push({ nome: doc.id, ...d });
      });

      // Mapear sexo dos supervisores
      let supervisoresSexoMap = {};
      membrosMinisterio.forEach(m => {
        if (m.categoria && m.categoria.trim() === 'Supervisor' && m.nome && m.sexo) {
          supervisoresSexoMap[m.nome.trim()] = m.sexo.trim();
        }
      });

      // Coordenadores do ministério ativo
      let coordenadoresList = membrosMinisterio.filter(m => m.categoria && m.categoria.trim() === 'Coordenador');
      if (coordenadoresList.length === 0) {
        coordenadoresList = [{ nome: nomeCoord }];
      }

      let coordenadoresHtml = '';
      coordenadoresList.forEach(c => {
        coordenadoresHtml += `
          <div style="background: #F8F9FA; border: 1px solid #333333; border-radius: 3px; padding: 4px 8px; margin-bottom: 4px; font-size: 9.5px; font-weight: bold; color: #111111; display: inline-block; min-width: 160px; text-align: center;">
            Coordenador(a): ${c.nome}
          </div>
        `;
      });

      // Supervisões e Redes filtradas (Layout Compacto)
      let supervisoesHtml = '';
      if (perfisRedesMinisterio.length > 0) {
        const supervisoesMap = {};
        perfisRedesMinisterio.forEach(r => {
          const sup = r.supervisao || 'Geral';
          if (!supervisoesMap[sup]) supervisoesMap[sup] = [];
          supervisoesMap[sup].push(r);
        });

        const listaSupNames = Object.keys(supervisoesMap);

        // Femininas primeiro, depois Masculinas/Outros
        listaSupNames.sort((a, b) => {
          const sexoA = (supervisoresSexoMap[a] || '').toLowerCase();
          const sexoB = (supervisoresSexoMap[b] || '').toLowerCase();
          const orderA = sexoA === 'feminino' ? 0 : (sexoA === 'masculino' ? 1 : 2);
          const orderB = sexoB === 'feminino' ? 0 : (sexoB === 'masculino' ? 1 : 2);
          if (orderA !== orderB) return orderA - orderB;
          return a.localeCompare(b, 'pt-BR');
        });

        listaSupNames.forEach(supName => {
          supervisoesMap[supName].sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
          
          let redesCardsHtml = '';
          supervisoesMap[supName].forEach(r => {
            const membrosRede = membrosMinisterio.filter(m => m.rede === r.nome);
            const liderObj = membrosRede.find(m => m.categoria && m.categoria.trim() === 'Líder');
            const nomeLider = liderObj ? liderObj.nome : (r.lider && r.lider !== 'A definir' ? r.lider : 'A definir');

            redesCardsHtml += `
              <div style="background: #FFFFFF; border: 1px solid #CCCCCC; border-radius: 3px; padding: 4px 6px; width: 32%; margin-bottom: 4px; font-size: 8px;">
                <div style="font-weight: bold; color: #000000; margin-bottom: 2px; border-bottom: 1px solid #EEEEEE; padding-bottom: 1px;">Rede: ${r.nome}</div>
                <div style="color: #333333;">Líder: <strong>${nomeLider}</strong></div>
              </div>
            `;
          });

          supervisoesHtml += `
            <div style="margin-bottom: 6px; border-left: 2px solid #333333; padding-left: 6px; page-break-inside: avoid;">
              <div style="background: #EAEAEA; color: #000000; font-weight: bold; font-size: 9px; padding: 3px 6px; border-radius: 2px; margin-bottom: 4px; text-transform: uppercase;">
                Supervisão: ${supName}
              </div>
              <div style="display: flex; flex-wrap: wrap; gap: 4px;">
                ${redesCardsHtml}
              </div>
            </div>
          `;
        });
      } else {
        supervisoesHtml = `<div style="color: #666666; font-size: 9px; padding: 6px;">Nenhuma supervisão ou rede cadastrada para este ministério.</div>`;
      }

      // Montar elemento temporário altamente compacto para garantir 1 página
      const elemento = document.createElement('div');
      elemento.style.padding = '12px 16px';
      elemento.style.background = '#FFFFFF';
      elemento.style.color = '#111111';
      elemento.style.fontFamily = 'Arial, sans-serif';
      elemento.style.fontSize = '8.5px';
      elemento.style.width = '820px';

      const dataAtual = new Date().toLocaleDateString('pt-BR');

      elemento.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #000000; padding-bottom: 6px; margin-bottom: 10px;">
          <div>
            <h1 style="color: #000000; margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;">Relatório de Estrutura Organizacional</h1>
            <p style="color: #444444; font-size: 8px; margin: 2px 0 0 0;">Igreja da Família - Tejipió | Ministério: <strong>${ministerioAtivo}</strong></p>
          </div>
          <div style="text-align: right; font-size: 8px; color: #555555;">
            Emissão: ${dataAtual}
          </div>
        </div>

        <div style="font-size: 9.5px; font-weight: bold; color: #000000; text-transform: uppercase; margin-bottom: 4px; border-bottom: 1px solid #CCCCCC; padding-bottom: 2px;">
          1. Liderança de Coordenadoria
        </div>
        <div style="margin-bottom: 8px; padding-left: 4px;">
          ${coordenadoresHtml}
        </div>

        <div style="font-size: 9.5px; font-weight: bold; color: #000000; text-transform: uppercase; margin-bottom: 6px; border-bottom: 1px solid #CCCCCC; padding-bottom: 2px;">
          2. Supervisões e Redes Vinculadas
        </div>
        <div>
          ${supervisoesHtml}
        </div>
      `;

      const opt = {
        margin:       6, // margens reduzidas para aproveitar o espaço da página única
        filename:     `arvore_genealogica_${ministerioAtivo.toLowerCase()}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      await html2pdf().from(elemento).set(opt).save();

    } catch (err) {
      console.error("Erro ao gerar PDF:", err);
      alert("Erro ao gerar o relatório em PDF.");
    } finally {
      document.getElementById('loadingPdf').style.display = 'none';
    }
  }
</script>
</body>
</html>
