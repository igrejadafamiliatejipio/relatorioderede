<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Membros - Gestão de Redes</title>
  <style>
    :root {
      --bg: #0D0F12;
      --card-bg: #161B22;
      --card-border: #30363D;
      --input-bg: #0D1117;
      --text: #F0F6FC;
      --text-muted: #8B949E;
      --primary: #6E56CF;
      --primary-hover: #5B45B0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px 12px; display: flex; justify-content: center; min-height: 100vh; }
    .container { max-width: 600px; width: 100%; background: var(--card-bg); padding: 28px; border-radius: 16px; border: 1px solid var(--card-border); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
    
    .top-nav { display: flex; justify-content: space-between; margin-bottom: 20px; }
    .btn-voltar { background: #21262D; color: var(--text); border: 1px solid var(--card-border); padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; text-decoration: none; }
    .btn-voltar:hover { background: #30363D; }

    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 1.6rem; font-weight: 700; margin-top: 6px; }
    .badge-topo { display: inline-block; background: var(--primary); color: #FFF; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; text-transform: uppercase; }

    .info-rede-box { background: var(--input-bg); border: 1px solid var(--card-border); padding: 14px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 0.9rem; color: var(--text-muted); }
    .info-rede-box strong { color: var(--text); }

    .form-group { margin-bottom: 16px; text-align: left; }
    .row { display: flex; gap: 12px; }
    .row .form-group { flex: 1; }

    label { display: block; font-weight: 500; font-size: 0.82rem; margin-bottom: 6px; color: var(--text-muted); text-transform: uppercase; }
    input, select { width: 100%; padding: 12px 14px; background-color: var(--input-bg); border: 1px solid var(--card-border); border-radius: 8px; font-size: 0.95rem; color: var(--text); outline: none; }
    input:focus, select:focus { border-color: var(--primary); }
    select option { background-color: var(--card-bg); color: var(--text); }

    .btn { background-color: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 1rem; width: 100%; margin-top: 10px; transition: 0.2s; }
    .btn:hover { background-color: var(--primary-hover); }

    @media (max-width: 500px) { .row { flex-direction: column; gap: 0; } }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="container">
  <div class="top-nav">
    <a href="lider.html" class="btn-voltar">← Voltar ao Menu</a>
  </div>

  <div class="header">
    <span class="badge-topo" id="badgeMinisterio">Ministério TOPO</span>
    <h1>👤 Cadastro de Membros</h1>
  </div>

  <div class="info-rede-box" id="infoRedeLogada">
    Carregando informações da rede...
  </div>

  <form id="formCadastro">
    <div class="form-group">
      <label>Nome Completo do Membro</label>
      <input type="text" id="inputNome" placeholder="Ex: João da Silva" required>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Data de Nascimento</label>
        <input type="date" id="inputNascimento" required>
      </div>
      <div class="form-group">
        <label>Sexo</label>
        <select id="selectSexo" required>
          <option value="">Selecione...</option>
          <option value="Masculino">Masculino</option>
          <option value="Feminino">Feminino</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>WhatsApp <span style="text-transform: none; color: var(--text-muted);">(Opcional)</span></label>
        <input type="tel" id="inputWhatsapp" placeholder="Ex: 81988887777">
      </div>
      <div class="form-group">
        <label>E-mail de Acesso <span style="text-transform: none; color: var(--text-muted);">(Para futuros líderes)</span></label>
        <input type="email" id="inputEmail" placeholder="exemplo@email.com">
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Já é Batizado(a)?</label>
        <select id="selectBatizado" required>
          <option value="Sim">Sim</option>
          <option value="Não">Não</option>
        </select>
      </div>
      <div class="form-group">
        <label>Categoria na Rede</label>
        <select id="selectCategoria" required>
          <option value="Liderado">Liderado</option>
          <option value="Base da Rede">Base da Rede</option>
          <option value="Líder">Líder</option>
        </select>
      </div>
    </div>

    <button type="submit" class="btn" id="btnSalvar">Salvar Cadastro</button>
  </form>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB7FJXs9wiRFYIs2ugZoWrw7jTXPR5weGk",
    authDomain: "app-redes-iftejipio.firebaseapp.com",
    projectId: "app-redes-iftejipio",
    storageBucket: "app-redes-iftejipio.firebasestorage.app",
    messagingSenderId: "954529090793",
    appId: "1:954529090793:web:6702d102b6e5b178b6b478",
    measurementId: "G-2MJ96WMYQ5"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let dadosSessao = {};
  let ministerioAtivo = 'TOPO';

  document.addEventListener("DOMContentLoaded", () => {
    ministerioAtivo = sessionStorage.getItem('topo_ministerio') || 'TOPO';
    document.getElementById('badgeMinisterio').innerText = `Ministério ${ministerioAtivo}`;

    const supervisao = sessionStorage.getItem('topo_supervisao');
    const rede = sessionStorage.getItem('topo_rede');
    const lider = sessionStorage.getItem('topo_lider');

    if (!rede) {
      alert("Nenhuma rede selecionada. Faça o login novamente.");
      window.location.href = "lider.html";
      return;
    }

    dadosSessao = { supervisao, supervisor: sessionStorage.getItem('topo_supervisor'), rede, lider };
    document.getElementById('infoRedeLogada').innerHTML = `Cadastrando para: <strong>${rede}</strong> (Líder: ${lider})`;
  });

  document.getElementById('formCadastro').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('btnSalvar');
    btn.disabled = true;
    btn.innerText = "Salvando no Firebase...";

    const novoMembro = {
      ministerio: ministerioAtivo, // Salva o ministério ativo (TOPO, ELAS ou ELES)
      dataCadastro: new Date().toISOString(),
      supervisao: dadosSessao.supervisao,
      supervisor: dadosSessao.supervisor,
      rede: dadosSessao.rede,
      lider: dadosSessao.lider,
      nome: document.getElementById('inputNome').value.trim(),
      nascimento: document.getElementById('inputNascimento').value,
      sexo: document.getElementById('selectSexo').value,
      whatsapp: document.getElementById('inputWhatsapp').value.trim(),
      email: document.getElementById('inputEmail').value.trim().toLowerCase(), // Salva o e-mail em minúsculas
      batizado: document.getElementById('selectBatizado').value,
      categoria: document.getElementById('selectCategoria').value,
      status: "ATIVO"
    };

    try {
      await db.collection('membros').add(novoMembro);
      alert("✅ Membro cadastrado com sucesso no Firebase!");
      document.getElementById('formCadastro').reset();
    } catch (err) {
      alert("Erro ao salvar cadastro. Tente novamente.");
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.innerText = "Salvar Cadastro";
    }
  });
</script>

</body>
</html>
