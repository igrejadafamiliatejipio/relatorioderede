<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Membros - TOPO</title>
  <style>
    :root {
      --bg: #0D0F12;
      --card-bg: #161B22;
      --card-border: #30363D;
      --input-bg: #0D1117;
      --text: #F0F6FC;
      --text-muted: #8B949E;
      --primary: #6E56CF;
      --primary-hover: #5B45B0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px 12px; display: flex; justify-content: center; min-height: 100vh; }
    .container { max-width: 600px; width: 100%; background: var(--card-bg); padding: 28px; border-radius: 16px; border: 1px solid var(--card-border); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
    
    .top-nav { display: flex; justify-content: space-between; margin-bottom: 20px; }
    .btn-voltar { background: #21262D; color: var(--text); border: 1px solid var(--card-border); padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; text-decoration: none; }
    .btn-voltar:hover { background: #30363D; }

    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 1.6rem; font-weight: 700; }
    .badge-topo { display: inline-block; background: var(--primary); color: #FFF; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }

    .form-group { margin-bottom: 16px; text-align: left; }
    .row { display: flex; gap: 12px; }
    .row .form-group { flex: 1; }

    label { display: block; font-weight: 500; font-size: 0.82rem; margin-bottom: 6px; color: var(--text-muted); text-transform: uppercase; }
    input, select { width: 100%; padding: 12px 14px; background-color: var(--input-bg); border: 1px solid var(--card-border); border-radius: 8px; font-size: 0.95rem; color: var(--text); outline: none; }
    input:focus, select:focus { border-color: var(--primary); }
    select option { background-color: var(--card-bg); color: var(--text); }

    .btn { background-color: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 1rem; width: 100%; margin-top: 10px; transition: 0.2s; }
    .btn:hover { background-color: var(--primary-hover); }

    @media (max-width: 500px) { .row { flex-direction: column; gap: 0; } }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="container">
  <div class="top-nav">
    <a href="lider.html" class="btn-voltar">← Voltar ao Menu</a>
  </div>

  <div class="header">
    <span class="badge-topo">MINISTÉRIO TOPO</span>
    <h1>👤 Cadastro de Membros</h1>
  </div>

  <form id="formCadastro">
    <div class="row">
      <div class="form-group">
        <label>Supervisão</label>
        <select id="selectSupervisao" required><option value="">Selecione...</option></select>
      </div>
      <div class="form-group">
        <label>Rede</label>
        <select id="selectRede" disabled required><option value="">Selecione a Supervisão</option></select>
      </div>
    </div>

    <div class="form-group">
      <label>Nome Completo do Membro</label>
      <input type="text" id="inputNome" placeholder="Ex: João da Silva" required>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Data de Nascimento</label>
        <input type="date" id="inputNascimento" required>
      </div>
      <div class="form-group">
        <label>WhatsApp (com DDD)</label>
        <input type="tel" id="inputWhatsapp" placeholder="81988887777" required>
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Já é Batizado(a)?</label>
        <select id="selectBatizado" required>
          <option value="Sim">Sim</option>
          <option value="Não">Não</option>
        </select>
      </div>
      <div class="form-group">
        <label>Categoria na Rede</label>
        <select id="selectCategoria" required>
          <option value="Liderado">Liderado</option>
          <option value="Base da Rede">Base da Rede</option>
        </select>
      </div>
    </div>

    <button type="submit" class="btn" id="btnSalvar">Salvar Cadastro</button>
  </form>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB7FJXs9wiRFYIs2ugZoWrw7jTXPR5weGk",
    authDomain: "app-redes-iftejipio.firebaseapp.com",
    projectId: "app-redes-iftejipio",
    storageBucket: "app-redes-iftejipio.firebasestorage.app",
    messagingSenderId: "954529090793",
    appId: "1:954529090793:web:6702d102b6e5b178b6b478",
    measurementId: "G-2MJ96WMYQ5"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const supervisoresDB = [
    { supervisao: "Supervisão Monte Hor", supervisor: "Luís Felipe", redes: [{ nome: "Rede Moisés", lider: "Gabriel" }, { nome: "Rede Alfa", lider: "Plinio" }, { nome: "Rede Timóteo", lider: "Sotero" }, { nome: "Rede Next", lider: "Vyni Léo" }, { nome: "Rede Inconformados", lider: "Maurilio" }, { nome: "Rede Atalaia", lider: "Mancine" }] },
    { supervisao: "Supervisão Monte Tabor", supervisor: "Danylo Brissantt", redes: [{ nome: "Hazak", lider: "Vitinho" }, { nome: "Monte Pisga", lider: "Ezequiel" }, { nome: "Escolhidos", lider: "João" }, { nome: "Paroikos", lider: "Iago" }, { nome: "Atos", lider: "Arley" }, { nome: "Karygma", lider: "Richard" }] },
    { supervisao: "Supervisão Monte Nebo", supervisor: "Emanuel Henrique", redes: [{ nome: "Rede Invictos", lider: "Éden" }, { nome: "Rede Ekballo", lider: "Cristian" }, { nome: "Rede Ousadia", lider: "Wallyson" }, { nome: "Rede Maranata", lider: "Richarlyson" }, { nome: "Rede Ruah", lider: "Vinícius" }] },
    { supervisao: "Supervisão Monte Horebe", supervisor: "Andryo Henrique", redes: [{ nome: "Rede Aljava", lider: "Taycilio" }, { nome: "Rede Sal da Terra", lider: "Marcelo Flexa" }, { nome: "Rede Ekklesia", lider: "Rodrigo" }, { nome: "Rede Forjados", lider: "Alef" }] },
    { supervisao: "Supervisão Monte Carmelo", supervisor: "Diana Guerra", redes: [{ nome: "Rede Flame", lider: "Cecília" }, { nome: "Rede Aurora", lider: "Ester" }, { nome: "Rede Colossenses", lider: "Ingrid" }, { nome: "Rede Perazim", lider: "Íris" }, { nome: "Rede Rise", lider: "Gabriela" }] },
    { supervisao: "Supervisão Monte Moriá", supervisor: "Larissa Neves", redes: [{ nome: "Rede Peregrina", lider: "Saiwry" }, { nome: "Rede Lume", lider: "Myrella" }, { nome: "Rede Promessa", lider: "Júlia" }, { nome: "Rede Áquila", lider: "Thaynara" }, { nome: "Rede Carmesim", lider: "Lívia" }, { nome: "Rede Emunah", lider: "Mayara" }, { nome: "Rede Margaridas", lider: "Lara" }] },
    { supervisao: "Supervisão Monte Sinai", supervisor: "Sara Gomes", redes: [{ nome: "Rede Jardim", lider: "Joana" }, { nome: "Rede Dunamis", lider: "Mikaele" }, { nome: "Rede Grace", lider: "Fernanda" }, { nome: "Rede Graciosa", lider: "Gleicy" }, { nome: "Rede Zoe", lider: "Karol" }, { nome: "Rede Lamparinas", lider: "Laura Ester" }] },
    { supervisao: "Supervisão Monte Sião", supervisor: "Clara Dione", redes: [{ nome: "Rede Águias", lider: "Anny" }, { nome: "Rede Hope", lider: "Laysa" }, { nome: "Rede Bloom", lider: "Clara" }, { nome: "Rede Herdeiras", lider: "Mika" }] },
    { supervisao: "Supervisão Monte das Oliveiras", supervisor: "Letícia Sampaio", redes: [{ nome: "Monte das Oliveiras", lider: "Letícia Sampaio" }, { nome: "Rede Lily", lider: "Dayanne Lethicia" }, { nome: "Rede Liz", lider: "Letícia Rodrigues" }, { nome: "Rede Âmbar", lider: "Gabriella A." }] },
    { supervisao: "Supervisão Monte Seir", supervisor: "Karol Nogueira", redes: [{ nome: "Rede Joy", lider: "Leticia" }, { nome: "Rede Legacy", lider: "Laura" }, { nome: "Rede Ramá", lider: "Raianny" }] }
  ];

  document.addEventListener("DOMContentLoaded", () => {
    const selSup = document.getElementById('selectSupervisao');
    supervisoresDB.forEach((item, index) => {
      const opt = document.createElement('option');
      opt.value = index;
      opt.textContent = `${item.supervisao} (${item.supervisor})`;
      selSup.appendChild(opt);
    });

    selSup.addEventListener('change', atualizarRedes);
  });

  function atualizarRedes() {
    const indexSup = document.getElementById('selectSupervisao').value;
    const selRede = document.getElementById('selectRede');
    selRede.innerHTML = '';

    if (indexSup === "") {
      selRede.disabled = true;
      selRede.innerHTML = '<option value="">Selecione a Supervisão</option>';
      return;
    }

    selRede.disabled = false;
    selRede.innerHTML = '<option value="">Selecione a Rede</option>';
    supervisoresDB[indexSup].redes.forEach((r, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = `${r.nome} (Líder: ${r.lider})`;
      selRede.appendChild(opt);
    });
  }

  document.getElementById('formCadastro').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('btnSalvar');
    btn.disabled = true;
    btn.innerText = "Salvando no Firebase...";

    const indexSup = document.getElementById('selectSupervisao').value;
    const indexRede = document.getElementById('selectRede').value;

    const supObj = supervisoresDB[indexSup];
    const redeObj = supObj.redes[indexRede];

    const novoMembro = {
      dataCadastro: new Date().toISOString(),
      supervisao: supObj.supervisao,
      supervisor: supObj.supervisor,
      rede: redeObj.nome,
      lider: redeObj.lider,
      nome: document.getElementById('inputNome').value.trim(),
      nascimento: document.getElementById('inputNascimento').value,
      whatsapp: document.getElementById('inputWhatsapp').value.trim(),
      batizado: document.getElementById('selectBatizado').value,
      categoria: document.getElementById('selectCategoria').value,
      status: "ATIVO"
    };

    try {
      await db.collection('membros').add(novoMembro);
      alert("✅ Membro cadastrado com sucesso no Firebase!");
      document.getElementById('formCadastro').reset();
      document.getElementById('selectRede').disabled = true;
    } catch (err) {
      alert("Erro ao salvar cadastro. Tente novamente.");
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.innerText = "Salvar Cadastro";
    }
  });
</script>

</body>
</html>
