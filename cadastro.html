<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Membros - TOPO</title>
  <style>
    :root {
      --bg: #0D0F12;
      --card-bg: #161B22;
      --card-border: #30363D;
      --input-bg: #0D1117;
      --text: #F0F6FC;
      --text-muted: #8B949E;
      --primary: #6E56CF;
      --primary-hover: #5B45B0;
      --success: #23D160;
      --success-hover: #1EBE55;
      --danger: #E5534B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px 12px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      max-width: 650px;
      width: 100%;
      background: var(--card-bg);
      padding: 28px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 6px;
    }

    .badge-topo {
      display: inline-block;
      background: var(--primary);
      color: #FFF;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .section {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 14px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-weight: 500;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"],
    input[type="date"],
    input[type="tel"],
    select {
      width: 100%;
      padding: 12px 14px;
      background-color: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      transition: all 0.2s ease;
    }

    input::placeholder {
      color: #484F58;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(110, 86, 207, 0.25);
    }

    select option {
      background-color: var(--card-bg);
      color: var(--text);
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row .form-group {
      flex: 1;
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-success {
      background-color: var(--success);
      color: #000;
      font-weight: 700;
    }
    .btn-success:hover {
      background-color: var(--success-hover);
    }

    .btn-secondary {
      background-color: #21262D;
      color: var(--text);
      border: 1px solid var(--card-border);
    }
    .btn-secondary:hover {
      background-color: #30363D;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .actions .btn {
      flex: 1;
    }

    /* Lista temporária de cadastrados na sessão */
    .cadastrados-box {
      margin-top: 24px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
    }

    .membro-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .badge-status {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    .badge-base {
      background: rgba(110, 86, 207, 0.2);
      color: #A58BFF;
      border: 1px solid rgba(110, 86, 207, 0.4);
    }

    .badge-liderado {
      background: rgba(139, 148, 158, 0.2);
      color: var(--text-muted);
      border: 1px solid rgba(139, 148, 158, 0.3);
    }

    @media (max-width: 500px) {
      .row, .actions {
        flex-direction: column;
        gap: 8px;
      }
      .container {
        padding: 20px 16px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <span class="badge-topo">MINISTÉRIO TOPO</span>
    <h1>👤 Cadastro de Membros</h1>
    <p>Selecione a rede e cadastre os participantes</p>
  </div>

  <form id="formCadastro" onsubmit="event.preventDefault();">
    <!-- 1. Seleção Fixa da Rede -->
    <div class="section">
      <div class="section-title">📌 Seleção da Rede</div>
      
      <div class="row">
        <div class="form-group">
          <label for="selectSupervisao">Supervisão</label>
          <select id="selectSupervisao">
            <option value="">Selecione a Supervisão</option>
          </select>
        </div>

        <div class="form-group">
          <label for="selectRede">Rede</label>
          <select id="selectRede" disabled>
            <option value="">Selecione primeiro a Supervisão</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="liderRede">Líder responsável</label>
        <input type="text" id="liderRede" placeholder="Identificado automaticamente" readonly style="opacity: 0.7;">
      </div>
    </div>

    <!-- 2. Dados do Membro -->
    <div class="section" id="blocoMembro">
      <div class="section-title">👤 Dados do Participante</div>

      <div class="form-group">
        <label for="nomeCompleto">Nome Completo *</label>
        <input type="text" id="nomeCompleto" placeholder="Ex: João da Silva">
      </div>

      <div class="row">
        <div class="form-group">
          <label for="dataNascimento">Data de Nascimento</label>
          <input type="date" id="dataNascimento">
        </div>

        <div class="form-group">
          <label for="whatsapp">WhatsApp</label>
          <input type="tel" id="whatsapp" placeholder="(81) 99999-9999">
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="batizado">Já é batizado?</label>
          <select id="batizado">
            <option value="Não">Não</option>
            <option value="Sim">Sim</option>
          </select>
        </div>

        <div class="form-group">
          <label for="encontroDeus">Já foi ao Encontro com Deus?</label>
          <select id="encontroDeus">
            <option value="Não">Não (Liderado)</option>
            <option value="Sim">Sim (Base da Rede)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Botões de Ação -->
    <div class="actions">
      <button type="button" id="btnSalvarEOutro" class="btn btn-secondary">➕ Cadastrar e Adicionar Outro</button>
      <button type="button" id="btnFinalizar" class="btn btn-success">✅ Finalizar Cadastros</button>
    </div>
  </form>

  <!-- Lista da Sessão Atual -->
  <div class="cadastrados-box" id="caixaSessao" style="display: none;">
    <div class="section-title">📋 Cadastrados nesta sessão (<span id="qtdSessao">0</span>)</div>
    <div id="listaSessao"></div>
  </div>
</div>

<script>
  // Mapeamento Oficial das Supervisões e Redes
  const dadosTopo = [
    {
      supervisao: "Supervisão Monte Hor",
      supervisor: "Luís Felipe",
      redes: [
        { nome: "Rede Moisés", lider: "Gabriel" },
        { nome: "Rede Alfa", lider: "Plinio" },
        { nome: "Rede Timóteo", lider: "Sotero" },
        { nome: "Rede Next", lider: "Vyni Léo" },
        { nome: "Rede Inconformados", lider: "Maurilio" },
        { nome: "Rede Atalaia", lider: "Mancine" }
      ]
    },
    {
      supervisao: "Supervisão Monte Tabor",
      supervisor: "Danylo Brissantt",
      redes: [
        { nome: "Hazak", lider: "Vitinho" },
        { nome: "Monte Pisga", lider: "Ezequiel" },
        { nome: "Escolhidos", lider: "João" },
        { nome: "Paroikos", lider: "Iago" },
        { nome: "Atos", lider: "Arley" },
        { nome: "Karygma", lider: "Richard" }
      ]
    },
    {
      supervisao: "Supervisão Monte Nebo",
      supervisor: "Emanuel Henrique",
      redes: [
        { nome: "Rede Invictos", lider: "Éden" },
        { nome: "Rede Ekballo", lider: "Cristian" },
        { nome: "Rede Ousadia", lider: "Wallyson" },
        { nome: "Rede Maranata", lider: "Richarlyson" },
        { nome: "Rede Ruah", lider: "Vinícius" }
      ]
    },
    {
      supervisao: "Supervisão Monte Horebe",
      supervisor: "Andryo Henrique",
      redes: [
        { nome: "Rede Aljava", lider: "Taycilio" },
        { nome: "Rede Sal da Terra", lider: "Marcelo Flexa" },
        { nome: "Rede Ekklesia", lider: "Rodrigo" },
        { nome: "Rede Forjados", lider: "Alef" }
      ]
    },
    {
      supervisao: "Supervisão Monte Carmelo",
      supervisor: "Diana Guerra",
      redes: [
        { nome: "Rede Flame", lider: "Cecília" },
        { nome: "Rede Aurora", lider: "Ester" },
        { nome: "Rede Colossenses", lider: "Ingrid" },
        { nome: "Rede Perazim", lider: "Íris" },
        { nome: "Rede Rise", lider: "Gabriela" }
      ]
    },
    {
      supervisao: "Supervisão Monte Moriá",
      supervisor: "Larissa Neves",
      redes: [
        { nome: "Rede Peregrina", lider: "Saiwry" },
        { nome: "Rede Lume", lider: "Myrella" },
        { nome: "Rede Promessa", lider: "Júlia" },
        { nome: "Rede Áquila", lider: "Thaynara" },
        { nome: "Rede Carmesim", lider: "Lívia" },
        { nome: "Rede Emunah", lider: "Mayara" },
        { nome: "Rede Margaridas", lider: "Lara" }
      ]
    },
    {
      supervisao: "Supervisão Monte Sinai",
      supervisor: "Sara Gomes",
      redes: [
        { nome: "Rede Jardim", lider: "Joana" },
        { nome: "Rede Dunamis", lider: "Mikaele" },
        { nome: "Rede Grace", lider: "Fernanda" },
        { nome: "Rede Graciosa", lider: "Gleicy" },
        { nome: "Rede Zoe", lider: "Karol" },
        { nome: "Rede Lamparinas", lider: "Laura Ester" }
      ]
    },
    {
      supervisao: "Supervisão Monte Sião",
      supervisor: "Clara Dione",
      redes: [
        { nome: "Rede Águias", lider: "Anny" },
        { nome: "Rede Hope", lider: "Laysa" },
        { nome: "Rede Bloom", lider: "Clara" },
        { nome: "Rede Herdeiras", lider: "Mika" }
      ]
    },
    {
      supervisao: "Supervisão Monte das Oliveiras",
      supervisor: "Letícia Sampaio",
      redes: [
        { nome: "Monte das Oliveiras", lider: "Letícia Sampaio" },
        { nome: "Rede Lily", lider: "Dayanne Lethicia" },
        { nome: "Rede Liz", lider: "Letícia Rodrigues" },
        { nome: "Rede Âmbar", lider: "Gabriella A." }
      ]
    },
    {
      supervisao: "Supervisão Monte Seir",
      supervisor: "Karol Nogueira",
      redes: [
        { nome: "Rede Joy", lider: "Leticia" },
        { nome: "Rede Legacy", lider: "Laura" },
        { nome: "Rede Ramá", lider: "Raianny" }
      ]
    }
  ];

  let cadastradosSessao = [];

  document.addEventListener("DOMContentLoaded", function() {
    carregarSupervisoes();

    document.getElementById('selectSupervisao').addEventListener('change', atualizarRedes);
    document.getElementById('selectRede').addEventListener('change', atualizarLider);

    document.getElementById('btnSalvarEOutro').addEventListener('click', () => processarCadastro(false));
    document.getElementById('btnFinalizar').addEventListener('click', () => processarCadastro(true));
  });

  function carregarSupervisoes() {
    const selectSup = document.getElementById('selectSupervisao');
    dadosTopo.forEach((item, index) => {
      const opt = document.createElement('option');
      opt.value = index;
      opt.textContent = `${item.supervisao} (${item.supervisor})`;
      selectSup.appendChild(opt);
    });
  }

  function atualizarRedes() {
    const indexSup = document.getElementById('selectSupervisao').value;
    const selectRede = document.getElementById('selectRede');
    const inputLider = document.getElementById('liderRede');

    selectRede.innerHTML = '';
    inputLider.value = '';

    if (indexSup === "") {
      selectRede.disabled = true;
      selectRede.innerHTML = '<option value="">Selecione primeiro a Supervisão</option>';
      return;
    }

    const supSelecionada = dadosTopo[indexSup];
    selectRede.disabled = false;
    selectRede.innerHTML = '<option value="">Selecione a Rede</option>';

    supSelecionada.redes.forEach((rede, index) => {
      const opt = document.createElement('option');
      opt.value = index;
      opt.textContent = `${rede.nome} (Líder: ${rede.lider})`;
      selectRede.appendChild(opt);
    });
  }

  function atualizarLider() {
    const indexSup = document.getElementById('selectSupervisao').value;
    const indexRede = document.getElementById('selectRede').value;
    const inputLider = document.getElementById('liderRede');

    if (indexSup !== "" && indexRede !== "") {
      const lider = dadosTopo[indexSup].redes[indexRede].lider;
      inputLider.value = lider;
    } else {
      inputLider.value = '';
    }
  }

  function processarCadastro(isFinalizar) {
    const indexSup = document.getElementById('selectSupervisao').value;
    const indexRede = document.getElementById('selectRede').value;
    const nome = document.getElementById('nomeCompleto').value.trim();

    if (indexSup === "" || indexRede === "") {
      alert("Por favor, selecione a Supervisão e a Rede primeiro!");
      return;
    }

    if (!nome) {
      alert("O nome completo da pessoa é obrigatório!");
      document.getElementById('nomeCompleto').focus();
      return;
    }

    const supObj = dadosTopo[indexSup];
    const redeObj = supObj.redes[indexRede];
    const nascimento = document.getElementById('dataNascimento').value;
    const whatsapp = document.getElementById('whatsapp').value.trim();
    const batizado = document.getElementById('batizado').value;
    const encontroDeus = document.getElementById('encontroDeus').value;
    
    // Define a categoria
    const categoria = (encontroDeus === "Sim") ? "Base da Rede" : "Liderado";

    const novoMembro = {
      supervisao: supObj.supervisao,
      supervisor: supObj.supervisor,
      rede: redeObj.nome,
      lider: redeObj.lider,
      nome: nome,
      nascimento: nascimento,
      whatsapp: whatsapp,
      batizado: batizado,
      encontroDeus: encontroDeus,
      categoria: categoria
    };

    // Salva o membro na sessão atual
    cadastradosSessao.push(novoMembro);
    atualizarListaSessao();

    // Aqui faremos a chamada para salvar na Planilha Google no futuro!
    console.log("Membro Cadastrado:", novoMembro);

    if (isFinalizar) {
      alert(`✅ Cadastro finalizado com sucesso! ${cadastradosSessao.length} membro(s) cadastrado(s) na ${redeObj.nome}.`);
      limparCamposMembro();
      // Bloqueia ou reseta se desejar
    } else {
      limparCamposMembro();
      alert(`✔️ ${nome} cadastrado(a)! Pode preencher o próximo.`);
      document.getElementById('nomeCompleto').focus();
    }
  }

  function limparCamposMembro() {
    document.getElementById('nomeCompleto').value = '';
    document.getElementById('dataNascimento').value = '';
    document.getElementById('whatsapp').value = '';
    document.getElementById('batizado').value = 'Não';
    document.getElementById('encontroDeus').value = 'Não';
  }

  function atualizarListaSessao() {
    const caixa = document.getElementById('caixaSessao');
    const lista = document.getElementById('listaSessao');
    const qtd = document.getElementById('qtdSessao');

    caixa.style.display = 'block';
    qtd.innerText = cadastradosSessao.length;
    lista.innerHTML = '';

    cadastradosSessao.forEach((m, idx) => {
      const div = document.createElement('div');
      div.className = 'membro-item';
      const isBase = m.categoria === "Base da Rede";
      div.innerHTML = `
        <div>
          <strong>${idx + 1}. ${m.nome}</strong><br>
          <small style="color: var(--text-muted);">${m.whatsapp || 'Sem WhatsApp'}</small>
        </div>
        <span class="badge-status ${isBase ? 'badge-base' : 'badge-liderado'}">${m.categoria}</span>
      `;
      lista.appendChild(div);
    });
  }
</script>

</body>
</html>
