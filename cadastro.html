<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Membros - TOPO</title>
  <style>
    :root {
      --bg: #0D0F12;
      --card-bg: #161B22;
      --card-border: #30363D;
      --input-bg: #0D1117;
      --text: #F0F6FC;
      --text-muted: #8B949E;
      --primary: #6E56CF;
      --primary-hover: #5B45B0;
      --success: #23D160;
      --success-hover: #1EBE55;
      --danger: #E5534B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px 12px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      max-width: 650px;
      width: 100%;
      background: var(--card-bg);
      padding: 28px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .btn-voltar {
      background: #21262D;
      color: var(--text);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s ease;
    }
    .btn-voltar:hover {
      background: #30363D;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 6px;
    }

    .badge-topo {
      display: inline-block;
      background: var(--primary);
      color: #FFF;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .section {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 14px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-weight: 500;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"],
    input[type="date"],
    input[type="tel"],
    select {
      width: 100%;
      padding: 12px 14px;
      background-color: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      transition: all 0.2s ease;
    }

    input::placeholder {
      color: #484F58;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(110, 86, 207, 0.25);
    }

    select option {
      background-color: var(--card-bg);
      color: var(--text);
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row .form-group {
      flex: 1;
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-success {
      background-color: var(--success);
      color: #000;
      font-weight: 700;
    }
    .btn-success:hover {
      background-color: var(--success-hover);
    }

    .btn-secondary {
      background-color: #21262D;
      color: var(--text);
      border: 1px solid var(--card-border);
    }
    .btn-secondary:hover {
      background-color: #30363D;
    }

      display: flex;
