<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador Dinâmico de Perfis - Gestão de Redes</title>
  <style>
    :root {
      --bg: #0D0F12;
      --card-bg: #161B22;
      --card-border: #30363D;
      --input-bg: #0D1117;
      --text: #F0F6FC;
      --text-muted: #8B949E;
      --primary: #6E56CF;
      --primary-hover: #5B45B0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px 12px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { max-width: 520px; width: 100%; background: var(--card-bg); padding: 32px; border-radius: 16px; border: 1px solid var(--card-border); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
    
    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 1.5rem; font-weight: 700; margin-top: 6px; }
    .badge-topo { display: inline-block; background: var(--primary); color: #FFF; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; text-transform: uppercase; }

    .form-group { margin-bottom: 16px; text-align: left; }
    label { display: block; font-weight: 500; font-size: 0.82rem; margin-bottom: 6px; color: var(--text-muted); text-transform: uppercase; }
    select { width: 100%; padding: 12px 14px; background-color: var(--input-bg); border: 1px solid var(--card-border); border-radius: 8px; font-size: 0.95rem; color: var(--text); outline: none; }
    select:focus { border-color: var(--primary); }
    select option { background-color: var(--card-bg); color: var(--text); }

    .btn { background-color: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 1rem; width: 100%; margin-top: 10px; transition: 0.2s; }
    .btn:hover { background-color: var(--primary-hover); }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="container">
  <div class="header">
    <span class="badge-topo">MODO DE TESTE / SIMULADOR</span>
    <h1>🧭 Simulador Dinâmico</h1>
    <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 6px;">Selecione o perfil real diretamente do banco de dados.</p>
  </div>

  <form onsubmit="entrarComo(event)">
    <div class="form-group">
      <label>1. Ministério</label>
      <select id="selectMinisterio" onchange="atualizarOpcoes()" required>
        <option value="TOPO">Ministério TOPO</option>
        <option value="ELAS">Ministério Elas</option>
        <option value="ELES">Ministério Eles</option>
      </select>
    </div>

    <div class="form-group">
      <label>2. Tipo de Perfil</label>
      <select id="selectPerfil" onchange="atualizarOpcoes()" required>
        <option value="">Selecione...</option>
        <option value="Coordenador">Coordenador (Acesso Total)</option>
        <option value="Supervisor">Supervisor(a)</option>
        <option value="Lider">Líder de Rede</option>
      </select>
    </div>

    <div class="form-group" id="grupoEntidade" style="display: none;">
      <label id="labelEntidade">3. Selecione a Pessoa</label>
      <select id="selectEntidade">
        <option value="">Primeiro selecione o perfil...</option>
      </select>
    </div>

    <button type="submit" class="btn" id="btnEntrar">Acessar Sistema</button>
  </form>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB7FJXs9wiRFYIs2ugZoWrw7jTXPR5weGk",
    authDomain: "app-redes-iftejipio.firebaseapp.com",
    projectId: "app-redes-iftejipio",
    storageBucket: "app-redes-iftejipio.firebasestorage.app",
    messagingSenderId: "954529090793",
    appId: "1:954529090793:web:6702d102b6e5b178b6b478",
    measurementId: "G-2MJ96WMYQ5"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let dadosMembros = [];

  document.addEventListener("DOMContentLoaded", async () => {
    try {
      const snapshot = await db.collection('membros').get();
      dadosMembros = [];
      snapshot.forEach(doc => {
        const d = doc.data();
        if (d.status !== 'INATIVO') {
          dadosMembros.push({ id: doc.id, ...d });
        }
      });
    } catch (err) {
      console.error("Erro ao carregar dados do Firebase:", err);
      alert("Erro ao carregar dados do banco.");
    }
  });

  function atualizarOpcoes() {
    const ministerio = document.getElementById('selectMinisterio').value;
    const perfil = document.getElementById('selectPerfil').value;
    const grupoEntidade = document.getElementById('grupoEntidade');
    const selectEntidade = document.getElementById('selectEntidade');
    const labelEntidade = document.getElementById('labelEntidade');

    if (perfil === 'Coordenador' || !perfil) {
      grupoEntidade.style.display = 'none';
      selectEntidade.required = false;
      return;
    }

    grupoEntidade.style.display = 'block';
    selectEntidade.required = true;
    selectEntidade.innerHTML = '<option value="">Carregando...</option>';

    let filtrados = [];

    if (perfil === 'Supervisor') {
      labelEntidade.innerText = '3. Selecione o(a) Supervisor(a)';
      filtrados = dadosMembros.filter(m => {
        const min = m.ministerio || 'TOPO';
        const cat = m.categoria ? m.categoria.trim() : '';
        return min === ministerio && cat === 'Supervisor';
      });
    } else if (perfil === 'Lider') {
      labelEntidade.innerText = '3. Selecione o(a) Líder e sua Rede';
      filtrados = dadosMembros.filter(m => {
        const min = m.ministerio || 'TOPO';
        const cat = m.categoria ? m.categoria.trim() : '';
        return min === ministerio && (cat === 'Líder' || cat === 'Lider');
      });
    }

    if (filtrados.length === 0) {
      selectEntidade.innerHTML = '<option value="">Nenhum registro encontrado para este filtro</option>';
      return;
    }

    selectEntidade.innerHTML = '<option value="">Selecione...</option>';
    filtrados.sort((a, b) => (a.nome || '').localeCompare(b.nome || '')).forEach(m => {
      const opt = document.createElement('option');
      opt.value = JSON.stringify({ nome: m.nome, rede: m.rede, supervisao: m.supervisao });
      opt.textContent = perfil === 'Lider' ? `${m.nome} (Rede: ${m.rede || 'Geral'})` : m.nome;
      selectEntidade.appendChild(opt);
    });
  }

  function entrarComo(e) {
    e.preventDefault();
    const ministerio = document.getElementById('selectMinisterio').value;
    const perfil = document.getElementById('selectPerfil').value;

    sessionStorage.clear();
    sessionStorage.setItem('topo_ministerio', ministerio);

    if (perfil === 'Coordenador') {
      sessionStorage.setItem('topo_coord_logado', 'true');
      sessionStorage.setItem('topo_coord_nome', 'Administrador Master');
      window.location.href = 'coordenador_menu.html';
    } 
    else if (perfil === 'Supervisor') {
      const dadosStr = document.getElementById('selectEntidade').value;
      if (!dadosStr) return alert("Por favor, selecione um supervisor na lista.");
      const dados = JSON.parse(dadosStr);

      sessionStorage.setItem('topo_sup_nome', dados.nome);
      sessionStorage.setItem('topo_sup_responsavel', 'Supervisor(a) do Ministério');
      window.location.href = 'supervisor_menu.html';
    } 
    else if (perfil === 'Lider') {
      const dadosStr = document.getElementById('selectEntidade').value;
      if (!dadosStr) return alert("Por favor, selecione um líder na lista.");
      const dados = JSON.parse(dadosStr);

      sessionStorage.setItem('topo_rede', dados.rede || 'Rede Geral');
      sessionStorage.setItem('topo_supervisao', dados.supervisao || 'Supervisão Geral');
      sessionStorage.setItem('topo_lider', dados.nome);
      window.location.href = 'lider.html'; // <--- CORRIGIDO AQUI PARA LEVAR AO MENU DO LÍDER
    }
  }
</script>

</body>
</html>
