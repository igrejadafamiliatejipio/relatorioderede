<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selecionar Rede - Supervisor - Ministério TOPO</title>
  <style>
    :root {
      --bg: #0D0F12; --card-bg: #161B22; --card-border: #30363D;
      --input-bg: #0D1117; --text: #F0F6FC; --text-muted: #8B949E;
      --primary: #6E56CF; --primary-hover: #5B45B0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px 12px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { max-width: 480px; width: 100%; background: var(--card-bg); padding: 32px; border-radius: 16px; border: 1px solid var(--card-border); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); text-align: center; }
    .btn-voltar { background: #21262D; color: var(--text); border: 1px solid var(--card-border); padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 20px; float: left; }
    .btn-voltar:hover { background: #30363D; }
    .header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; }
    .header p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 24px; }
    .badge-topo { display: inline-block; background: var(--primary); color: #FFF; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 12px; }
    .form-group { margin-bottom: 16px; text-align: left; }
    label { display: block; font-weight: 500; font-size: 0.82rem; margin-bottom: 6px; color: var(--text-muted); text-transform: uppercase; }
    select { width: 100%; padding: 12px 14px; background-color: var(--input-bg); border: 1px solid var(--card-border); border-radius: 8px; font-size: 0.95rem; color: var(--text); outline: none; }
    select option { background-color: var(--card-bg); color: var(--text); }
    .btn { background-color: var(--primary); color: white; border: none; padding: 12px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.95rem; width: 100%; transition: 0.2s; margin-top: 8px; }
    .btn:hover { background-color: var(--primary-hover); }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="container">
  <a href="supervisor_menu.html" class="btn-voltar">← Voltar ao Menu</a>
  <div style="clear: both;"></div>
  <div class="header">
    <span class="badge-topo">PAINEL DE REDE</span>
    <h1>Selecione a Rede</h1>
    <p>Escolha qual rede da sua supervisão deseja visualizar</p>
  </div>
  <div class="form-group">
    <label for="selectRede">Rede</label>
    <select id="selectRede">
      <option value="">Carregando redes...</option>
    </select>
  </div>
  <button class="btn" onclick="acessarPainelRede()">Acessar Painel da Rede</button>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB7FJXs9wiRFYIs2ugZoWrw7jTXPR5weGk",
    authDomain: "app-redes-iftejipio.firebaseapp.com",
    projectId: "app-redes-iftejipio",
    storageBucket: "app-redes-iftejipio.firebasestorage.app",
    messagingSenderId: "954529090793",
    appId: "1:954529090793:web:6702d102b6e5b178b6b478",
    measurementId: "G-2MJ96WMYQ5"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  document.addEventListener('DOMContentLoaded', async () => {
    const supervisao = sessionStorage.getItem('topo_sup_nome');
    if (!supervisao) {
      alert("Sessão expirada. Faça login novamente.");
      window.location.href = "index.html"; // CORRIGIDO: Redireciona para o login unificado
      return;
    }

    const select = document.getElementById('selectRede');
    select.innerHTML = '<option value="">Carregando redes...</option>';

    try {
      const snapshot = await db.collection('perfis_redes')
        .where('supervisao', '==', supervisao)
        .get();

      select.innerHTML = '';

      if (snapshot.empty) {
        select.innerHTML = '<option value="">Nenhuma rede encontrada para sua supervisão</option>';
        return;
      }

      select.innerHTML = '<option value="">Selecione uma rede</option>';
      snapshot.forEach(doc => {
        const redeNome = doc.id; // O ID do documento é o nome da rede
        const opt = document.createElement('option');
        opt.value = redeNome;
        opt.textContent = redeNome;
        select.appendChild(opt);
      });

    } catch (err) {
      console.error("Erro ao carregar redes:", err);
      select.innerHTML = '<option value="">Erro ao carregar redes</option>';
    }
  });

  function acessarPainelRede() {
    const redeSelecionada = document.getElementById('selectRede').value;
    if (!redeSelecionada) return alert("Selecione uma rede.");

    sessionStorage.setItem('topo_supervisao', sessionStorage.getItem('topo_sup_nome'));
    sessionStorage.setItem('topo_rede', redeSelecionada);
    sessionStorage.setItem('topo_lider', sessionStorage.getItem('topo_sup_responsavel') + ' (Supervisor)');

    window.location.href = "painel.html";
  }
</script>
</body>
</html>
