<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso do Líder - Ministério TOPO</title>
  <style>
    :root {
      --bg: #0D0F12;
      --card-bg: #161B22;
      --card-border: #30363D;
      --input-bg: #0D1117;
      --text: #F0F6FC;
      --text-muted: #8B949E;
      --primary: #6E56CF;
      --primary-hover: #5B45B0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px 12px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { max-width: 440px; width: 100%; background: var(--card-bg); padding: 32px; border-radius: 16px; border: 1px solid var(--card-border); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); text-align: center; }
    
    .top-nav { display: flex; justify-content: flex-start; margin-bottom: 16px; }
    .btn-voltar { background: #21262D; color: var(--text); border: 1px solid var(--card-border); padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; text-decoration: none; }
    .btn-voltar:hover { background: #30363D; }

    .header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; }
    .header p { color: var(--text-muted); font-size: 0.88rem; margin-bottom: 24px; }
    .badge-topo { display: inline-block; background: var(--primary); color: #FFF; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 12px; }

    .form-group { margin-bottom: 16px; text-align: left; }
    label { display: block; font-weight: 500; font-size: 0.82rem; margin-bottom: 6px; color: var(--text-muted); text-transform: uppercase; }
    select, input { width: 100%; padding: 12px 14px; background-color: var(--input-bg); border: 1px solid var(--card-border); border-radius: 8px; font-size: 0.95rem; color: var(--text); outline: none; }
    select option { background-color: var(--card-bg); color: var(--text); }

    .btn { background-color: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 1rem; width: 100%; margin-top: 10px; transition: 0.2s; }
    .btn:hover { background-color: var(--primary-hover); }

    /* Menu de Ações após o login */
    #menuLider { display: none; }
    .menu-grid { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
    .menu-btn { background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text); padding: 16px; border-radius: 10px; text-decoration: none; font-weight: 600; display: flex; align-items: center; justify-content: space-between; transition: 0.2s; }
    .menu-btn:hover { border-color: var(--primary); background: rgba(110, 86, 207, 0.1); }
  </style>
</head>
<body>

<div class="container">
  <div class="top-nav">
    <a href="index.html" class="btn-voltar">← Voltar ao Início</a>
  </div>

  <!-- TELA DE LOGIN DO LÍDER -->
  <div id="loginBox">
    <div class="header">
      <span class="badge-topo">MINISTÉRIO TOPO</span>
      <h1>🔑 Acesso do Líder</h1>
      <p>Selecione sua supervisão, sua rede e digite a senha</p>
    </div>

    <div class="form-group">
      <label>Supervisão</label>
      <select id="selectSupervisao"><option value="">Selecione a Supervisão...</option></select>
    </div>

    <div class="form-group">
      <label>Rede</label>
      <select id="selectRede" disabled><option value="">Selecione a Supervisão primeiro</option></select>
    </div>

    <div class="form-group">
      <label>Senha de Acesso</label>
      <input type="password" id="inputSenha" placeholder="Digite a senha (1234)">
    </div>

    <button class="btn" onclick="fazerLoginLider()">Entrar na Rede</button>
  </div>

  <!-- MENU DO LÍDER (APÓS LOGAR) -->
  <div id="menuLider">
    <div class="header">
      <span class="badge-topo" id="badgeRedeLogada">REDE</span>
      <h1 id="tituloLiderLogado">Painel da Rede</h1>
      <p id="subLiderLogado" style="color: var(--text-muted); font-size: 0.85rem;"></p>
    </div>

    <div class="menu-grid">
      <a href="painel.html" class="menu-btn"><span>📊 Painel da Rede & Aniversariantes</span> ➔</a>
      <a href="cadastro.html" class="menu-btn"><span>👤 Cadastrar Novo Membro</span> ➔</a>
      <a href="relatorio.html" class="menu-btn"><span>📋 Enviar Relatório Semanal</span> ➔</a>
    </div>

    <button class="btn" style="background: #21262D; border: 1px solid var(--card-border); margin-top: 24px;" onclick="sairDaSessao()">Trocar de Rede / Sair</button>
  </div>
</div>

<script>
  const supervisoresDB = [
    { supervisao: "Supervisão Monte Hor", supervisor: "Luís Felipe", redes: [{ nome: "Rede Moisés", lider: "Gabriel" }, { nome: "Rede Alfa", lider: "Plinio" }, { nome: "Rede Timóteo", lider: "Sotero" }, { nome: "Rede Next", lider: "Vyni Léo" }, { nome: "Rede Inconformados", lider: "Maurilio" }, { nome: "Rede Atalaia", lider: "Mancine" }] },
    { supervisao: "Supervisão Monte Tabor", supervisor: "Danylo Brissantt", redes: [{ nome: "Hazak", lider: "Vitinho" }, { nome: "Monte Pisga", lider: "Ezequiel" }, { nome: "Escolhidos", lider: "João" }, { nome: "Paroikos", lider: "Iago" }, { nome: "Atos", lider: "Arley" }, { nome: "Karygma", lider: "Richard" }] },
    { supervisao: "Supervisão Monte Nebo", supervisor: "Emanuel Henrique", redes: [{ nome: "Rede Invictos", lider: "Éden" }, { nome: "Rede Ekballo", lider: "Cristian" }, { nome: "Rede Ousadia", lider: "Wallyson" }, { nome: "Rede Maranata", lider: "Richarlyson" }, { nome: "Rede Ruah", lider: "Vinícius" }] },
    { supervisao: "Supervisão Monte Horebe", supervisor: "Andryo Henrique", redes: [{ nome: "Rede Aljava", lider: "Taycilio" }, { nome: "Rede Sal da Terra", lider: "Marcelo Flexa" }, { nome: "Rede Ekklesia", lider: "Rodrigo" }, { nome: "Rede Forjados", lider: "Alef" }] },
    { supervisao: "Supervisão Monte Carmelo", supervisor: "Diana Guerra", redes: [{ nome: "Rede Flame", lider: "Cecília" }, { nome: "Rede Aurora", lider: "Ester" }, { nome: "Rede Colossenses", lider: "Ingrid" }, { nome: "Rede Perazim", lider: "Íris" }, { nome: "Rede Rise", lider: "Gabriela" }] },
    { supervisao: "Supervisão Monte Moriá", supervisor: "Larissa Neves", redes: [{ nome: "Rede Peregrina", lider: "Saiwry" }, { nome: "Rede Lume", lider: "Myrella" }, { nome: "Rede Promessa", lider: "Júlia" }, { nome: "Rede Áquila", lider: "Thaynara" }, { nome: "Rede Carmesim", lider: "Lívia" }, { nome: "Rede Emunah", lider: "Mayara" }, { nome: "Rede Margaridas", lider: "Lara" }] },
    { supervisao: "Supervisão Monte Sinai", supervisor: "Sara Gomes", redes: [{ nome: "Rede Jardim", lider: "Joana" }, { nome: "Rede Dunamis", lider: "Mikaele" }, { nome: "Rede Grace", lider: "Fernanda" }, { nome: "Rede Graciosa", lider: "Gleicy" }, { nome: "Rede Zoe", lider: "Karol" }, { nome: "Rede Lamparinas", lider: "Laura Ester" }] },
    { supervisao: "Supervisão Monte Sião", supervisor: "Clara Dione", redes: [{ nome: "Rede Águias", lider: "Anny" }, { nome: "Rede Hope", lider: "Laysa" }, { nome: "Rede Bloom", lider: "Clara" }, { nome: "Rede Herdeiras", lider: "Mika" }] },
    { supervisao: "Supervisão Monte das Oliveiras", supervisor: "Letícia Sampaio", redes: [{ nome: "Monte das Oliveiras", lider: "Letícia Sampaio" }, { nome: "Rede Lily", lider: "Dayanne Lethicia" }, { nome: "Rede Liz", lider: "Letícia Rodrigues" }, { nome: "Rede Âmbar", lider: "Gabriella A." }] },
    { supervisao: "Supervisão Monte Seir", supervisor: "Karol Nogueira", redes: [{ nome: "Rede Joy", lider: "Leticia" }, { nome: "Rede Legacy", lider: "Laura" }, { nome: "Rede Ramá", lider: "Raianny" }] }
  ];

  document.addEventListener("DOMContentLoaded", () => {
    const selSup = document.getElementById('selectSupervisao');
    supervisoresDB.forEach((item, index) => {
      const opt = document.createElement('option');
      opt.value = index;
      opt.textContent = `${item.supervisao} (${item.supervisor})`;
      selSup.appendChild(opt);
    });

    selSup.addEventListener('change', atualizarRedesLogin);

    // Verifica se já existe login na sessão
    const redeSalva = sessionStorage.getItem('topo_rede');
    if (redeSalva) {
      mostrarMenuLider();
    }
  });

  function atualizarRedesLogin() {
    const indexSup = document.getElementById('selectSupervisao').value;
    const selRede = document.getElementById('selectRede');
    selRede.innerHTML = '';

    if (indexSup === "") {
      selRede.disabled = true;
      selRede.innerHTML = '<option value="">Selecione a Supervisão primeiro</option>';
      return;
    }

    selRede.disabled = false;
    selRede.innerHTML = '<option value="">Selecione sua Rede</option>';
    supervisoresDB[indexSup].redes.forEach((r, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = `${r.nome} (Líder: ${r.lider})`;
      selRede.appendChild(opt);
    });
  }

  function fazerLoginLider() {
    const indexSup = document.getElementById('selectSupervisao').value;
    const indexRede = document.getElementById('selectRede').value;
    const senha = document.getElementById('inputSenha').value.trim();

    if (indexSup === "" || indexRede === "") return alert("Selecione sua supervisão e sua rede.");
    if (senha !== "1234") return alert("Senha incorreta! A senha padrão é 1234.");

    const supObj = supervisoresDB[indexSup];
    const redeObj = supObj.redes[indexRede];

    // Salva na sessão do navegador
    sessionStorage.setItem('topo_supervisao', supObj.supervisao);
    sessionStorage.setItem('topo_supervisor', supObj.supervisor);
    sessionStorage.setItem('topo_rede', redeObj.nome);
    sessionStorage.setItem('topo_lider', redeObj.lider);

    mostrarMenuLider();
  }

  function mostrarMenuLider() {
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('menuLider').style.display = 'block';

    const rede = sessionStorage.getItem('topo_rede');
    const lider = sessionStorage.getItem('topo_lider');
    const supervisao = sessionStorage.getItem('topo_supervisao');

    document.getElementById('badgeRedeLogada').innerText = rede;
    document.getElementById('tituloLiderLogado').innerText = `Líder: ${lider}`;
    document.getElementById('subLiderLogado').innerText = supervisao;
  }

  function sairDaSessao() {
    sessionStorage.clear();
    document.getElementById('menuLider').style.display = 'none';
    document.getElementById('loginBox').style.display = 'block';
    document.getElementById('selectSupervisao').value = "";
    document.getElementById('selectRede').innerHTML = '<option value="">Selecione a Supervisão primeiro</option>';
    document.getElementById('selectRede').disabled = true;
    document.getElementById('inputSenha').value = "";
  }
</script>

</body>
</html>
