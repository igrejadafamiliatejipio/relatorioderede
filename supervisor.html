<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Supervisor - Ministério TOPO</title>
  <style>
    :root {
      --bg: #0D0F12;
      --card-bg: #161B22;
      --card-border: #30363D;
      --input-bg: #0D1117;
      --text: #F0F6FC;
      --text-muted: #8B949E;
      --primary: #6E56CF;
      --primary-hover: #5B45B0;
      --success: #23D160;
      --warning: #E3B341;
      --danger: #E5534B;
      --info: #388BFD;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px 12px; display: flex; justify-content: center; min-height: 100vh; }
    .container { max-width: 900px; width: 100%; background: var(--card-bg); padding: 28px; border-radius: 16px; border: 1px solid var(--card-border); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }

    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .btn-voltar { background: #21262D; color: var(--text); border: 1px solid var(--card-border); padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; text-decoration: none; }
    .btn-voltar:hover { background: #30363D; }

    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 1.75rem; font-weight: 700; margin-top: 6px; }
    .badge-topo { display: inline-block; background: var(--primary); color: #FFF; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }

    .info-sup-box { background: var(--input-bg); border: 1px solid var(--card-border); padding: 14px; border-radius: 8px; margin-bottom: 24px; text-align: center; font-size: 0.9rem; color: var(--text-muted); }
    .info-sup-box strong { color: var(--text); }

    .section-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }

    .rede-raiox-card { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
    .rede-raiox-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .rede-raiox-header strong { font-size: 1.1rem; color: var(--text); }
    
    .btn-ver-relatorios { background: rgba(56, 139, 253, 0.15); color: var(--info); border: 1px solid rgba(56, 139, 253, 0.3); padding: 4px 10px; border-radius: 6px; font-size: 0.78rem; font-weight: 600; cursor: pointer; text-decoration: none; }
    .btn-ver-relatorios:hover { background: var(--info); color: #FFF; }

    .raiox-detalhes { font-size: 0.88rem; color: var(--text-muted); line-height: 1.5; }
    .raiox-detalhes span { color: var(--text); font-weight: 600; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 999; display: none; }
    .modal-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 24px; max-width: 600px; width: 100%; max-height: 85vh; overflow-y: auto; }
    .modal-header { font-size: 1.2rem; font-weight: 700; margin-bottom: 16px; color: var(--text); display: flex; justify-content: space-between; align-items: center; }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .btn-cancelar { background: #21262D; color: var(--text); border: 1px solid var(--card-border); padding: 8px 14px; border-radius: 8px; cursor: pointer; }
    .btn-cancelar:hover { background: #30363D; }

    .relatorio-item-sup { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .relatorio-item-sup header { display: flex; justify-content: space-between; font-weight: 600; font-size: 0.88rem; margin-bottom: 4px; color: var(--primary); }

    .loading-box { text-align: center; padding: 40px; color: var(--text-muted); }
  </style>

  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="container">
  <div class="top-nav">
    <a href="login.html" class="btn-voltar">← Sair / Voltar</a>
  </div>

  <div class="header">
    <span class="badge-topo">MINISTÉRIO TOPO</span>
    <h1>👁️ Painel do Supervisor</h1>
    <p>Raio-X e acompanhamento das redes sob sua supervisão</p>
  </div>

  <div class="info-sup-box" id="infoSupLogado">
    Carregando dados da supervisão...
  </div>

  <div id="conteudoPainelSupervisor" style="display: none;">
    <div class="section-title">📊 Raio-X das Redes da Supervisão</div>
    <div id="listaRaioXRedes"></div>
  </div>

  <div id="loadingSup" class="loading-box" style="display: block;">Carregando informações do Firebase...</div>
</div>

<!-- Modal para Exibir os Relatórios da Rede Selecionada -->
<div id="modalRelatoriosRede" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-header">
      <span id="tituloModalRede">📜 Relatórios da Rede</span>
      <button onclick="fecharModalRelatoriosRede()" style="background:none; border:none; color:var(--text-muted); font-size:1.2rem; cursor:pointer;">✕</button>
    </div>
    
    <div id="conteudoRelatoriosRede">
      Carregando relatórios...
    </div>

    <div class="modal-footer">
      <button class="btn-cancelar" onclick="fecharModalRelatoriosRede()">Fechar</button>
    </div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB7FJXs9wiRFYIs2ugZoWrw7jTXPR5weGk",
    authDomain: "app-redes-iftejipio.firebaseapp.com",
    projectId: "app-redes-iftejipio",
    storageBucket: "app-redes-iftejipio.firebasestorage.app",
    messagingSenderId: "954529090793",
    appId: "1:954529090793:web:6702d102b6e5b178b6b478",
    measurementId: "G-2MJ96WMYQ5"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let supervisaoLogada = "";
  let redesDaSupervisao = [];
  let relatoriosCache = [];

  document.addEventListener("DOMContentLoaded", async function() {
    supervisaoLogada = sessionStorage.getItem('topo_supervisao');

    if (!supervisaoLogada) {
      alert("Nenhuma supervisão identificada. Faça o login novamente.");
      window.location.href = "login.html";
      return;
    }

    document.getElementById('infoSupLogado').innerHTML = `Supervisor(a) da Supervisão: <strong>${supervisaoLogada}</strong>`;

    await carregarRaioXSupervisao();
  });

  async function carregarRaioXSupervisao() {
    document.getElementById('loadingSup').style.display = 'block';
    document.getElementById('conteudoPainelSupervisor').style.display = 'none';

    try {
      // 1. Busca redes vinculadas a esta supervisão
      const snapRedes = await db.collection('redes')
        .where('supervisao', '==', supervisaoLogada)
        .get();

      redesDaSupervisao = [];
      snapRedes.forEach(doc => {
        redesDaSupervisao.push({ id: doc.id, ...doc.data() });
      });

      // Se a coleção 'redes' não for usada e os nomes vierem direto de membros/relatórios, ajustamos por distinct
      if (redesDaSupervisao.length === 0) {
        // Tenta descobrir as redes através dos relatórios ou membros caso a coleção redes não exista
        const snapRel = await db.collection('relatorios').get();
        let redesSet = new Set();
        snapRel.forEach(doc => {
          const data = doc.data();
          if (data.supervisao === supervisaoLogada || !data.supervisao) {
            if (data.rede) redesSet.add(data.rede);
          }
        });
        redesDaSupervisao = Array.from(redesSet).map(r => ({ nomeRede: r }));
      }

      // 2. Busca todos os relatórios para mapear o Raio-X
      const snapRelatorios = await db.collection('relatorios').get();
      relatoriosCache = [];
      snapRelatorios.forEach(doc => {
        relatoriosCache.push({ id: doc.id, ...doc.data() });
      });

      renderizarRaioX();
    } catch (err) {
      alert("Erro ao carregar dados do painel do supervisor.");
      console.error(err);
    } finally {
      document.getElementById('loadingSup').style.display = 'none';
    }
  }

  function renderizarRaioX() {
    const container = document.getElementById('listaRaioXRedes');
    container.innerHTML = '';

    if (redesDaSupervisao.length === 0) {
      container.innerHTML = `<div style="color: var(--text-muted);">Nenhuma rede encontrada para esta supervisão.</div>`;
      document.getElementById('conteudoPainelSupervisor').style.display = 'block';
      return;
    }

    redesDaSupervisao.forEach(redeObj => {
      const nomeRede = redeObj.nomeRede || redeObj.nome || redeObj.id;

      // Filtra relatórios desta rede
      const relsRede = relatoriosCache.filter(r => r.rede === nomeRede);
      // Ordena por data/envio se houver
      relsRede.sort((a, b) => new Date(b.dataEncontro || 0) - new Date(a.dataEncontro || 0));

      const ultimoRel = relsRede.length > 0 ? relsRede[0] : null;

      let infoUltimoRel = "Nenhum relatório enviado ainda";
      if (ultimoRel) {
        infoUltimoRel = `Data: <span>${ultimoRel.dataEncontro || 'N/A'}</span> | Tema: <span>${ultimoRel.tema || 'N/A'}</span> | Presentes: <span>${ultimoRel.presentes ? ultimoRel.presentes.split(',').length : 0}</span>`;
      }

      const div = document.createElement('div');
      div.className = 'rede-raiox-card';
      div.innerHTML = `
        <div class="rede-raiox-header">
          <strong>Rede: ${nomeRede}</strong>
          <button class="btn-ver-relatorios" onclick="abrirRelatoriosRede('${nomeRede}')">📋 Ver Relatórios (${relsRede.length})</button>
        </div>
        <div class="raiox-detalhes">
          <strong>Último Relatório:</strong> ${infoUltimoRel}
        </div>
      `;
      container.appendChild(div);
    });

    document.getElementById('conteudoPainelSupervisor').style.display = 'block';
  }

  function abrirRelatoriosRede(nomeRede) {
    document.getElementById('tituloModalRede').innerText = `📜 Relatórios da ${nomeRede}`;
    const conteudoModal = document.getElementById('conteudoRelatoriosRede');
    conteudoModal.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-muted);">Carregando relatórios...</div>`;
    
    document.getElementById('modalRelatoriosRede').style.display = 'flex';

    const relsRede = relatoriosCache.filter(r => r.rede === nomeRede);
    relsRede.sort((a, b) => new Date(b.dataEncontro || 0) - new Date(a.dataEncontro || 0));

    if (relsRede.length === 0) {
      conteudoModal.innerHTML = `<div style="color: var(--text-muted); text-align:center; padding: 20px;">Nenhum relatório cadastrado para esta rede.</div>`;
      return;
    }

    let htmlRels = '';
    relsRede.forEach(r => {
      htmlRels += `
        <div class="relatorio-item-sup">
          <header>
            <span>📅 Encontro: ${r.dataEncontro || 'N/A'} (${r.horario || ''})</span>
            <span>📍 ${r.local || 'Local não informado'}</span>
          </header>
          <div style="font-size: 0.85rem; color: var(--text); line-height: 1.4; margin-top: 6px;">
            <strong>Tema:</strong> ${r.tema || '-'}<br>
            <strong>Presentes:</strong> ${r.presentes || 'Nenhum'}<br>
            <strong>Visitantes:</strong> ${r.visitantes || 'Nenhum'}<br>
            <span style="color: var(--danger);"><strong>Faltantes:</strong> ${r.faltantes || 'Nenhum'}</span><br>
            <strong>Resumo da Palavra:</strong> ${r.resumoPalavra || '-'}<br>
            <strong>Atividades:</strong> ${r.atividades || '-'}
          </div>
        </div>
      `;
    });

    conteudoModal.innerHTML = htmlRels;
  }

  function fecharModalRelatoriosRede() {
    document.getElementById('modalRelatoriosRede').style.display = 'none';
  }
</script>

</body>
</html>
