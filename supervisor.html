<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login do Supervisor - Ministério TOPO</title>
  <style>
    :root {
      --bg: #0D0F12;
      --card-bg: #161B22;
      --card-border: #30363D;
      --input-bg: #0D1117;
      --text: #F0F6FC;
      --text-muted: #8B949E;
      --primary: #6E56CF;
      --primary-hover: #5B45B0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px 12px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { max-width: 420px; width: 100%; background: var(--card-bg); padding: 32px; border-radius: 16px; border: 1px solid var(--card-border); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); text-align: center; }
    .btn-voltar { background: #21262D; color: var(--text); border: 1px solid var(--card-border); padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 20px; float: left; }
    .btn-voltar:hover { background: #30363D; }
    .header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; }
    .header p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 24px; }
    .badge-topo { display: inline-block; background: var(--primary); color: #FFF; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 12px; }
    .form-group { margin-bottom: 16px; text-align: left; }
    label { display: block; font-weight: 500; font-size: 0.82rem; margin-bottom: 6px; color: var(--text-muted); text-transform: uppercase; }
    select, input { width: 100%; padding: 12px 14px; background-color: var(--input-bg); border: 1px solid var(--card-border); border-radius: 8px; font-size: 0.95rem; color: var(--text); outline: none; }
    select:focus, input:focus { border-color: var(--primary); }
    select option { background-color: var(--card-bg); color: var(--text); }
    .btn { background-color: var(--primary); color: white; border: none; padding: 12px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.95rem; width: 100%; transition: 0.2s; margin-top: 8px; }
    .btn:hover { background-color: var(--primary-hover); }
  </style>
</head>
<body>
<div class="container">
  <a href="index.html" class="btn-voltar">← Voltar ao Início</a>
  <div style="clear: both;"></div>
  <div class="header">
    <span class="badge-topo">ÁREA DO SUPERVISOR</span>
    <h1>Ministério TOPO</h1>
    <p>Selecione sua supervisão para acessar o painel</p>
  </div>
  <div class="form-group">
    <label for="selectSup">Supervisão</label>
    <select id="selectSup">
      <option value="">Carregando supervisões...</option>
    </select>
  </div>
  <div class="form-group">
    <label for="inputSenha">Senha de Acesso</label>
    <input type="password" id="inputSenha" placeholder="Digite sua senha">
  </div>
  <button class="btn" onclick="fazerLogin()">Entrar no Sistema</button>
</div>

<script>
  const supervisoresDB = [
    { supervisao: "Supervisão Monte Hor", supervisor: "Luís Felipe", senha: "1001", redes: [{ nome: "Rede Moisés" }, { nome: "Rede Alfa" }, { nome: "Rede Timóteo" }, { nome: "Rede Next" }, { nome: "Rede Inconformados" }, { nome: "Rede Atalaia" }] },
    { supervisao: "Supervisão Monte Tabor", supervisor: "Danylo Brissantt", senha: "1002", redes: [{ nome: "Hazak" }, { nome: "Monte Pisga" }, { nome: "Escolhidos" }, { nome: "Paroikos" }, { nome: "Atos" }, { nome: "Karygma" }] },
    { supervisao: "Supervisão Monte Nebo", supervisor: "Emanuel Henrique", senha: "1003", redes: [{ nome: "Rede Invictos" }, { nome: "Rede Ekballo" }, { nome: "Rede Ousadia" }, { nome: "Rede Maranata" }, { nome: "Rede Ruah" }] },
    { supervisao: "Supervisão Monte Horebe", supervisor: "Andryo Henrique", senha: "1004", redes: [{ nome: "Rede Aljava" }, { nome: "Rede Sal da Terra" }, { nome: "Rede Ekklesia" }, { nome: "Rede Forjados" }] },
    { supervisao: "Supervisão Monte Carmelo", supervisor: "Diana Guerra", senha: "1005", redes: [{ nome: "Rede Flame" }, { nome: "Rede Aurora" }, { nome: "Rede Colossenses" }, { nome: "Rede Perazim" }, { nome: "Rede Rise" }] },
    { supervisao: "Supervisão Monte Moriá", supervisor: "Larissa Neves", senha: "1006", redes: [{ nome: "Rede Peregrina" }, { nome: "Rede Lume" }, { nome: "Rede Promessa" }, { nome: "Rede Áquila" }, { nome: "Rede Carmesim" }, { nome: "Rede Emunah" }, { nome: "Rede Margaridas" }] },
    { supervisao: "Supervisão Monte Sinai", supervisor: "Sara Gomes", senha: "1007", redes: [{ nome: "Rede Jardim" }, { nome: "Rede Dunamis" }, { nome: "Rede Grace" }, { nome: "Rede Graciosa" }, { nome: "Rede Zoe" }, { nome: "Rede Lamparinas" }] },
    { supervisao: "Supervisão Monte Sião", supervisor: "Clara Dione", senha: "1008", redes: [{ nome: "Rede Águias" }, { nome: "Rede Hope" }, { nome: "Rede Bloom" }, { nome: "Rede Herdeiras" }] },
    { supervisao: "Supervisão Monte das Oliveiras", supervisor: "Letícia Sampaio", senha: "1009", redes: [{ nome: "Monte das Oliveiras" }, { nome: "Rede Lily" }, { nome: "Rede Liz" }, { nome: "Rede Âmbar" }] },
    { supervisao: "Supervisão Monte Seir", supervisor: "Karol Nogueira", senha: "1010", redes: [{ nome: "Rede Joy" }, { nome: "Rede Legacy" }, { nome: "Rede Ramá" }] }
  ];

  document.addEventListener('DOMContentLoaded', () => {
    const select = document.getElementById('selectSup');
    select.innerHTML = '<option value="">Selecione sua Supervisão</option>';
    supervisoresDB.forEach((item, index) => {
      const opt = document.createElement('option');
      opt.value = index;
      opt.textContent = `${item.supervisao} (${item.supervisor})`;
      select.appendChild(opt);
    });
  });

  function fazerLogin() {
    const index = document.getElementById('selectSup').value;
    const senha = document.getElementById('inputSenha').value.trim();
    if (index === "") return alert("Selecione a sua supervisão.");
    const sup = supervisoresDB[index];
    if (senha !== sup.senha) return alert("Senha incorreta!");

    // Salva na sessão e redireciona para o menu principal do supervisor
    sessionStorage.setItem('topo_sup_nome', sup.supervisao);
    sessionStorage.setItem('topo_sup_responsavel', sup.supervisor);
    sessionStorage.setItem('topo_sup_redes', JSON.stringify(sup.redes));

    window.location.href = "supervisor_menu.html";
  }
</script>
</body>
</html>
