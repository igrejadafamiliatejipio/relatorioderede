<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Supervisor - Ministério TOPO</title>
  <style>
    :root {
      --bg: #0D0F12;
      --card-bg: #161B22;
      --card-border: #30363D;
      --input-bg: #0D1117;
      --text: #F0F6FC;
      --text-muted: #8B949E;
      --primary: #6E56CF;
      --primary-hover: #5B45B0;
      --success: #23D160;
      --warning: #E3B341;
      --danger: #E5534B;
      --info: #388BFD;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px 12px; display: flex; justify-content: center; min-height: 100vh; }
    .container { max-width: 960px; width: 100%; background: var(--card-bg); padding: 28px; border-radius: 16px; border: 1px solid var(--card-border); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
    
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .btn-voltar { background: #21262D; color: var(--text); border: 1px solid var(--card-border); padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .btn-voltar:hover { background: #30363D; }

    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 1.75rem; font-weight: 700; }
    .header p { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }

    .badge-topo { display: inline-block; background: var(--primary); color: #FFF; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }

    #loginBox { max-width: 400px; margin: 40px auto; text-align: center; background: var(--input-bg); padding: 32px 24px; border-radius: 12px; border: 1px solid var(--card-border); }
    .form-group { margin-bottom: 16px; text-align: left; }
    label { display: block; font-weight: 500; font-size: 0.85rem; margin-bottom: 6px; color: var(--text-muted); text-transform: uppercase; }
    input[type="password"], select { width: 100%; padding: 12px 14px; background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; font-size: 0.95rem; color: var(--text); outline: none; }
    input:focus, select:focus { border-color: var(--primary); }
    select option { background-color: var(--card-bg); color: var(--text); }

    .btn { background-color: var(--primary); color: white; border: none; padding: 12px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.95rem; width: 100%; transition: 0.2s; }
    .btn:hover { background-color: var(--primary-hover); }

    .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
    .metric-card { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 16px; text-align: center; }
    .metric-card h4 { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
    .metric-card .value { font-size: 1.6rem; font-weight: 800; color: var(--text); }

    .section-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }

    .tree-wrapper { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 24px 16px; margin-bottom: 32px; overflow-x: auto; }
    .tree-container { display: flex; flex-direction: column; align-items: center; min-width: 600px; }
    .tree-supervisor-node { background: linear-gradient(135deg, rgba(110, 86, 207, 0.3) 0%, var(--card-bg) 100%); border: 2px solid var(--primary); padding: 12px 24px; border-radius: 12px; text-align: center; box-shadow: 0 4px 18px rgba(110, 86, 207, 0.25); }
    .tree-supervisor-node h3 { font-size: 1.1rem; font-weight: 700; color: var(--text); }
    .tree-supervisor-node span { font-size: 0.75rem; color: #A58BFF; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

    .tree-line-v { width: 2px; height: 24px; background: var(--card-border); }
    .tree-leaders-row { display: flex; gap: 16px; justify-content: center; align-items: flex-start; width: 100%; }
    .tree-leader-card { background: var(--card-bg); border: 1px solid var(--card-border); border-top: 3px solid var(--info); border-radius: 12px; padding: 14px; flex: 1; min-width: 170px; max-width: 210px; }
    .tree-leader-header { text-align: center; padding-bottom: 10px; border-bottom: 1px solid var(--card-border); margin-bottom: 10px; }
    .tree-leader-header strong { font-size: 0.95rem; color: var(--text); display: block; }
    .tree-leader-header small { font-size: 0.75rem; color: var(--info); font-weight: 600; }

    .tree-members-list { display: flex; flex-direction: column; gap: 6px; }
