<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu do Supervisor - Ministério TOPO</title>
  <style>
    :root {
      --bg: #0D0F12;
      --card-bg: #161B22;
      --card-border: #30363D;
      --input-bg: #0D1117;
      --text: #F0F6FC;
      --text-muted: #8B949E;
      --primary: #6E56CF;
      --primary-hover: #5B45B0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px 10px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { max-width: 780px; width: 100%; background: var(--card-bg); padding: 24px; border-radius: 16px; border: 1px solid var(--card-border); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
    .btn-voltar { background: #21262D; color: var(--text); border: 1px solid var(--card-border); padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .btn-voltar:hover { background: #30363D; }
    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 1.5rem; font-weight: 700; margin-top: 4px; }
    .header p { font-size: 0.82rem; color: var(--text-muted); margin-top: 4px; }
    .badge-topo { display: inline-block; background: var(--primary); color: #FFF; padding: 4px 12px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 6px; text-transform: uppercase; }
    
    .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .menu-card { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 18px 12px; text-align: center; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .menu-card:hover { border-color: var(--primary); transform: translateY(-2px); background: rgba(110, 86, 207, 0.05); }
    .menu-card .icon { font-size: 1.8rem; margin-bottom: 8px; }
    .menu-card h3 { font-size: 0.9rem; font-weight: 700; color: var(--text); }

    /* Modal Styles */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 999; display: none; }
    .modal-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 20px; max-width: 500px; width: 100%; max-height: 85vh; overflow-y: auto; text-align: left; }
    .modal-header { font-size: 1.1rem; font-weight: 700; margin-bottom: 14px; color: var(--text); display: flex; justify-content: space-between; align-items: center; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: 500; font-size: 0.78rem; margin-bottom: 4px; color: var(--text-muted); text-transform: uppercase; }
    input, select { width: 100%; padding: 10px 12px; background-color: var(--input-bg); border: 1px solid var(--card-border); border-radius: 8px; font-size: 0.9rem; color: var(--text); outline: none; }
    input:focus, select:focus { border-color: var(--primary); }
    select option { background-color: var(--card-bg); color: var(--text); }
    .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
    .btn-salvar { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .btn-salvar:hover { background: var(--primary-hover); }
    .btn-cancelar { background: #21262D; color: var(--text); border: 1px solid var(--card-border); padding: 10px 16px; border-radius: 8px; cursor: pointer; }
    .btn-cancelar:hover { background: #30363D; }

    @media (max-width: 480px) { 
      .container { padding: 16px 12px; }
      .header h1 { font-size: 1.3rem; }
      .menu-card { padding: 14px 10px; }
      .menu-card .icon { font-size: 1.6rem; margin-bottom: 6px; }
      .menu-card h3 { font-size: 0.85rem; }
    }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="container">
  <div class="top-nav">
    <button class="btn-voltar" onclick="sair()">← Sair / Trocar</button>
    <span id="labelSup" style="font-size: 0.8rem; color: var(--text-muted);"></span>
  </div>
  <div class="header">
    <span class="badge-topo" id="badgeMinisterio">PAINEL DO SUPERVISOR</span>
    <h1>Escolha uma Opção</h1>
    <p>Selecione a ferramenta de gestão desejada</p>
  </div>
  <div class="menu-grid">
    <div class="menu-card" onclick="irPara('supervisor_cadastro.html')">
      <div class="icon">📝</div>
      <h3>Cadastrar Membro</h3>
    </div>
    <div class="menu-card" onclick="irPara('supervisor_macro.html')">
      <div class="icon">📈</div>
      <h3>Painel Macro</h3>
    </div>
    <div class="menu-card" onclick="irPara('supervisor_criar_rede.html')">
      <div class="icon">🌱</div>
      <h3>Abrir Nova Rede</h3>
    </div>
    <div class="menu-card" onclick="irPara('supervisor_selecionar_perfil_rede.html')">
      <div class="icon">🏠</div>
      <h3>Perfil das Redes</h3>
    </div>
    <div class="menu-card" onclick="irPara('supervisor_visita.html')">
      <div class="icon">⭐</div>
      <h3>Relatório de Visita</h3>
    </div>
    <div class="menu-card" onclick="abrirMeuPerfil()">
      <div class="icon">⚙️</div>
      <h3>Meu Perfil</h3>
    </div>
  </div>
</div>

<!-- Modal de Edição do Perfil do Supervisor -->
<div id="modalPerfil" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-header">👤 Meu Perfil</div>
    <input type="hidden" id="perfilDocId">

    <div class="form-group"><label>Nome Completo</label><input type="text" id="perfilNome" readonly style="opacity: 0.7; cursor: not-allowed;"></div>
    <div class="form-group"><label>E-mail de Acesso</label><input type="email" id="perfilEmail" placeholder="seu.email@exemplo.com"></div>
    <div class="form-group"><label>WhatsApp</label><input type="text" id="perfilWhatsapp" placeholder="(81) 99999-9999"></div>
    <div class="form-group"><label>Data de Nascimento</label><input type="date" id="perfilNascimento"></div>
    <div class="form-group">
      <label>Sexo</label>
      <select id="perfilSexo"><option value="">Selecione...</option><option value="Masculino">Masculino</option><option value="Feminino">Feminino</option></select>
    </div>
    <div class="form-group">
      <label>Batizado?</label>
      <select id="perfilBatizado"><option value="Sim">Sim</option><option value="Não">Não</option></select>
    </div>

    <div class="modal-footer">
      <button class="btn-cancelar" onclick="fecharModalPerfil()">Cancelar</button>
      <button class="btn-salvar" onclick="salvarMeuPerfil()">Salvar Alterações</button>
    </div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB7FJXs9wiRFYIs2ugZoWrw7jTXPR5weGk",
    authDomain: "app-redes-iftejipio.firebaseapp.com",
    projectId: "app-redes-iftejipio",
    storageBucket: "app-redes-iftejipio.firebasestorage.app",
    messagingSenderId: "954529090793",
    appId: "1:954529090793:web:6702d102b6e5b178b6b478",
    measurementId: "G-2MJ96WMYQ5"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let nomeSup = '';
  let ministerioAtivo = 'TOPO';

  document.addEventListener('DOMContentLoaded', () => {
    nomeSup = sessionStorage.getItem('topo_sup_nome');
    const respSup = sessionStorage.getItem('topo_sup_responsavel');
    if (!nomeSup) {
      window.location.href = "index.html";
      return;
    }
    ministerioAtivo = sessionStorage.getItem('topo_ministerio') || 'TOPO';
    document.getElementById('badgeMinisterio').innerText = `PAINEL DO SUPERVISOR - ${ministerioAtivo}`;
    document.getElementById('labelSup').innerText = `${nomeSup} - ${respSup || ''}`;
  });

  function irPara(pagina) { window.location.href = pagina; }
  function sair() { sessionStorage.clear(); window.location.href = "index.html"; }

  async function abrirMeuPerfil() {
    const modal = document.getElementById('modalPerfil');
    modal.style.display = 'flex';

    try {
      const snapshot = await db.collection('membros')
        .where('nome', '==', nomeSup)
        .where('categoria', '==', 'Supervisor')
        .get();

      if (!snapshot.empty) {
        const doc = snapshot.docs[0];
        const data = doc.data();

        document.getElementById('perfilDocId').value = doc.id;
        document.getElementById('perfilNome').value = data.nome || nomeSup;
        document.getElementById('perfilEmail').value = data.email || '';
        document.getElementById('perfilWhatsapp').value = data.whatsapp || '';
        document.getElementById('perfilNascimento').value = data.nascimento || '';
        document.getElementById('perfilSexo').value = data.sexo || '';
        document.getElementById('perfilBatizado').value = data.batizado || 'Sim';
      } else {
        document.getElementById('perfilNome').value = nomeSup;
      }
    } catch (err) {
      console.error("Erro ao carregar perfil:", err);
      alert("Erro ao carregar seus dados.");
    }
  }

  function fecharModalPerfil() {
    document.getElementById('modalPerfil').style.display = 'none';
  }

  async function salvarMeuPerfil() {
    const docId = document.getElementById('perfilDocId').value;
    const email = document.getElementById('perfilEmail').value.trim().toLowerCase();
    const whatsapp = document.getElementById('perfilWhatsapp').value.trim();
    const nascimento = document.getElementById('perfilNascimento').value;
    const sexo = document.getElementById('perfilSexo').value;
    const batizado = document.getElementById('perfilBatizado').value;

    fecharModalPerfil();

    try {
      if (docId) {
        await db.collection('membros').doc(docId).update({
          email, whatsapp, nascimento, sexo, batizado
        });
      } else {
        await db.collection('membros').add({
          nome: nomeSup,
          ministerio: ministerioAtivo,
          categoria: 'Supervisor',
          rede: 'Supervisão Geral',
          supervisao: nomeSup,
          email, whatsapp, nascimento, sexo, batizado,
          status: 'ATIVO',
          criadoEm: new Date().toISOString()
        });
      }
      alert("✅ Perfil atualizado com sucesso!");
    } catch (err) {
      console.error("Erro ao salvar perfil:", err);
      alert("Erro ao salvar suas informações.");
    }
  }
</script>
</body>
</html>
