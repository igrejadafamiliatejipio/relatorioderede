<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatório de Rede - TOPO</title>
  <style>
    :root {
      --bg: #0D0F12;
      --card-bg: #161B22;
      --card-border: #30363D;
      --input-bg: #0D1117;
      --text: #F0F6FC;
      --text-muted: #8B949E;
      --primary: #6E56CF;
      --primary-hover: #5B45B0;
      --danger: #E5534B;
      --whatsapp: #23D160;
      --whatsapp-hover: #1EBE55;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px 12px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      max-width: 680px;
      width: 100%;
      background: var(--card-bg);
      padding: 28px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 6px;
    }

    .badge-topo {
      display: inline-block;
      background: var(--primary);
      color: #FFF;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .section {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 14px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-weight: 500;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"],
    input[type="date"],
    input[type="time"],
    input[type="file"],
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      background-color: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      transition: all 0.2s ease;
    }

    input::placeholder, textarea::placeholder {
      color: #484F58;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(110, 86, 207, 0.25);
    }

    select option {
      background-color: var(--card-bg);
      color: var(--text);
    }

    textarea {
      resize: vertical;
      min-height: 90px;
      line-height: 1.5;
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row .form-group {
      flex: 1;
    }

    .dynamic-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .dynamic-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: #21262D;
      color: var(--text);
      border: 1px solid var(--card-border);
    }
    .btn-secondary:hover {
      background-color: #30363D;
    }

    .btn-danger {
      background-color: rgba(229, 83, 75, 0.15);
      color: var(--danger);
      border: 1px solid rgba(229, 83, 75, 0.3);
      padding: 10px 14px;
    }
    .btn-danger:hover {
      background-color: var(--danger);
      color: white;
    }

    .btn-whatsapp {
      background-color: var(--whatsapp);
      color: #000;
      font-weight: 700;
    }
    .btn-whatsapp:hover {
      background-color: var(--whatsapp-hover);
      transform: translateY(-1px);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      font-size: 0.9rem;
      color: var(--text);
      cursor: pointer;
    }

    .checkbox-group input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .output-area {
      margin-top: 28px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
    }

    .output-text {
      white-space: pre-wrap;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.88rem;
      background: #040D12;
      color: #A6ADBA;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      max-height: 320px;
      overflow-y: auto;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .preview-image {
      max-width: 100%;
      max-height: 220px;
      border-radius: 8px;
      margin-top: 10px;
      display: none;
      border: 1px solid var(--card-border);
      object-fit: cover;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .actions .btn {
      flex: 1;
      min-width: 160px;
    }

    @media (max-width: 500px) {
      .row {
        flex-direction: column;
        gap: 0;
      }
      .container {
        padding: 20px 16px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <span class="badge-topo">MINISTÉRIO TOPO</span>
    <h1>📋 Relatório de Rede</h1>
    <p>Preencha os dados abaixo para gerar o resumo formatado</p>
  </div>

  <form id="formRelatorio" onsubmit="event.preventDefault();">
    <!-- 1. Hierarquia de Liderança -->
    <div class="section">
      <div class="section-title">📌 Hierarquia e Local</div>
      
      <div class="row">
        <div class="form-group">
          <label for="selectSupervisao">Supervisão</label>
          <select id="selectSupervisao">
            <option value="">Selecione a Supervisão</option>
          </select>
        </div>

        <div class="form-group">
          <label for="selectRede">Rede</label>
          <select id="selectRede" disabled>
            <option value="">Selecione primeiro a Supervisão</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="liderRede">Líder da Rede</label>
        <input type="text" id="liderRede" placeholder="Preenchido automaticamente ao escolher a rede" readonly style="opacity: 0.7;">
      </div>

      <div class="row">
        <div class="form-group">
          <label for="dataRede">Data</label>
          <input type="date" id="dataRede">
        </div>
        <div class="form-group">
          <label for="horarioRede">Horário</label>
          <input type="time" id="horarioRede">
        </div>
      </div>

      <div class="form-group">
        <label for="localRede">Local do Encontro</label>
        <input type="text" id="localRede" placeholder="Ex: Casa de Pedro / Igreja / Praça">
      </div>
    </div>

    <!-- 2. Pessoas Presentes -->
    <div class="section">
      <div class="section-title">👥 Pessoas Presentes</div>
      <div id="listaPresentes" class="dynamic-list"></div>
      <button type="button" id="btnAddPresente" class="btn btn-secondary">+ Adicionar Pessoa</button>
    </div>

    <!-- 3. Visitantes -->
    <div class="section">
      <div class="section-title">🤝 Visitantes</div>
      <div class="checkbox-group">
        <input type="checkbox" id="semVisitantes">
        <label for="semVisitantes" style="margin: 0; text-transform: none; color: var(--text);">Não houveram visitantes</label>
      </div>
      <div id="containerVisitantes">
        <div id="listaVisitantes" class="dynamic-list"></div>
        <button type="button" id="btnAddVisitante" class="btn btn-secondary">+ Adicionar Visitante</button>
      </div>
    </div>

    <!-- 4. Pessoas que Faltaram -->
    <div class="section">
      <div class="section-title">❌ Pessoas que Faltaram</div>
      <div id="listaFaltantes" class="dynamic-list"></div>
      <button type="button" id="btnAddFaltante" class="btn btn-secondary">+ Adicionar Faltante</button>
    </div>

    <!-- 5. Conteúdo e Atividades -->
    <div class="section">
      <div class="section-title">📖 Conteúdo do Encontro</div>

      <div class="form-group">
        <label for="tema">Tema abordado na rede</label>
        <input type="text" id="tema" placeholder="Ex: Fé e Perseverança">
      </div>

      <div class="form-group">
        <label for="resumoPalavra">Resumo da Palavra</label>
        <textarea id="resumoPalavra" placeholder="Escreva aqui um resumo do que foi ministrado..."></textarea>
      </div>

      <div class="form-group">
        <label for="resumoAtividades">Resumo das Atividades do Dia</label>
        <textarea id="resumoAtividades" placeholder="Resuma os momentos (louvor, dinâmica, lanche, oração...)..."></textarea>
      </div>

      <!-- Upload de Foto -->
      <div class="form-group">
        <label for="fotoRede">Foto da Rede (Opcional)</label>
        <input type="file" id="fotoRede" accept="image/*">
        <img id="imgPreview" class="preview-image" alt="Pré-visualização da foto">
      </div>
    </div>

    <button type="button" id="btnGerar" class="btn" style="width: 100%; font-size: 1.05rem;">Gerar Relatório Formatado</button>
  </form>

  <!-- Saída -->
  <div class="output-area" id="outputArea" style="display: none;">
    <div class="section-title">📄 Relatório Gerado</div>
    <div class="output-text" id="textoRelatorio"></div>
    <div class="actions">
      <button type="button" class="btn btn-secondary" id="btnCopiar">📋 Copiar Texto</button>
      <button type="button" class="btn btn-whatsapp" id="btnWhats">💬 Compartilhar no WhatsApp</button>
    </div>
  </div>
</div>

<script>
  // Mapeamento Oficial das Supervisões, Redes e Líderes do Ministério TOPO
  const dadosTopo = [

      ]
    },
    {
      supervisao: "Supervisão Monte Horebe",
      supervisor: "Andryo Henrique",
      redes: [
        { nome: "Rede Aljava", lider: "Taycilio" },
        { nome: "Rede Sal da Terra", lider: "Marcelo Flexa" },

      ]
    },
    {

      supervisor: "Diana Guerra",
      redes: [
        { nome: "Rede Flame", lider: "Cecília" },
        { nome: "Rede Aurora", lider: "Ester" },

      ]
    },
    {
      supervisao: "Supervisão Monte Moriá",
      supervisor: "Larissa Neves",
      redes: [
        { nome: "Rede Peregrina", lider: "Saiwry" },
        { nome: "Rede Lume", lider: "Myrella" },
        { nome: "Rede Promessa", lider: "Júlia" },
        { nome: "Rede Áquila", lider: "Thaynara" },

    },
    {
      supervisao: "Supervisão Monte Sinai",
      supervisor: "Sara Gomes",
      redes: [

        { nome: "Rede Dunamis", lider: "Mikaele" },
        { nome: "Rede Grace", lider: "Fernanda" },
        { nome: "Rede Graciosa", lider: "Gleicy" },
        { nome: "Rede Zoe", lider: "Karol" },
        { nome: "Rede Lamparinas", lider: "Laura Ester" }
      ]
    },
    {
      supervisao: "Supervisão Monte Sião",
      supervisor: "Clara Dione",
      redes: [
        { nome: "Rede Águias", lider: "Anny" },
        { nome: "Rede Hope", lider: "Laysa" },
        { nome: "Rede Bloom", lider: "Clara" },
        { nome: "Rede Herdeiras", lider: "Mika" }
      ]
    },
    {
      supervisao: "Supervisão Monte das Oliveiras",
      supervisor: "Letícia Sampaio",
      redes: [
        { nome: "Monte das Oliveiras", lider: "Letícia Sampaio" },
        { nome: "Rede Lily", lider: "Dayanne Lethicia" },
        { nome: "Rede Liz", lider: "Letícia Rodrigues" },
        { nome: "Rede Âmbar", lider: "Gabriella A." }
      ]
    },
    {
      supervisao: "Supervisão Monte Seir",
      supervisor: "Karol Nogueira",
      redes: [
        { nome: "Rede Joy", lider: "Leticia" },
        { nome: "Rede Legacy", lider: "Laura" },
        { nome: "Rede Ramá", lider: "Raianny" }
      ]
    }
  ];

  let fotoArquivo = null;

  document.addEventListener("DOMContentLoaded", function() {
    document.getElementById('dataRede').valueAsDate = new Date();

    // Carregar Supervisões no Select
    carregarSupervisoes();

    // Eventos dos selects encadeados
    document.getElementById('selectSupervisao').addEventListener('change', atualizarRedes);
    document.getElementById('selectRede').addEventListener('change', atualizarLider);

    // Eventos dos botões
    document.getElementById('btnAddPresente').addEventListener('click', () => adicionarPresente());
    document.getElementById('btnAddVisitante').addEventListener('click', () => adicionarVisitante());
    document.getElementById('btnAddFaltante').addEventListener('click', () => adicionarFaltante());
    document.getElementById('semVisitantes').addEventListener('change', toggleVisitantes);
    document.getElementById('fotoRede').addEventListener('change', previewFoto);
    document.getElementById('btnGerar').addEventListener('click', gerarRelatorio);
    document.getElementById('btnCopiar').addEventListener('click', copiarTexto);
    document.getElementById('btnWhats').addEventListener('click', compartilharWhatsApp);

    adicionarPresente();
  });

  function carregarSupervisoes() {
    const selectSup = document.getElementById('selectSupervisao');
    dadosTopo.forEach((item, index) => {
      const opt = document.createElement('option');
      opt.value = index;
      opt.textContent = `${item.supervisao} (${item.supervisor})`;
      selectSup.appendChild(opt);
    });
  }

  function atualizarRedes() {
    const indexSup = document.getElementById('selectSupervisao').value;
    const selectRede = document.getElementById('selectRede');
    const inputLider = document.getElementById('liderRede');

    selectRede.innerHTML = '';
    inputLider.value = '';

    if (indexSup === "") {
      selectRede.disabled = true;
      selectRede.innerHTML = '<option value="">Selecione primeiro a Supervisão</option>';
      return;
    }

    const supSelecionada = dadosTopo[indexSup];
    selectRede.disabled = false;
    selectRede.innerHTML = '<option value="">Selecione a Rede</option>';

    supSelecionada.redes.forEach((rede, index) => {
      const opt = document.createElement('option');
      opt.value = index;
      opt.textContent = `${rede.nome} (Líder: ${rede.lider})`;
      selectRede.appendChild(opt);
    });
  }

  function atualizarLider() {
    const indexSup = document.getElementById('selectSupervisao').value;
    const indexRede = document.getElementById('selectRede').value;
    const inputLider = document.getElementById('liderRede');

    if (indexSup !== "" && indexRede !== "") {
      const lider = dadosTopo[indexSup].redes[indexRede].lider;
      inputLider.value = lider;
    } else {
      inputLider.value = '';
    }
  }

  function previewFoto(event) {
    const file = event.target.files[0];
    const preview = document.getElementById('imgPreview');
    
    if (file) {
      fotoArquivo = file;
      const reader = new FileReader();
      reader.onload = function(e) {
        preview.src = e.target.result;
        preview.style.display = 'block';
      }
      reader.readAsDataURL(file);
    } else {
      fotoArquivo = null;
      preview.style.display = 'none';
    }
  }

  function adicionarPresente(valor = '') {
    const container = document.getElementById('listaPresentes');
    const div = document.createElement('div');
    div.className = 'dynamic-item';
    div.innerHTML = `
      <input type="text" class="input-presente" placeholder="Nome do participante" value="${valor}">
      <button type="button" class="btn btn-danger">✕</button>
    `;
    div.querySelector('.btn-danger').addEventListener('click', () => div.remove());
    container.appendChild(div);
  }

  function toggleVisitantes() {
    const semVisitantes = document.getElementById('semVisitantes').checked;
    const container = document.getElementById('containerVisitantes');
    container.style.display = semVisitantes ? 'none' : 'block';
  }

  function adicionarVisitante(valor = '') {
    const container = document.getElementById('listaVisitantes');
    const div = document.createElement('div');
    div.className = 'dynamic-item';
    div.innerHTML = `
      <input type="text" class="input-visitante" placeholder="Nome do visitante" value="${valor}">
      <button type="button" class="btn btn-danger">✕</button>
    `;
    div.querySelector('.btn-danger').addEventListener('click', () => div.remove());
    container.appendChild(div);
  }

  function adicionarFaltante() {
    const container = document.getElementById('listaFaltantes');
    const idUnico = 'semJust_' + Date.now() + Math.random().toString(36).substr(2, 4);
    
    const div = document.createElement('div');
    div.className = 'dynamic-item';
    div.style.flexDirection = 'column';
    div.style.alignItems = 'stretch';
    div.style.background = '#0D1117';
    div.style.padding = '12px';
    div.style.borderRadius = '8px';
    div.style.border = '1px solid #30363D';

    div.innerHTML = `
      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <input type="text" class="input-faltante-nome" placeholder="Nome de quem faltou" style="flex: 1;">
        <button type="button" class="btn btn-danger btn-remove-faltante">✕</button>
      </div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <input type="text" class="input-faltante-just" placeholder="Justificativa" style="flex: 1;">
        <div class="checkbox-group" style="margin: 0; white-space: nowrap;">
          <input type="checkbox" id="${idUnico}" class="check-sem-just">
          <label for="${idUnico}" style="margin: 0; text-transform: none;">Sem justificativa</label>
        </div>
      </div>
    `;

    div.querySelector('.btn-remove-faltante').addEventListener('click', () => div.remove());
    
    const checkbox = div.querySelector('.check-sem-just');
    checkbox.addEventListener('change', () => {
      const inputJust = div.querySelector('.input-faltante-just');
      if (checkbox.checked) {
        inputJust.value = '';
        inputJust.placeholder = 'Sem justificativa';
        inputJust.disabled = true;
      } else {
        inputJust.placeholder = 'Justificativa';
        inputJust.disabled = false;
      }
    });

    container.appendChild(div);
  }

  function formatarData(dataIso) {
    if (!dataIso) return '';
    const partes = dataIso.split('-');
    return `${partes[2]}/${partes[1]}/${partes[0]}`;
  }

  function gerarRelatorio() {
    const indexSup = document.getElementById('selectSupervisao').value;
    const indexRede = document.getElementById('selectRede').value;

    if (indexSup === "" || indexRede === "") {
      alert("Por favor, selecione a Supervisão e a Rede antes de gerar!");
      return;
    }

    const supObj = dadosTopo[indexSup];
    const redeObj = supObj.redes[indexRede];

    const supervisao = `${supObj.supervisao} (${supObj.supervisor})`;
    const nomeRede = redeObj.nome;
    const liderRede = redeObj.lider;
    const dataR = formatarData(document.getElementById('dataRede').value);
    const horario = document.getElementById('horarioRede').value || 'Não informado';
    const local = document.getElementById('localRede').value || 'Não informado';

    // Presentes
    const presentesInputs = document.querySelectorAll('.input-presente');
    const presentes = Array.from(presentesInputs).map(i => i.value.trim()).filter(v => v !== '');

    // Visitantes
    const semVisitantes = document.getElementById('semVisitantes').checked;
    let visitantes = [];
    if (!semVisitantes) {
      const visitantesInputs = document.querySelectorAll('.input-visitante');
      visitantes = Array.from(visitantesInputs).map(i => i.value.trim()).filter(v => v !== '');
    }

    // Faltantes
    const faltantesItems = document.querySelectorAll('#listaFaltantes .dynamic-item');
    const faltantes = [];
    faltantesItems.forEach(item => {
      const nome = item.querySelector('.input-faltante-nome').value.trim();
      const inputJust = item.querySelector('.input-faltante-just');
      const semJust = item.querySelector('.check-sem-just').checked;

      if (nome) {
        let just = semJust ? 'Sem justificativa' : (inputJust.value.trim() || 'Sem justificativa');
        faltantes.push({ nome, just });
      }
    });

    const tema = document.getElementById('tema').value || 'Não informado';
    const resumoPalavra = document.getElementById('resumoPalavra').value || 'Sem resumo';
    const resumoAtividades = document.getElementById('resumoAtividades').value || 'Sem registro';

    // Montar texto formatado
    let txt = `*RELATÓRIO DE REDE - MINISTÉRIO TOPO*\n`;
    txt += `──────────────────\n`;
    txt += `🏔️ *${supervisao}*\n`;
    txt += `📌 *Rede:* ${nomeRede}\n`;
    txt += `👤 *Líder:* ${liderRede}\n`;
    txt += `📅 *Data:* ${dataR} às ${horario}\n`;
    txt += `📍 *Local:* ${local}\n\n`;

    txt += `👥 *PRESENTES (${presentes.length}):*\n`;
    if (presentes.length > 0) {
      presentes.forEach(p => txt += `• ${p}\n`);
    } else {
      txt += `• Nenhum presente registrado\n`;
    }
    txt += `\n`;

    txt += `🤝 *VISITANTES:*\n`;
    if (semVisitantes) {
      txt += `• Não houveram visitantes\n`;
    } else if (visitantes.length > 0) {
      visitantes.forEach(v => txt += `• ${v}\n`);
    } else {
      txt += `• Nenhum visitante registrado\n`;
    }
    txt += `\n`;

    txt += `❌ *FALTANTES (${faltantes.length}):*\n`;
    if (faltantes.length > 0) {
      faltantes.forEach(f => txt += `• ${f.nome} _(${f.just})_\n`);
    } else {
      txt += `• Nenhuma falta registrada\n`;
    }
    txt += `\n`;

    txt += `📖 *TEMA:* ${tema}\n\n`;

    txt += `💬 *RESUMO DA PALAVRA:*\n${resumoPalavra}\n\n`;

    txt += `🎯 *RESUMO DAS ATIVIDADES:*\n${resumoAtividades}\n`;

    document.getElementById('textoRelatorio').innerText = txt;
    document.getElementById('outputArea').style.display = 'block';
    document.getElementById('outputArea').scrollIntoView({ behavior: 'smooth' });
  }

  async function compartilharWhatsApp() {
    const texto = document.getElementById('textoRelatorio').innerText;

    if (navigator.share && fotoArquivo) {
      try {
        const shareData = {
          text: texto,
          files: [fotoArquivo]
        };

        if (navigator.canShare && navigator.canShare(shareData)) {
          await navigator.share(shareData);
          return;
        }
      } catch (err) {
        if (err.name !== 'AbortError') {
          console.log('Erro no compartilhamento nativo:', err);
        } else {
          return;
        }
      }
    }

    const encodedTxt = encodeURIComponent(texto);
    const urlWa = `https://api.whatsapp.com/send?text=${encodedTxt}`;
    window.open(urlWa, '_blank');
  }

  function copiarTexto() {
    const texto = document.getElementById('textoRelatorio').innerText;
    navigator.clipboard.writeText(texto).then(() => {
      alert('Relatório copiado para a área de transferência!');
    }).catch(() => {
      alert('Erro ao copiar texto.');
    });
  }
</script>
