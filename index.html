<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ministério TOPO - Início</title>
  <style>
    :root {
      --bg: #0D0F12;
      --card-bg: #161B22;
      --card-border: #30363D;
      --text: #F0F6FC;
      --text-muted: #8B949E;
      --primary: #6E56CF;
      --primary-hover: #8B70F0;
      --accent-lider: #388BFD;
      --accent-supervisor: #F85149;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 32px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      max-width: 680px;
      width: 100%;
      text-align: center;
    }

    .badge-topo {
      display: inline-block;
      background: rgba(110, 86, 207, 0.15);
      color: #A58BFF;
      border: 1px solid rgba(110, 86, 207, 0.4);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 36px;
      line-height: 1.5;
    }

    /* Grid com as 2 Grandes Opções */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .card-menu {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 28px 20px;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 240px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .card-menu::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: var(--card-border);
      transition: background 0.25s ease;
    }

    .card-menu.lider::before { background: var(--accent-lider); }
    .card-menu.supervisor::before { background: var(--accent-supervisor); }

    .card-menu:hover {
      transform: translateY(-4px);
      border-color: #484F58;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .card-icon {
      font-size: 2.5rem;
      width: 64px;
      height: 64px;
      background: #0D1117;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .card-body h3 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text);
    }

    .card-body p {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .card-footer {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 20px;
    }

    .card-menu.supervisor .card-footer {
      color: #FF7B72;
    }

    /* Responsivo para Celulares */
    @media (max-width: 600px) {
      .menu-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      
      .card-menu {
        min-height: auto;
        flex-direction: row;
        align-items: center;
        text-align: left;
        padding: 20px;
      }

      .card-menu::before {
        width: 4px;
        height: 100%;
        top: 0;
        left: 0;
      }

      .card-icon {
        margin-bottom: 0;
        margin-right: 16px;
        flex-shrink: 0;
        width: 52px;
        height: 52px;
        font-size: 2rem;
      }

      .card-body {
        flex: 1;
      }

      .card-footer {
        margin-top: 0;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <span class="badge-topo">MINISTÉRIO TOPO</span>
  <h1>Portal de Gestão</h1>
  <p class="subtitle">Selecione o seu nível de acesso para continuar</p>

  <div class="menu-grid">
    
    <!-- 1. Área do Líder de Rede -->
    <a href="lider.html" class="card-menu lider">
      <div class="card-icon">👥</div>
      <div class="card-body">
        <h3>Área do Líder de Rede</h3>
        <p>Relatórios semanais, cadastro de membros e painel da sua rede</p>
      </div>
      <div class="card-footer">
        Acessar <span>➔</span>
      </div>
    </a>

    <!-- 2. Área do Supervisor (Protegida) -->
    <a href="supervisor.html" class="card-menu supervisor">
      <div class="card-icon">🔐</div>
      <div class="card-body">
        <h3>Área do Supervisor</h3>
        <p>Visão macro, acompanhamento de faltas e suporte às redes</p>
      </div>
      <div class="card-footer">
        Entrar <span>➔</span>
      </div>
    </a>

  </div>
</div>

</body>
</html>
