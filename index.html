<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ministério TOPO - Início</title>
  <style>
    :root {
      --bg: #0D0F12;
      --card-bg: #161B22;
      --card-border: #30363D;
      --text: #F0F6FC;
      --text-muted: #8B949E;
      --primary: #6E56CF;
      --primary-hover: #5B45B0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      max-width: 500px;
      width: 100%;
      background: var(--card-bg);
      padding: 36px 24px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .badge-topo {
      display: inline-block;
      background: var(--primary);
      color: #FFF;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .menu-options {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn-menu {
      background-color: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--card-border);
      padding: 16px 20px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1.05rem;
      transition: all 0.2s ease;
      text-align: left;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-menu:hover {
      background-color: #21262D;
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .btn-menu span.icon {
      font-size: 1.3rem;
    }
  </style>
</head>
<body>

<div class="container">
  <span class="badge-topo">MINISTÉRIO TOPO</span>
  <h1>Painel de Redes</h1>
  <p>Selecione abaixo a opção desejada para gerenciar as atividades da sua rede.</p>

  <div class="menu-options">
    <a href="relatorio.html" class="btn-menu">
      <div>
        <strong>📋 Relatório de Rede</strong>
        <div style="font-size: 0.82rem; color: var(--text-muted); font-weight: normal; margin-top: 4px;">Preencher resumo do encontro semanal</div>
      </div>
      <span class="icon">➔</span>
    </a>

    <a href="cadastro.html" class="btn-menu">
      <div>
        <strong>👤 Cadastro de Liderados</strong>
        <div style="font-size: 0.82rem; color: var(--text-muted); font-weight: normal; margin-top: 4px;">Adicionar novos membros à rede</div>
      </div>
      <span class="icon">➔</span>
    </a>
  </div>
</div>

</body>
</html>
